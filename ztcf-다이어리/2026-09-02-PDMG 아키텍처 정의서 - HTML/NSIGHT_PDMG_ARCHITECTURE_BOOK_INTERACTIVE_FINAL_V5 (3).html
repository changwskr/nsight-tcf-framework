할 text online service ↓ rdw operational / near-real-time ↓ bounded latency rdw는 online/operational workload를 지키는 영역으로 봅니다. 여기에는 즉시 조회·거래에 필요한 데이터가 집중되고, heavy analysis가 자원을 독점하지 않도록 해야 합니다. 실제 table/schema ownership은 추가 registry가 필요합니다. ---"}, {"id": "topic-10-5", "chapter": 10, "page": 5, "title": "4. ADW 역할", "preview": "FIG-10-05. ADW 역할 text RDW / Source ↓ ETL / Data Movement ↓ ADW ↓ Mart / Aggregate", "column": 3, "html": "<h2>4. ADW 역할<\/h2>\n<h3>FIG-10-05. ADW 역할<\/h3>\n<pre class=\"text-architecture\">RDW / Source\n ↓\nETL / Data Movement\n ↓\nADW\n ↓\nMart / Aggregate\n ↓\nBI / Analytics<\/pre>\n<p>ADW는 분석과 집계, Mart, Heavy Query를 담당하는 Target 역할입니다.<\/p>\n<p>PDMG Current가 ADW를 직접 사용하는지는 아직 Datasource/Mapper Inventory가 필요합니다.<\/p>\n<p>따라서 ADW는 Target Reference와 Current Evidence를 구분해 설명합니다.<\/p>\n<hr>", "search": "4. adw 역할 fig-10-05. adw 역할 text rdw / source ↓ etl / data movement ↓ adw ↓ mart / aggregate ↓ bi / analytics adw는 분석과 집계, mart, heavy query를 담당하는 target 역할입니다. pdmg current가 adw를 직접 사용하는지는 아직 datasource/mapper inventory가 필요합니다. 따라서 adw는 target reference와 current evidence를 구분해 설명합니다. ---"}, {"id": "topic-10-6", "chapter": 10, "page": 6, "title": "5. ServiceId→Table Trace", "preview": "FIG-10-06. ServiceId→Table Trace text ServiceId ↓ DAO ↓ Mapper Namespace ↓ SqlId", "column": 1, "html": "<h2>5. ServiceId→Table Trace<\/h2>\n<h3>FIG-10-06. ServiceId→Table Trace<\/h3>\n<pre class=\"text-architecture\">ServiceId\n ↓\nDAO\n ↓\nMapper Namespace\n ↓\nSqlId\n ↓\nSQL\n ↓\nTable / View<\/pre>\n<p>Data Lineage를 Application과 연결하는 핵심축입니다.<\/p>\n<p>어떤 ServiceId가 어떤 SqlId와 Table을 사용하는지 추적할 수 있어야 변경영향과 성능분석이 가능합니다.<\/p>\n<p>이 Trace는 수동 문서가 아니라 자동 Index가 목표입니다.<\/p>\n<hr>", "search": "5. serviceid→table trace fig-10-06. serviceid→table trace text serviceid ↓ dao ↓ mapper namespace ↓ sqlid ↓ sql ↓ table / view data lineage를 application과 연결하는 핵심축입니다. 어떤 serviceid가 어떤 sqlid와 table을 사용하는지 추적할 수 있어야 변경영향과 성능분석이 가능합니다. 이 trace는 수동 문서가 아니라 자동 index가 목표입니다. ---"}, {"id": "topic-10-7", "chapter": 10, "page": 7, "title": "6. CDC와 ETL 분리", "preview": "FIG-10-07. CDC와 ETL 분리 text Change Data Source DB → CDC → RDW/Consumer Bulk Data Source → ETL → ADW", "column": 0, "html": "<h2>6. CDC와 ETL 분리<\/h2>\n<h3>FIG-10-07. CDC와 ETL 분리<\/h3>\n<pre class=\"text-architecture\">Change Data\nSource DB → CDC → RDW/Consumer\n\nBulk Data\nSource → ETL → ADW<\/pre>\n<p>CDC와 ETL은 목적이 다릅니다.<\/p>\n<p>CDC는 Change를 빠르게 전달하고, ETL은 대량 변환/적재에 적합합니다. 하나를 다른 목적에 무리하게 사용하면 지연이나 운영복잡도가 커집니다.<\/p>\n<p>CDC Freshness 3s와 30s 충돌은 SLA Tier로 정리해야 합니다.<\/p>\n<hr>", "search": "6. cdc와 etl 분리 fig-10-07. cdc와 etl 분리 text change data source db → cdc → rdw/consumer bulk data source → etl → adw cdc와 etl은 목적이 다릅니다. cdc는 change를 빠르게 전달하고, etl은 대량 변환/적재에 적합합니다. 하나를 다른 목적에 무리하게 사용하면 지연이나 운영복잡도가 커집니다. cdc freshness 3s와 30s 충돌은 sla tier로 정리해야 합니다. ---"}, {"id": "topic-10-8", "chapter": 10, "page": 8, "title": "7. Data Ownership / Direct DML", "preview": "FIG-10-08. Data Ownership / Direct DML text Own Data Read / Write Other System Data ↓ Approved Contract", "column": 1, "html": "<h2>7. Data Ownership / Direct DML<\/h2>\n<h3>FIG-10-08. Data Ownership / Direct DML<\/h3>\n<pre class=\"text-architecture\">Own Data\n Read / Write\n\nOther System Data\n ↓\nApproved Contract\n\nDirect DML\n X<\/pre>\n<p>Data Ownership이 불명확하면 시스템 경계도 무너집니다.<\/p>\n<p>타 시스템 Table을 직접 DML하면 변경 영향, Lock, 보안, 운영책임이 강하게 결합됩니다.<\/p>\n<p>따라서 Cross-system Direct DML은 기본 금지로 보고 예외는 ADR로 관리합니다.<\/p>\n<hr>", "search": "7. data ownership / direct dml fig-10-08. data ownership / direct dml text own data read / write other system data ↓ approved contract direct dml x data ownership이 불명확하면 시스템 경계도 무너집니다. 타 시스템 table을 직접 dml하면 변경 영향, lock, 보안, 운영책임이 강하게 결합됩니다. 따라서 cross-system direct dml은 기본 금지로 보고 예외는 adr로 관리합니다. ---"}, {"id": "topic-10-9", "chapter": 10, "page": 9, "title": "8. Data Evidence", "preview": "FIG-10-09. Data Evidence text ServiceId ↓ SqlId ↓ Table ↓ elapsed / rows / error", "column": 3, "html": "<h2>8. Data Evidence<\/h2>\n<h3>FIG-10-09. Data Evidence<\/h3>\n<pre class=\"text-architecture\">ServiceId\n ↓\nSqlId\n ↓\nTable\n ↓\nelapsed / rows / error\n ↓\nGUID\n ↓\nEvidence<\/pre>\n<p>Data Architecture도 Runtime Evidence로 닫아야 합니다.<\/p>\n<p>어떤 거래가 어떤 SQL을 실행했고 얼마나 걸렸는지 연결되면 Performance와 Data Lineage를 함께 볼 수 있습니다.<\/p>\n<p>이 Evidence가 13장 Closed Loop의 입력이 됩니다.<\/p>\n<hr>", "search": "8. data evidence fig-10-09. data evidence text serviceid ↓ sqlid ↓ table ↓ elapsed / rows / error ↓ guid ↓ evidence data architecture도 runtime evidence로 닫아야 합니다. 어떤 거래가 어떤 sql을 실행했고 얼마나 걸렸는지 연결되면 performance와 data lineage를 함께 볼 수 있습니다. 이 evidence가 13장 closed loop의 입력이 됩니다. ---"}, {"id": "topic-10-10", "chapter": 10, "page": 10, "title": "정상패턴과 금지패턴", "preview": "FIG-10-10. Normal Pattern text ServiceId→SqlId→Table / Online→RDW / Analysis→ADW 정상패턴은 Online Operational Workload를 RDW에서 보호하고 Heavy Analysis는 ADW로 분리하며 Data Access를 ServiceId→SqlId→Table까지 …", "column": 3, "html": "<h2>정상패턴과 금지패턴<\/h2>\n<h3>FIG-10-10. Normal Pattern<\/h3>\n<pre class=\"text-architecture\">ServiceId→SqlId→Table / Online→RDW / Analysis→ADW<\/pre>\n<p>정상패턴은 Online Operational Workload를 RDW에서 보호하고 Heavy Analysis는 ADW로 분리하며 Data Access를 ServiceId→SqlId→Table까지 추적하는 것입니다.<\/p>\n<h3>FIG-10-11. Forbidden Pattern<\/h3>\n<pre class=\"text-architecture\">Cross-system DML / Heavy Query→Online<\/pre>\n<p>Cross-system Direct DML, Heavy BI Query의 Online RDW 직접 수행, 근거 없는 ADW Current 표시를 금지합니다.<\/p>\n<hr>", "search": "정상패턴과 금지패턴 fig-10-10. normal pattern text serviceid→sqlid→table / online→rdw / analysis→adw 정상패턴은 online operational workload를 rdw에서 보호하고 heavy analysis는 adw로 분리하며 data access를 serviceid→sqlid→table까지 추적하는 것입니다. fig-10-11. forbidden pattern text cross-system dml / heavy query→online cross-system direct dml, heavy bi query의 online rdw 직접 수행, 근거 없는 adw current 표시를 금지합니다. ---"}, {"id": "topic-10-11", "chapter": 10, "page": 11, "title": "Architecture Decision", "preview": "FIG-10-12. 주안과 대안 text [주안] RDW/ADW Workload 분리 VS [대안] RDW 중심 통합사용", "column": 3, "html": "<h2>Architecture Decision<\/h2>\n<h3>FIG-10-12. 주안과 대안<\/h3>\n<pre class=\"text-architecture\">[주안]\nRDW/ADW Workload 분리\n\n        VS\n\n[대안]\nRDW 중심 통합사용<\/pre>\n<p>RDW는 Operational SLA를 보호하고 ADW는 Analytical Workload를 담당하도록 역할을 분리합니다.<\/p>\n<p>RDW 중심 통합사용은 Data Copy를 줄일 수 있지만 Heavy Analysis가 Online Workload와 Resource를 경쟁하게 되므로 기본안으로 두지 않습니다.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>평가축<\/th><th>주안<\/th><th>대안<\/th><\/tr><\/thead><tbody><tr><td>책임/경계<\/td><td>명확<\/td><td>추가 보완 필요<\/td><\/tr><tr><td>Current PDMG 정합<\/td><td>높음<\/td><td>변경범위 가능<\/td><\/tr><tr><td>운영/장애분석<\/td><td>Trace 용이<\/td><td>복잡도 증가 가능<\/td><\/tr><tr><td>승인조건<\/td><td>기본 Rule/Test<\/td><td>별도 ADR + Evidence<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>", "search": "architecture decision fig-10-12. 주안과 대안 text [주안] rdw/adw workload 분리 vs [대안] rdw 중심 통합사용 rdw는 operational sla를 보호하고 adw는 analytical workload를 담당하도록 역할을 분리합니다. rdw 중심 통합사용은 data copy를 줄일 수 있지만 heavy analysis가 online workload와 resource를 경쟁하게 되므로 기본안으로 두지 않습니다. | 평가축 | 주안 | 대안 | |---|---|---| | 책임/경계 | 명확 | 추가 보완 필요 | | current pdmg 정합 | 높음 | 변경범위 가능 | | 운영/장애분석 | trace 용이 | 복잡도 증가 가능 | | 승인조건 | 기본 rule/test | 별도 adr + evidence | ---"}, {"id": "topic-10-12", "chapter": 10, "page": 12, "title": "Evidence / Conformance — 이 장의 Architecture를 무엇으로 증명하는가", "preview": "Evidence Architecture text 데이터플랫폼 Architecture Rule ↓ Source Evidence ↓ Config Evidence ↓ Runtime / Deployment Evidence", "column": 3, "html": "<h2>Evidence / Conformance — 이 장의 Architecture를 무엇으로 증명하는가<\/h2>\n<h3>Evidence Architecture<\/h3>\n<pre class=\"text-architecture\">데이터플랫폼 Architecture Rule\n        ↓\nSource Evidence\n        ↓\nConfig Evidence\n        ↓\nRuntime / Deployment Evidence\n        ↓\nConformance Test\n        ↓\nPASS / GAP / ADR<\/pre>\n<h4>Source Evidence<\/h4>\n<ul><li><code>[SOURCE]<\/code> DAO / Mapper / SqlId / RDW Current 경로<\/li><li><code>[SOURCE]<\/code> Data Architecture / Interface / Event-CDC-ETL 분석<\/li><\/ul>\n<h4>Config Evidence<\/h4>\n<ul><li><code>[CONFIG]<\/code> Datasource/Mapper Inventory 필요<\/li><li><code>[CONFIG]<\/code> CDC SLA baseline 충돌 3s vs 30s<\/li><\/ul>\n<h4>Runtime / Deployment Evidence<\/h4>\n<ul><li><code>[RUNTIME]<\/code> ServiceId→DAO→Mapper→SqlId→Table Trace<\/li><li><code>[RUNTIME]<\/code> RDW Operational / ADW Analytical Target<\/li><\/ul>\n<h4>Architecture Decision<\/h4>\n<ul><li><code>[DECISION]<\/code> RDW/ADW Workload Separation<\/li><li><code>[DECISION]<\/code> Cross-system Direct DML 금지<\/li><\/ul>\n<h4>Related ADR<\/h4>\n<ul><li><code>ADR-015 Direct DB 제한<\/code><\/li><li><code>ADR-021 RDW/ADW 분리<\/code><\/li><li><code>ADR-022 CDC SLA<\/code><\/li><\/ul>\n<h4>Current GAP / OPEN<\/h4>\n<ul><li><code>[GAP/OPEN]<\/code> RDW/ADW 실제 Mapping<\/li><li><code>[GAP/OPEN]<\/code> Ownership<\/li><li><code>[GAP/OPEN]<\/code> Lineage/DQ 자동화<\/li><li><code>[GAP/OPEN]<\/code> CDC SLA Conflict<\/li><\/ul>\n<h3>이 장의 판정<\/h3>\n<pre class=\"text-architecture\">Architecture Definition\n        ↓\nPASS\n\nCurrent PDMG Conformance\n        ↓\nPARTIAL / CONDITIONAL\n\nRuntime Evidence Coverage\n        ↓\nMEDIUM\n\nArchitecture Definition PASS\n        ≠\nCurrent Implementation PASS<\/pre>\n<h4>PASS 전환조건<\/h4>\n<ul><li><code>RDW/ADW Datasource Mapping<\/code><\/li><li><code>Table Ownership/Lineage<\/code><\/li><li><code>CDC SLA ADR<\/code><\/li><li><code>Data Runtime Evidence<\/code><\/li><\/ul>\n<p>위 조건은 문서 완성도가 아니라 <strong>Current Implementation Conformance를 PASS로 전환하기 위한 Exit Criteria<\/strong>다. 해당 Evidence가 확보되기 전에는 <code>[GAP]<\/code>, <code>[OPEN]<\/code>, <code>[UNKNOWN]<\/code> 상태를 유지한다.<\/p>\n<hr>", "search": "evidence / conformance — 이 장의 architecture를 무엇으로 증명하는가 evidence architecture text 데이터플랫폼 architecture rule ↓ source evidence ↓ config evidence ↓ runtime / deployment evidence ↓ conformance test ↓ pass / gap / adr source evidence - [source] dao / mapper / sqlid / rdw current 경로 - [source] data architecture / interface / event-cdc-etl 분석 config evidence - [config] datasource/mapper inventory 필요 - [config] cdc sla baseline 충돌 3s vs 30s runtime / deployment evidence - [runtime] serviceid→dao→mapper→sqlid→table trace - [runtime] rdw operational / adw analytical target architecture decision - [decision] rdw/adw workload separation - [decision] cross-system direct dml 금지 related adr - adr-015 direct db 제한 - adr-021 rdw/adw 분리 - adr-022 cdc sla current gap / open - [gap/open] rdw/adw 실제 mapping - [gap/open] ownership - [gap/open] lineage/dq 자동화 - [gap/open] cdc sla conflict 이 장의 판정 text architecture definition ↓ pass current pdmg conformance ↓ partial / conditional runtime evidence coverage ↓ medium architecture definition pass ≠ current implementation pass pass 전환조건 - rdw/adw datasource mapping - table ownership/lineage - cdc sla adr - data runtime evidence 위 조건은 문서 완성도가 아니라 current implementation conformance를 pass로 전환하기 위한 exit criteria다. 해당 evidence가 확보되기 전에는 [gap], [open], [unknown] 상태를 유지한다. ---"}, {"id": "topic-10-13", "chapter": 10, "page": 13, "title": "Chapter Closing Script", "preview": "FIG-10-16. 다음 장 Handoff text 데이터플랫폼 ↓ RDW는 실시간을 지키고 ADW는 분석을 극대화한다 ↓ 남은 질문 \"배치형 캠페인에서 고객 행동에 반응하는 플랫폼으로\" ↓", "column": 1, "html": "<h2>Chapter Closing Script<\/h2>\n<h3>FIG-10-16. 다음 장 Handoff<\/h3>\n<pre class=\"text-architecture\">데이터플랫폼\n ↓\nRDW는 실시간을 지키고 ADW는 분석을 극대화한다\n ↓\n남은 질문\n&quot;배치형 캠페인에서 고객 행동에 반응하는 플랫폼으로&quot;\n ↓\n마케팅플랫폼<\/pre>\n<p>Data Platform에서 신뢰할 수 있는 Operational/Analytical 경계를 만들었습니다. 다음 장에서는 이 Data와 PDMG Runtime이 Marketing Platform의 실행구조에서 어떻게 사용되는지 연결합니다.<\/p>", "search": "chapter closing script fig-10-16. 다음 장 handoff text 데이터플랫폼 ↓ rdw는 실시간을 지키고 adw는 분석을 극대화한다 ↓ 남은 질문 \"배치형 캠페인에서 고객 행동에 반응하는 플랫폼으로\" ↓ 마케팅플랫폼 data platform에서 신뢰할 수 있는 operational/analytical 경계를 만들었습니다. 다음 장에서는 이 data와 pdmg runtime이 marketing platform의 실행구조에서 어떻게 사용되는지 연결합니다."}, {"id": "topic-11-1", "chapter": 11, "page": 1, "title": "0. Opening Script", "preview": "데이터가 준비되면 그 데이터를 실제 고객 접점에서 사용하는 실행플랫폼이 필요합니다. 이 장에서 PDMG는 Marketing Platform 전체를 의미하지 않습니다. PDMG는 UI·JWT·Framework·ServiceId 기반 Business Runtime을 보여주는 Current Reference입니다. NSIGHT의 Event/Ka…", "column": 1, "html": "<h2>0. Opening Script<\/h2>\n<p>데이터가 준비되면 그 데이터를 실제 고객 접점에서 사용하는 실행플랫폼이 필요합니다.<\/p>\n<p>이 장에서 PDMG는 Marketing Platform 전체를 의미하지 않습니다. PDMG는 <strong>UI·JWT·Framework·ServiceId 기반 Business Runtime을 보여주는 Current Reference<\/strong>입니다.<\/p>\n<p>NSIGHT의 Event/Kafka/Real-time Target은 별도 Target으로 분리해 설명합니다.<\/p>\n<h3>FIG-11-01. 장 전체 Architecture<\/h3>\n<pre class=\"text-architecture\">NSIGHT Marketing Platform\n        ↓\nApproved Mapping\n        ↓\nPDMG Reference\nUI / JWT / Framework / ServiceId\n        ↓\nBusiness Runtime\n        ↓\nRDW / Interface\n\nTarget Extension\nEvent / Kafka / Real-time Decision<\/pre>\n<p>Marketing Platform에서는 PDMG를 전체 마케팅 플랫폼과 동일시하지 않습니다. PDMG는 ServiceId 기반의 실행 Runtime Reference이며, Event/Kafka 기반 Real-time Marketing은 NSIGHT Target으로 분리합니다. 두 세계는 명시적인 Mapping Registry와 Interface Contract로 연결합니다.<\/p>\n<hr>", "search": "0. opening script 데이터가 준비되면 그 데이터를 실제 고객 접점에서 사용하는 실행플랫폼이 필요합니다. 이 장에서 pdmg는 marketing platform 전체를 의미하지 않습니다. pdmg는 ui·jwt·framework·serviceid 기반 business runtime을 보여주는 current reference입니다. nsight의 event/kafka/real-time target은 별도 target으로 분리해 설명합니다. fig-11-01. 장 전체 architecture text nsight marketing platform ↓ approved mapping ↓ pdmg reference ui / jwt / framework / serviceid ↓ business runtime ↓ rdw / interface target extension event / kafka / real-time decision marketing platform에서는 pdmg를 전체 마케팅 플랫폼과 동일시하지 않습니다. pdmg는 serviceid 기반의 실행 runtime reference이며, event/kafka 기반 real-time marketing은 nsight target으로 분리합니다. 두 세계는 명시적인 mapping registry와 interface contract로 연결합니다. ---"}, {"id": "topic-11-2", "chapter": 11, "page": 2, "title": "1. PDMG Runtime Reference", "preview": "FIG-11-02. PDMG Runtime Reference text pdmg-ui pdmg-jwt pdmg-service └─ pdmg-fw pdmg-om [UNKNOWN]", "column": 1, "html": "<h2>1. PDMG Runtime Reference<\/h2>\n<h3>FIG-11-02. PDMG Runtime Reference<\/h3>\n<pre class=\"text-architecture\">pdmg-ui\npdmg-jwt\npdmg-service\n └─ pdmg-fw\npdmg-om [UNKNOWN]<\/pre>\n<p>PDMG는 Marketing Application의 실행패턴을 보여주는 중요한 Reference입니다.<\/p>\n<p>다만 <code>pdmg-om<\/code>은 Current 구현범위가 충분히 확인되지 않았고, Marketing Platform 전체 기능을 PDMG로 대표할 수는 없습니다.<\/p>\n<p>그래서 Current Reference라는 표현을 유지합니다.<\/p>\n<hr>", "search": "1. pdmg runtime reference fig-11-02. pdmg runtime reference text pdmg-ui pdmg-jwt pdmg-service └─ pdmg-fw pdmg-om [unknown] pdmg는 marketing application의 실행패턴을 보여주는 중요한 reference입니다. 다만 pdmg-om은 current 구현범위가 충분히 확인되지 않았고, marketing platform 전체 기능을 pdmg로 대표할 수는 없습니다. 그래서 current reference라는 표현을 유지합니다. ---"}, {"id": "topic-11-3", "chapter": 11, "page": 3, "title": "2. Program과 ServiceId", "preview": "FIG-11-03. Program과 ServiceId text mg | co | a | 9001 ↓ mgcoa9001 ↓ mgcoa9001S0 ↓ Handler / Use Case", "column": 1, "html": "<h2>2. Program과 ServiceId<\/h2>\n<h3>FIG-11-03. Program과 ServiceId<\/h3>\n<pre class=\"text-architecture\">mg | co | a | 9001\n ↓\nmgcoa9001\n ↓\nmgcoa9001S0\n ↓\nHandler / Use Case<\/pre>\n<p>Marketing Runtime의 Source Trace는 Program과 ServiceId에서 시작합니다.<\/p>\n<p>Program ID는 업무코드 축을 반영하고 ServiceId는 거래유형까지 포함합니다.<\/p>\n<p>이 ID는 Registry, Logging, SQL Trace까지 연결됩니다.<\/p>\n<hr>", "search": "2. program과 serviceid fig-11-03. program과 serviceid text mg | co | a | 9001 ↓ mgcoa9001 ↓ mgcoa9001s0 ↓ handler / use case marketing runtime의 source trace는 program과 serviceid에서 시작합니다. program id는 업무코드 축을 반영하고 serviceid는 거래유형까지 포함합니다. 이 id는 registry, logging, sql trace까지 연결됩니다. ---"}, {"id": "topic-11-4", "chapter": 11, "page": 4, "title": "3. Business Runtime", "preview": "FIG-11-04. Business Runtime text UI ↓ ServiceId ↓ Handler ↓ Facade", "column": 1, "html": "<h2>3. Business Runtime<\/h2>\n<h3>FIG-11-04. Business Runtime<\/h3>\n<pre class=\"text-architecture\">UI\n ↓\nServiceId\n ↓\nHandler\n ↓\nFacade\n ↓\nService\n ↓\nDAO / RDW<\/pre>\n<p>현재 PDMG의 강점은 ServiceId에서 Business Layer와 Data Access까지 이어지는 실행축입니다.<\/p>\n<p>TCF ON에서는 Handler가 Facade를 향하고, Target에서는 TCF OFF Controller도 같은 Facade를 향하도록 정렬하는 것이 주안입니다.<\/p>\n<p>이렇게 해야 Marketing Use Case의 경계가 Entry Mechanism에 따라 달라지지 않습니다.<\/p>\n<hr>", "search": "3. business runtime fig-11-04. business runtime text ui ↓ serviceid ↓ handler ↓ facade ↓ service ↓ dao / rdw 현재 pdmg의 강점은 serviceid에서 business layer와 data access까지 이어지는 실행축입니다. tcf on에서는 handler가 facade를 향하고, target에서는 tcf off controller도 같은 facade를 향하도록 정렬하는 것이 주안입니다. 이렇게 해야 marketing use case의 경계가 entry mechanism에 따라 달라지지 않습니다. ---"}, {"id": "topic-11-5", "chapter": 11, "page": 5, "title": "4. Customer Context / Identity", "preview": "FIG-11-05. Customer Context / Identity text JWT Principal ↓ Business User Context ↓ Customer / Session Context ↓ ServiceId Execution", "column": 2, "html": "<h2>4. Customer Context / Identity<\/h2>\n<h3>FIG-11-05. Customer Context / Identity<\/h3>\n<pre class=\"text-architecture\">JWT Principal\n ↓\nBusiness User Context\n ↓\nCustomer / Session Context\n ↓\nServiceId Execution<\/pre>\n<p>마케팅은 고객맥락을 많이 사용하기 때문에 Identity Binding이 중요합니다.<\/p>\n<p>JWT의 <code>sub/ssoId<\/code>와 Header의 사용자정보를 신뢰 없이 합치면 잘못된 고객문맥이 업무에 들어갈 수 있습니다.<\/p>\n<p>Security GAP를 Marketing Runtime의 핵심조건으로 봅니다.<\/p>\n<hr>", "search": "4. customer context / identity fig-11-05. customer context / identity text jwt principal ↓ business user context ↓ customer / session context ↓ serviceid execution 마케팅은 고객맥락을 많이 사용하기 때문에 identity binding이 중요합니다. jwt의 sub/ssoid와 header의 사용자정보를 신뢰 없이 합치면 잘못된 고객문맥이 업무에 들어갈 수 있습니다. security gap를 marketing runtime의 핵심조건으로 봅니다. ---"}, {"id": "topic-11-6", "chapter": 11, "page": 6, "title": "5. External Interface", "preview": "FIG-11-06. External Interface text Marketing Service ↓ Interface Contract ↓ API / Event / File ↓ External Platform", "column": 1, "html": "<h2>5. External Interface<\/h2>\n<h3>FIG-11-06. External Interface<\/h3>\n<pre class=\"text-architecture\">Marketing Service\n ↓\nInterface Contract\n ↓\nAPI / Event / File\n ↓\nExternal Platform<\/pre>\n<p>Marketing은 여러 외부/내부 시스템과 연결될 가능성이 높습니다.<\/p>\n<p>하지만 연결선이 많아질수록 P2P 강결합 위험이 커집니다. 그래서 Interface Contract를 통해 호출/이벤트/파일을 분리합니다.<\/p>\n<p>Current Inventory가 없으면 특정 연계기술을 AS-IS로 단정하지 않습니다.<\/p>\n<hr>", "search": "5. external interface fig-11-06. external interface text marketing service ↓ interface contract ↓ api / event / file ↓ external platform marketing은 여러 외부/내부 시스템과 연결될 가능성이 높습니다. 하지만 연결선이 많아질수록 p2p 강결합 위험이 커집니다. 그래서 interface contract를 통해 호출/이벤트/파일을 분리합니다. current inventory가 없으면 특정 연계기술을 as-is로 단정하지 않습니다. ---"}, {"id": "topic-11-7", "chapter": 11, "page": 7, "title": "6. Event/Kafka Target", "preview": "FIG-11-07. Event/Kafka Target text Customer Action ↓ Event ↓ Kafka / Event Platform ↓ Consumer / Decision", "column": 1, "html": "<h2>6. Event/Kafka Target<\/h2>\n<h3>FIG-11-07. Event/Kafka Target<\/h3>\n<pre class=\"text-architecture\">Customer Action\n ↓\nEvent\n ↓\nKafka / Event Platform\n ↓\nConsumer / Decision\n ↓\nResponse / Offering\n\n[NSIGHT TARGET]<\/pre>\n<p>실시간 마케팅 Target은 고객행동을 Event로 처리하는 방향을 가질 수 있습니다.<\/p>\n<p>하지만 이 구조가 PDMG Current Source에 구현되어 있다고 자동으로 말하지 않습니다.<\/p>\n<p>Current HTTP/TCF Runtime과 Target Event Runtime을 명확히 분리합니다.<\/p>\n<hr>", "search": "6. event/kafka target fig-11-07. event/kafka target text customer action ↓ event ↓ kafka / event platform ↓ consumer / decision ↓ response / offering [nsight target] 실시간 마케팅 target은 고객행동을 event로 처리하는 방향을 가질 수 있습니다. 하지만 이 구조가 pdmg current source에 구현되어 있다고 자동으로 말하지 않습니다. current http/tcf runtime과 target event runtime을 명확히 분리합니다. ---"}, {"id": "topic-11-8", "chapter": 11, "page": 8, "title": "7. MP ↔ mg Mapping", "preview": "FIG-11-08. MP ↔ mg Mapping text NSIGHT Target MP │ │ Mapping Registry / ADR ▼ PDMG AS-IS mg", "column": 2, "html": "<h2>7. MP ↔ mg Mapping<\/h2>\n<h3>FIG-11-08. MP ↔ mg Mapping<\/h3>\n<pre class=\"text-architecture\">NSIGHT Target\nMP\n │\n │ Mapping Registry / ADR\n ▼\nPDMG AS-IS\nmg\n\nMP ≠ mg automatically<\/pre>\n<p>이것은 Naming이 아니라 Architecture Governance 문제입니다.<\/p>\n<p>NSIGHT의 <code>MP<\/code>와 PDMG Source의 <code>mg<\/code>는 이름이 비슷해도 동일한 식별자라고 자동 가정하지 않습니다.<\/p>\n<p>공식 Mapping Registry와 ADR가 필요합니다.<\/p>\n<hr>", "search": "7. mp ↔ mg mapping fig-11-08. mp ↔ mg mapping text nsight target mp │ │ mapping registry / adr ▼ pdmg as-is mg mp ≠ mg automatically 이것은 naming이 아니라 architecture governance 문제입니다. nsight의 mp와 pdmg source의 mg는 이름이 비슷해도 동일한 식별자라고 자동 가정하지 않습니다. 공식 mapping registry와 adr가 필요합니다. ---"}, {"id": "topic-11-9", "chapter": 11, "page": 9, "title": "8. Marketing Runtime Evidence", "preview": "FIG-11-09. Marketing Runtime Evidence text Customer Action ↓ ServiceId ↓ GUID ↓ Business / Data / Interface", "column": 1, "html": "<h2>8. Marketing Runtime Evidence<\/h2>\n<h3>FIG-11-09. Marketing Runtime Evidence<\/h3>\n<pre class=\"text-architecture\">Customer Action\n ↓\nServiceId\n ↓\nGUID\n ↓\nBusiness / Data / Interface\n ↓\nResult\n ↓\nEvidence<\/pre>\n<p>마케팅 실행도 결국 Evidence로 닫아야 합니다.<\/p>\n<p>어떤 고객행동이 어떤 ServiceId와 Data/Interface를 거쳐 어떤 결과를 만들었는지 추적할 수 있어야 합니다.<\/p>\n<p>이 축이 캠페인/추천 품질분석에도 연결될 수 있습니다.<\/p>\n<hr>", "search": "8. marketing runtime evidence fig-11-09. marketing runtime evidence text customer action ↓ serviceid ↓ guid ↓ business / data / interface ↓ result ↓ evidence 마케팅 실행도 결국 evidence로 닫아야 합니다. 어떤 고객행동이 어떤 serviceid와 data/interface를 거쳐 어떤 결과를 만들었는지 추적할 수 있어야 합니다. 이 축이 캠페인/추천 품질분석에도 연결될 수 있습니다. ---"}, {"id": "topic-11-10", "chapter": 11, "page": 10, "title": "정상패턴과 금지패턴", "preview": "FIG-11-10. Normal Pattern text MP→Mapping→PDMG ServiceId→Runtime 정상패턴은 PDMG Current Runtime과 NSIGHT Marketing Target을 분리하고 공식 Mapping/Interface Contract로만 연결하는 것입니다. FIG-11-11. Forbidden Pat…", "column": 3, "html": "<h2>정상패턴과 금지패턴<\/h2>\n<h3>FIG-11-10. Normal Pattern<\/h3>\n<pre class=\"text-architecture\">MP→Mapping→PDMG ServiceId→Runtime<\/pre>\n<p>정상패턴은 PDMG Current Runtime과 NSIGHT Marketing Target을 분리하고 공식 Mapping/Interface Contract로만 연결하는 것입니다.<\/p>\n<h3>FIG-11-11. Forbidden Pattern<\/h3>\n<pre class=\"text-architecture\">MP=mg / Target Event=Current<\/pre>\n<p><code>mg<\/code>를 <code>MP<\/code>로 자동 치환하거나 NSIGHT Event Target을 PDMG Current 구현으로 표시하지 않습니다.<\/p>\n<hr>", "search": "정상패턴과 금지패턴 fig-11-10. normal pattern text mp→mapping→pdmg serviceid→runtime 정상패턴은 pdmg current runtime과 nsight marketing target을 분리하고 공식 mapping/interface contract로만 연결하는 것입니다. fig-11-11. forbidden pattern text mp=mg / target event=current mg를 mp로 자동 치환하거나 nsight event target을 pdmg current 구현으로 표시하지 않습니다. ---"}, {"id": "topic-11-11", "chapter": 11, "page": 11, "title": "Architecture Decision", "preview": "FIG-11-12. 주안과 대안 text [주안] MP↔PDMG Mapping Registry + ADR VS [대안] mg를 MP로 일괄 치환", "column": 1, "html": "<h2>Architecture Decision<\/h2>\n<h3>FIG-11-12. 주안과 대안<\/h3>\n<pre class=\"text-architecture\">[주안]\nMP↔PDMG Mapping Registry + ADR\n\n        VS\n\n[대안]\nmg를 MP로 일괄 치환<\/pre>\n<p>NSIGHT <code>MP<\/code>와 PDMG <code>mg<\/code>는 Mapping Registry/ADR로 명시적으로 연결합니다. 이름 유사성보다 책임과 Application Code SSOT가 기준입니다.<\/p>\n<p>일괄 치환은 빠르지만 RD/AD/BI 등 다른 Group과의 Canonical Key 정합을 훼손할 수 있으므로 사용하지 않습니다.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>평가축<\/th><th>주안<\/th><th>대안<\/th><\/tr><\/thead><tbody><tr><td>책임/경계<\/td><td>명확<\/td><td>추가 보완 필요<\/td><\/tr><tr><td>Current PDMG 정합<\/td><td>높음<\/td><td>변경범위 가능<\/td><\/tr><tr><td>운영/장애분석<\/td><td>Trace 용이<\/td><td>복잡도 증가 가능<\/td><\/tr><tr><td>승인조건<\/td><td>기본 Rule/Test<\/td><td>별도 ADR + Evidence<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>", "search": "architecture decision fig-11-12. 주안과 대안 text [주안] mp↔pdmg mapping registry + adr vs [대안] mg를 mp로 일괄 치환 nsight mp와 pdmg mg는 mapping registry/adr로 명시적으로 연결합니다. 이름 유사성보다 책임과 application code ssot가 기준입니다. 일괄 치환은 빠르지만 rd/ad/bi 등 다른 group과의 canonical key 정합을 훼손할 수 있으므로 사용하지 않습니다. | 평가축 | 주안 | 대안 | |---|---|---| | 책임/경계 | 명확 | 추가 보완 필요 | | current pdmg 정합 | 높음 | 변경범위 가능 | | 운영/장애분석 | trace 용이 | 복잡도 증가 가능 | | 승인조건 | 기본 rule/test | 별도 adr + evidence | ---"}, {"id": "topic-11-12", "chapter": 11, "page": 12, "title": "Evidence / Conformance — 이 장의 Architecture를 무엇으로 증명하는가", "preview": "Evidence Architecture text 마케팅플랫폼 Architecture Rule ↓ Source Evidence ↓ Config Evidence ↓ Runtime / Deployment Evidence", "column": 3, "html": "<h2>Evidence / Conformance — 이 장의 Architecture를 무엇으로 증명하는가<\/h2>\n<h3>Evidence Architecture<\/h3>\n<pre class=\"text-architecture\">마케팅플랫폼 Architecture Rule\n        ↓\nSource Evidence\n        ↓\nConfig Evidence\n        ↓\nRuntime / Deployment Evidence\n        ↓\nConformance Test\n        ↓\nPASS / GAP / ADR<\/pre>\n<h4>Source Evidence<\/h4>\n<ul><li><code>[SOURCE]<\/code> PDMG Application/ServiceId Source<\/li><li><code>[SOURCE]<\/code> Application Code Definition: MP/RD/AD/BI/DG/IM<\/li><li><code>[SOURCE]<\/code> PDMG mg Source Naming<\/li><\/ul>\n<h4>Config Evidence<\/h4>\n<ul><li><code>[CONFIG]<\/code> Program/ServiceId Registry<\/li><li><code>[CONFIG]<\/code> JWT/Identity Runtime Config<\/li><\/ul>\n<h4>Runtime / Deployment Evidence<\/h4>\n<ul><li><code>[RUNTIME]<\/code> Program→ServiceId→Handler→Facade→Service→DAO/RDW<\/li><li><code>[RUNTIME]<\/code> Event/Kafka는 Target Reference<\/li><\/ul>\n<h4>Architecture Decision<\/h4>\n<ul><li><code>[DECISION]<\/code> NSIGHT MP ↔ PDMG mg는 Mapping Registry/ADR로 연결<\/li><li><code>[DECISION]<\/code> 자동 치환 금지<\/li><\/ul>\n<h4>Related ADR<\/h4>\n<ul><li><code>ADR-003 Mapping Registry<\/code><\/li><li><code>ADR-013 Identity Binding<\/code><\/li><li><code>ADR-014 Interface Selection<\/code><\/li><\/ul>\n<h4>Current GAP / OPEN<\/h4>\n<ul><li><code>[GAP/OPEN]<\/code> MP↔mg Mapping<\/li><li><code>[GAP/OPEN]<\/code> JWT/Identity<\/li><li><code>[GAP/OPEN]<\/code> External Interface Inventory<\/li><li><code>[GAP/OPEN]<\/code> Event Current Ownership<\/li><li><code>[GAP/OPEN]<\/code> pdmg-om<\/li><\/ul>\n<h3>이 장의 판정<\/h3>\n<pre class=\"text-architecture\">Architecture Definition\n        ↓\nCONDITIONAL PASS\n\nCurrent PDMG Conformance\n        ↓\nPARTIAL / GAP\n\nRuntime Evidence Coverage\n        ↓\nMEDIUM\n\nArchitecture Definition PASS\n        ≠\nCurrent Implementation PASS<\/pre>\n<h4>PASS 전환조건<\/h4>\n<ul><li><code>MP↔mg Mapping Registry<\/code><\/li><li><code>Identity Binding<\/code><\/li><li><code>Interface Inventory<\/code><\/li><li><code>Event Target Ownership<\/code><\/li><\/ul>\n<p>위 조건은 문서 완성도가 아니라 <strong>Current Implementation Conformance를 PASS로 전환하기 위한 Exit Criteria<\/strong>다. 해당 Evidence가 확보되기 전에는 <code>[GAP]<\/code>, <code>[OPEN]<\/code>, <code>[UNKNOWN]<\/code> 상태를 유지한다.<\/p>\n<hr>", "search": "evidence / conformance — 이 장의 architecture를 무엇으로 증명하는가 evidence architecture text 마케팅플랫폼 architecture rule ↓ source evidence ↓ config evidence ↓ runtime / deployment evidence ↓ conformance test ↓ pass / gap / adr source evidence - [source] pdmg application/serviceid source - [source] application code definition: mp/rd/ad/bi/dg/im - [source] pdmg mg source naming config evidence - [config] program/serviceid registry - [config] jwt/identity runtime config runtime / deployment evidence - [runtime] program→serviceid→handler→facade→service→dao/rdw - [runtime] event/kafka는 target reference architecture decision - [decision] nsight mp ↔ pdmg mg는 mapping registry/adr로 연결 - [decision] 자동 치환 금지 related adr - adr-003 mapping registry - adr-013 identity binding - adr-014 interface selection current gap / open - [gap/open] mp↔mg mapping - [gap/open] jwt/identity - [gap/open] external interface inventory - [gap/open] event current ownership - [gap/open] pdmg-om 이 장의 판정 text architecture definition ↓ conditional pass current pdmg conformance ↓ partial / gap runtime evidence coverage ↓ medium architecture definition pass ≠ current implementation pass pass 전환조건 - mp↔mg mapping registry - identity binding - interface inventory - event target ownership 위 조건은 문서 완성도가 아니라 current implementation conformance를 pass로 전환하기 위한 exit criteria다. 해당 evidence가 확보되기 전에는 [gap], [open], [unknown] 상태를 유지한다. ---"}, {"id": "topic-11-13", "chapter": 11, "page": 13, "title": "Chapter Closing Script", "preview": "FIG-11-16. 다음 장 Handoff text 마케팅플랫폼 ↓ 배치형 캠페인에서 고객 행동에 반응하는 플랫폼으로 ↓ 남은 질문 \"데이터 플랫폼이 신뢰를 만들고 BI는 판단 속도를 높인다\" ↓", "column": 0, "html": "<h2>Chapter Closing Script<\/h2>\n<h3>FIG-11-16. 다음 장 Handoff<\/h3>\n<pre class=\"text-architecture\">마케팅플랫폼\n ↓\n배치형 캠페인에서 고객 행동에 반응하는 플랫폼으로\n ↓\n남은 질문\n&quot;데이터 플랫폼이 신뢰를 만들고 BI는 판단 속도를 높인다&quot;\n ↓\nBI 포탈<\/pre>\n<p>Marketing은 실행의 속도를 높이는 영역입니다. 다음 장 BI Portal에서는 같은 Data Platform을 기반으로 실행이 아니라 판단의 속도를 높이는 Analytical Consumer 구조를 봅니다.<\/p>", "search": "chapter closing script fig-11-16. 다음 장 handoff text 마케팅플랫폼 ↓ 배치형 캠페인에서 고객 행동에 반응하는 플랫폼으로 ↓ 남은 질문 \"데이터 플랫폼이 신뢰를 만들고 bi는 판단 속도를 높인다\" ↓ bi 포탈 marketing은 실행의 속도를 높이는 영역입니다. 다음 장 bi portal에서는 같은 data platform을 기반으로 실행이 아니라 판단의 속도를 높이는 analytical consumer 구조를 봅니다."}, {"id": "topic-12-1", "chapter": 12, "page": 1, "title": "0. Opening Script", "preview": "Marketing Platform이 실행을 담당한다면 BI는 판단을 지원합니다. 중요한 것은 BI가 PDMG 내부 DAO나 Online DB를 직접 끌어다 쓰는 구조가 아니라, Data Platform이 제공하는 신뢰된 Dataset과 Contract를 소비하는 별도 Analytical Boundary라는 점입니다. 이 장은 PDMG Cu…", "column": 1, "html": "<h2>0. Opening Script<\/h2>\n<p>Marketing Platform이 실행을 담당한다면 BI는 판단을 지원합니다.<\/p>\n<p>중요한 것은 BI가 PDMG 내부 DAO나 Online DB를 직접 끌어다 쓰는 구조가 아니라, <strong>Data Platform이 제공하는 신뢰된 Dataset과 Contract를 소비하는 별도 Analytical Boundary<\/strong>라는 점입니다.<\/p>\n<p>이 장은 PDMG Current보다는 NSIGHT Target Reference 성격이 강합니다.<\/p>\n<h3>FIG-12-01. 장 전체 Architecture<\/h3>\n<pre class=\"text-architecture\">Operational Data\n ↓\nRDW\n ↓\nADW\n ↓\nData Contract\n ↓\nBI Portal\n ↓\nReport / Self-BI / Analysis<\/pre>\n<p>BI Portal은 Online Runtime의 연장이 아니라 별도의 Analytical Boundary입니다. RDW의 운영 데이터를 ADW와 신뢰된 Dataset으로 가공해 BI가 소비하도록 하고, Heavy Query가 Online Transaction 자원을 침범하지 않도록 분리합니다.<\/p>\n<hr>", "search": "0. opening script marketing platform이 실행을 담당한다면 bi는 판단을 지원합니다. 중요한 것은 bi가 pdmg 내부 dao나 online db를 직접 끌어다 쓰는 구조가 아니라, data platform이 제공하는 신뢰된 dataset과 contract를 소비하는 별도 analytical boundary라는 점입니다. 이 장은 pdmg current보다는 nsight target reference 성격이 강합니다. fig-12-01. 장 전체 architecture text operational data ↓ rdw ↓ adw ↓ data contract ↓ bi portal ↓ report / self-bi / analysis bi portal은 online runtime의 연장이 아니라 별도의 analytical boundary입니다. rdw의 운영 데이터를 adw와 신뢰된 dataset으로 가공해 bi가 소비하도록 하고, heavy query가 online transaction 자원을 침범하지 않도록 분리합니다. ---"}, {"id": "topic-12-2", "chapter": 12, "page": 2, "title": "1. BI Boundary", "preview": "FIG-12-02. BI Boundary text PDMG Operational Runtime ≠ BI Analytical Runtime BI는 PDMG 내부 Module이 아닙니다.", "column": 1, "html": "<h2>1. BI Boundary<\/h2>\n<h3>FIG-12-02. BI Boundary<\/h3>\n<pre class=\"text-architecture\">PDMG Operational Runtime\n        ≠\nBI Analytical Runtime<\/pre>\n<p>BI는 PDMG 내부 Module이 아닙니다.<\/p>\n<p>두 Runtime은 Workload, Scale, Data Access Pattern이 다르기 때문에 별도 Boundary로 봅니다.<\/p>\n<p>이 분리가 Online SLA 보호의 시작입니다.<\/p>\n<hr>", "search": "1. bi boundary fig-12-02. bi boundary text pdmg operational runtime ≠ bi analytical runtime bi는 pdmg 내부 module이 아닙니다. 두 runtime은 workload, scale, data access pattern이 다르기 때문에 별도 boundary로 봅니다. 이 분리가 online sla 보호의 시작입니다. ---"}, {"id": "topic-12-3", "chapter": 12, "page": 3, "title": "2. RDW→ADW", "preview": "FIG-12-03. RDW→ADW text RDW Operational ↓ ETL / Data Movement ↓ ADW Analytical", "column": 1, "html": "<h2>2. RDW→ADW<\/h2>\n<h3>FIG-12-03. RDW→ADW<\/h3>\n<pre class=\"text-architecture\">RDW\nOperational\n ↓\nETL / Data Movement\n ↓\nADW\nAnalytical<\/pre>\n<p>BI가 Online RDW를 직접 Heavy Query하면 운영거래에 영향을 줄 수 있습니다.<\/p>\n<p>따라서 분석 Workload는 ADW나 Analytical Platform으로 이동시키는 방향이 기본입니다.<\/p>\n<p>실제 Refresh/Freshness SLA는 별도 Evidence가 필요합니다.<\/p>\n<hr>", "search": "2. rdw→adw fig-12-03. rdw→adw text rdw operational ↓ etl / data movement ↓ adw analytical bi가 online rdw를 직접 heavy query하면 운영거래에 영향을 줄 수 있습니다. 따라서 분석 workload는 adw나 analytical platform으로 이동시키는 방향이 기본입니다. 실제 refresh/freshness sla는 별도 evidence가 필요합니다. ---"}, {"id": "topic-12-4", "chapter": 12, "page": 4, "title": "3. Data Contract", "preview": "FIG-12-04. Data Contract text Dataset ├─ Owner ├─ Schema ├─ Version ├─ Freshness ├─ Security └─ SLA", "column": 1, "html": "<h2>3. Data Contract<\/h2>\n<h3>FIG-12-04. Data Contract<\/h3>\n<pre class=\"text-architecture\">Dataset\n├─ Owner\n├─ Schema\n├─ Version\n├─ Freshness\n├─ Security\n└─ SLA<\/pre>\n<p>BI와 Data Platform 사이의 Contract는 API보다 Dataset Contract가 중심이 될 수 있습니다.<\/p>\n<p>이 Contract가 없으면 Report마다 같은 지표를 다르게 계산하고 데이터 품질 책임이 불명확해집니다.<\/p>\n<p>따라서 Dataset Owner와 Metric Definition이 중요합니다.<\/p>\n<hr>", "search": "3. data contract fig-12-04. data contract text dataset ├─ owner ├─ schema ├─ version ├─ freshness ├─ security └─ sla bi와 data platform 사이의 contract는 api보다 dataset contract가 중심이 될 수 있습니다. 이 contract가 없으면 report마다 같은 지표를 다르게 계산하고 데이터 품질 책임이 불명확해집니다. 따라서 dataset owner와 metric definition이 중요합니다. ---"}, {"id": "topic-12-5", "chapter": 12, "page": 5, "title": "4. Report / Self-BI", "preview": "FIG-12-05. Report / Self-BI text ADW Dataset ↓ BI Semantic Layer ↓ Report ↓ Self-BI", "column": 3, "html": "<h2>4. Report / Self-BI<\/h2>\n<h3>FIG-12-05. Report / Self-BI<\/h3>\n<pre class=\"text-architecture\">ADW Dataset\n ↓\nBI Semantic Layer\n ↓\nReport\n ↓\nSelf-BI\n ↓\nDecision<\/pre>\n<p>BI Portal은 단순 Report Viewer가 아니라 사용자가 신뢰된 Dataset을 재사용하는 소비계층입니다.<\/p>\n<p>Semantic Layer와 공통 Metric Definition이 있어야 Self-BI가 데이터 혼란으로 이어지지 않습니다.<\/p>\n<p>이 영역은 Target 상세설계가 필요합니다.<\/p>\n<hr>", "search": "4. report / self-bi fig-12-05. report / self-bi text adw dataset ↓ bi semantic layer ↓ report ↓ self-bi ↓ decision bi portal은 단순 report viewer가 아니라 사용자가 신뢰된 dataset을 재사용하는 소비계층입니다. semantic layer와 공통 metric definition이 있어야 self-bi가 데이터 혼란으로 이어지지 않습니다. 이 영역은 target 상세설계가 필요합니다. ---"}, {"id": "topic-12-6", "chapter": 12, "page": 6, "title": "5. BI Security", "preview": "FIG-12-06. BI Security text User ↓ Authentication ↓ BI Role ↓ Dataset Permission", "column": 1, "html": "<h2>5. BI Security<\/h2>\n<h3>FIG-12-06. BI Security<\/h3>\n<pre class=\"text-architecture\">User\n ↓\nAuthentication\n ↓\nBI Role\n ↓\nDataset Permission\n ↓\nRow / Column Access\n ↓\nAudit<\/pre>\n<p>BI는 데이터를 넓게 보여주기 때문에 Application 로그인만으로 충분하지 않습니다.<\/p>\n<p>Dataset 단위, Row/Column 단위 권한과 Audit이 필요할 수 있습니다.<\/p>\n<p>정확한 권한모델은 BI Platform 선택과 함께 확정해야 합니다.<\/p>\n<hr>", "search": "5. bi security fig-12-06. bi security text user ↓ authentication ↓ bi role ↓ dataset permission ↓ row / column access ↓ audit bi는 데이터를 넓게 보여주기 때문에 application 로그인만으로 충분하지 않습니다. dataset 단위, row/column 단위 권한과 audit이 필요할 수 있습니다. 정확한 권한모델은 bi platform 선택과 함께 확정해야 합니다. ---"}, {"id": "topic-12-7", "chapter": 12, "page": 7, "title": "6. Freshness SLA", "preview": "FIG-12-07. Freshness SLA text Source Change ↓ CDC / ETL ↓ ADW Refresh ↓ Dataset", "column": 0, "html": "<h2>6. Freshness SLA<\/h2>\n<h3>FIG-12-07. Freshness SLA<\/h3>\n<pre class=\"text-architecture\">Source Change\n ↓\nCDC / ETL\n ↓\nADW Refresh\n ↓\nDataset\n ↓\nReport Freshness<\/pre>\n<p>BI에서 '실시간'은 모호한 표현입니다.<\/p>\n<p>Source Change부터 Report에 보이기까지의 전체 Freshness를 측정해야 합니다.<\/p>\n<p>CDC 3초/30초와 같은 SLA 충돌도 최종 사용자 관점의 Freshness로 재정의해야 합니다.<\/p>\n<hr>", "search": "6. freshness sla fig-12-07. freshness sla text source change ↓ cdc / etl ↓ adw refresh ↓ dataset ↓ report freshness bi에서 '실시간'은 모호한 표현입니다. source change부터 report에 보이기까지의 전체 freshness를 측정해야 합니다. cdc 3초/30초와 같은 sla 충돌도 최종 사용자 관점의 freshness로 재정의해야 합니다. ---"}, {"id": "topic-12-8", "chapter": 12, "page": 8, "title": "7. Performance Isolation", "preview": "FIG-12-08. Performance Isolation text Heavy BI Query ↓ ADW / BI Runtime not PDMG WAS / RDW Online", "column": 2, "html": "<h2>7. Performance Isolation<\/h2>\n<h3>FIG-12-08. Performance Isolation<\/h3>\n<pre class=\"text-architecture\">Heavy BI Query\n ↓\nADW / BI Runtime\n\nnot\n\nPDMG WAS / RDW Online<\/pre>\n<p>분석부하를 Online Runtime과 분리하는 이유는 Performance Isolation입니다.<\/p>\n<p>BI Query가 느리더라도 고객/직원 Online Transaction SLA에 영향을 주지 않아야 합니다.<\/p>\n<p>따라서 Compute/Data Resource도 별도 Scale Unit을 가져야 합니다.<\/p>\n<hr>", "search": "7. performance isolation fig-12-08. performance isolation text heavy bi query ↓ adw / bi runtime not pdmg was / rdw online 분석부하를 online runtime과 분리하는 이유는 performance isolation입니다. bi query가 느리더라도 고객/직원 online transaction sla에 영향을 주지 않아야 합니다. 따라서 compute/data resource도 별도 scale unit을 가져야 합니다. ---"}, {"id": "topic-12-9", "chapter": 12, "page": 9, "title": "8. BI Evidence", "preview": "FIG-12-09. BI Evidence text Dataset Version ↓ Report / Query ↓ User / Role ↓ Refresh Time", "column": 3, "html": "<h2>8. BI Evidence<\/h2>\n<h3>FIG-12-09. BI Evidence<\/h3>\n<pre class=\"text-architecture\">Dataset Version\n ↓\nReport / Query\n ↓\nUser / Role\n ↓\nRefresh Time\n ↓\nAudit / Performance Evidence<\/pre>\n<p>BI도 운영 가능하려면 Evidence가 필요합니다.<\/p>\n<p>어떤 Dataset Version을 어떤 사용자가 조회했고 얼마나 걸렸는지 추적되어야 Governance와 Performance를 함께 볼 수 있습니다.<\/p>\n<p>현재는 Target Reference 수준이므로 실제 구현 Evidence는 OPEN입니다.<\/p>\n<hr>", "search": "8. bi evidence fig-12-09. bi evidence text dataset version ↓ report / query ↓ user / role ↓ refresh time ↓ audit / performance evidence bi도 운영 가능하려면 evidence가 필요합니다. 어떤 dataset version을 어떤 사용자가 조회했고 얼마나 걸렸는지 추적되어야 governance와 performance를 함께 볼 수 있습니다. 현재는 target reference 수준이므로 실제 구현 evidence는 open입니다. ---"}, {"id": "topic-12-10", "chapter": 12, "page": 10, "title": "정상패턴과 금지패턴", "preview": "FIG-12-10. Normal Pattern text RDW→ADW→Data Contract→BI 정상패턴은 BI가 Data Platform의 신뢰된 Dataset을 소비하고 Online DAO/DB와 직접 결합하지 않는 것입니다. FIG-12-11. Forbidden Pattern", "column": 3, "html": "<h2>정상패턴과 금지패턴<\/h2>\n<h3>FIG-12-10. Normal Pattern<\/h3>\n<pre class=\"text-architecture\">RDW→ADW→Data Contract→BI<\/pre>\n<p>정상패턴은 BI가 Data Platform의 신뢰된 Dataset을 소비하고 Online DAO/DB와 직접 결합하지 않는 것입니다.<\/p>\n<h3>FIG-12-11. Forbidden Pattern<\/h3>\n<pre class=\"text-architecture\">BI→PDMG DAO / Heavy Query→Online<\/pre>\n<p>BI가 PDMG DAO/Mapper나 Online DB에 직접 결합하여 분석부하를 운영거래에 전파하는 구조를 금지합니다.<\/p>\n<hr>", "search": "정상패턴과 금지패턴 fig-12-10. normal pattern text rdw→adw→data contract→bi 정상패턴은 bi가 data platform의 신뢰된 dataset을 소비하고 online dao/db와 직접 결합하지 않는 것입니다. fig-12-11. forbidden pattern text bi→pdmg dao / heavy query→online bi가 pdmg dao/mapper나 online db에 직접 결합하여 분석부하를 운영거래에 전파하는 구조를 금지합니다. ---"}, {"id": "topic-12-11", "chapter": 12, "page": 11, "title": "Architecture Decision", "preview": "FIG-12-12. 주안과 대안 text [주안] ADW/Data Contract 기반 BI 연결 VS [대안] PDMG 내부 DAO/DB 직접 연결", "column": 1, "html": "<h2>Architecture Decision<\/h2>\n<h3>FIG-12-12. 주안과 대안<\/h3>\n<pre class=\"text-architecture\">[주안]\nADW/Data Contract 기반 BI 연결\n\n        VS\n\n[대안]\nPDMG 내부 DAO/DB 직접 연결<\/pre>\n<p>BI는 ADW/Data Contract 기반으로 연결합니다. 운영 Application 내부에 분석 기능을 붙이는 것이 아니라 신뢰된 Dataset을 독립 소비하는 구조가 목표입니다.<\/p>\n<p>PDMG 내부 DAO/DB 직접 연결은 구현은 빠르지만 Online SLA와 Data Ownership을 동시에 침범하므로 금지대안입니다.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>평가축<\/th><th>주안<\/th><th>대안<\/th><\/tr><\/thead><tbody><tr><td>책임/경계<\/td><td>명확<\/td><td>추가 보완 필요<\/td><\/tr><tr><td>Current PDMG 정합<\/td><td>높음<\/td><td>변경범위 가능<\/td><\/tr><tr><td>운영/장애분석<\/td><td>Trace 용이<\/td><td>복잡도 증가 가능<\/td><\/tr><tr><td>승인조건<\/td><td>기본 Rule/Test<\/td><td>별도 ADR + Evidence<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>", "search": "architecture decision fig-12-12. 주안과 대안 text [주안] adw/data contract 기반 bi 연결 vs [대안] pdmg 내부 dao/db 직접 연결 bi는 adw/data contract 기반으로 연결합니다. 운영 application 내부에 분석 기능을 붙이는 것이 아니라 신뢰된 dataset을 독립 소비하는 구조가 목표입니다. pdmg 내부 dao/db 직접 연결은 구현은 빠르지만 online sla와 data ownership을 동시에 침범하므로 금지대안입니다. | 평가축 | 주안 | 대안 | |---|---|---| | 책임/경계 | 명확 | 추가 보완 필요 | | current pdmg 정합 | 높음 | 변경범위 가능 | | 운영/장애분석 | trace 용이 | 복잡도 증가 가능 | | 승인조건 | 기본 rule/test | 별도 adr + evidence | ---"}, {"id": "topic-12-12", "chapter": 12, "page": 12, "title": "Evidence / Conformance — 이 장의 Architecture를 무엇으로 증명하는가", "preview": "Evidence Architecture text BI 포탈 Architecture Rule ↓ Source Evidence ↓ Config Evidence ↓ Runtime / Deployment Evidence", "column": 3, "html": "<h2>Evidence / Conformance — 이 장의 Architecture를 무엇으로 증명하는가<\/h2>\n<h3>Evidence Architecture<\/h3>\n<pre class=\"text-architecture\">BI 포탈 Architecture Rule\n        ↓\nSource Evidence\n        ↓\nConfig Evidence\n        ↓\nRuntime / Deployment Evidence\n        ↓\nConformance Test\n        ↓\nPASS / GAP / ADR<\/pre>\n<h4>Source Evidence<\/h4>\n<ul><li><code>[SOURCE]<\/code> Data/Interface Architecture와 NSIGHT BI Target 자료<\/li><li><code>[SOURCE]<\/code> PDMG Current에는 BI 구현 직접 Evidence 제한적<\/li><\/ul>\n<h4>Config Evidence<\/h4>\n<ul><li><code>[CONFIG]<\/code> Dataset/Freshness/Security Contract는 Target 상세설계 필요<\/li><\/ul>\n<h4>Runtime / Deployment Evidence<\/h4>\n<ul><li><code>[RUNTIME]<\/code> RDW→ADW→Dataset→BI Portal<\/li><li><code>[RUNTIME]<\/code> Heavy BI Query는 Online Runtime과 분리<\/li><\/ul>\n<h4>Architecture Decision<\/h4>\n<ul><li><code>[DECISION]<\/code> ADW/Data Contract 기반 BI<\/li><li><code>[DECISION]<\/code> PDMG DAO/DB Direct 접근 금지<\/li><\/ul>\n<h4>Related ADR<\/h4>\n<ul><li><code>ADR-021 RDW/ADW 분리<\/code><\/li><li><code>ADR-035 Observability<\/code><\/li><\/ul>\n<h4>Current GAP / OPEN<\/h4>\n<ul><li><code>[GAP/OPEN]<\/code> BI Current Evidence<\/li><li><code>[GAP/OPEN]<\/code> Data Contract Inventory<\/li><li><code>[GAP/OPEN]<\/code> ADW Freshness<\/li><li><code>[GAP/OPEN]<\/code> Dataset Ownership/Security<\/li><\/ul>\n<h3>이 장의 판정<\/h3>\n<pre class=\"text-architecture\">Architecture Definition\n        ↓\nTARGET REFERENCE / CONDITIONAL PASS\n\nCurrent PDMG Conformance\n        ↓\nN-A / OPEN\n\nRuntime Evidence Coverage\n        ↓\nLOW\n\nArchitecture Definition PASS\n        ≠\nCurrent Implementation PASS<\/pre>\n<h4>PASS 전환조건<\/h4>\n<ul><li><code>Dataset Contract/Ownership<\/code><\/li><li><code>ADW Freshness SLA<\/code><\/li><li><code>BI Security Model<\/code><\/li><li><code>Target Runtime Evidence<\/code><\/li><\/ul>\n<p>위 조건은 문서 완성도가 아니라 <strong>Current Implementation Conformance를 PASS로 전환하기 위한 Exit Criteria<\/strong>다. 해당 Evidence가 확보되기 전에는 <code>[GAP]<\/code>, <code>[OPEN]<\/code>, <code>[UNKNOWN]<\/code> 상태를 유지한다.<\/p>\n<hr>", "search": "evidence / conformance — 이 장의 architecture를 무엇으로 증명하는가 evidence architecture text bi 포탈 architecture rule ↓ source evidence ↓ config evidence ↓ runtime / deployment evidence ↓ conformance test ↓ pass / gap / adr source evidence - [source] data/interface architecture와 nsight bi target 자료 - [source] pdmg current에는 bi 구현 직접 evidence 제한적 config evidence - [config] dataset/freshness/security contract는 target 상세설계 필요 runtime / deployment evidence - [runtime] rdw→adw→dataset→bi portal - [runtime] heavy bi query는 online runtime과 분리 architecture decision - [decision] adw/data contract 기반 bi - [decision] pdmg dao/db direct 접근 금지 related adr - adr-021 rdw/adw 분리 - adr-035 observability current gap / open - [gap/open] bi current evidence - [gap/open] data contract inventory - [gap/open] adw freshness - [gap/open] dataset ownership/security 이 장의 판정 text architecture definition ↓ target reference / conditional pass current pdmg conformance ↓ n-a / open runtime evidence coverage ↓ low architecture definition pass ≠ current implementation pass pass 전환조건 - dataset contract/ownership - adw freshness sla - bi security model - target runtime evidence 위 조건은 문서 완성도가 아니라 current implementation conformance를 pass로 전환하기 위한 exit criteria다. 해당 evidence가 확보되기 전에는 [gap], [open], [unknown] 상태를 유지한다. ---"}, {"id": "topic-12-13", "chapter": 12, "page": 13, "title": "Chapter Closing Script", "preview": "FIG-12-16. 다음 장 Handoff text BI 포탈 ↓ 데이터 플랫폼이 신뢰를 만들고 BI는 판단 속도를 높인다 ↓ 남은 질문 \"좋은 Architecture는 처음 잘 그린 그림이 아니라 계속 정합되는 체계다\" ↓", "column": 3, "html": "<h2>Chapter Closing Script<\/h2>\n<h3>FIG-12-16. 다음 장 Handoff<\/h3>\n<pre class=\"text-architecture\">BI 포탈\n ↓\n데이터 플랫폼이 신뢰를 만들고 BI는 판단 속도를 높인다\n ↓\n남은 질문\n&quot;좋은 Architecture는 처음 잘 그린 그림이 아니라 계속 정합되는 체계다&quot;\n ↓\n표준화와 10년 지속 가능성<\/pre>\n<p>이제 데이터의 생성·실행·판단까지 연결했습니다. 마지막 장에서는 이 Architecture가 시간이 지나도 무너지지 않도록 Naming, CI, Artifact, Deployment, Evidence, ADR를 하나의 Closed Loop로 묶습니다.<\/p>", "search": "chapter closing script fig-12-16. 다음 장 handoff text bi 포탈 ↓ 데이터 플랫폼이 신뢰를 만들고 bi는 판단 속도를 높인다 ↓ 남은 질문 \"좋은 architecture는 처음 잘 그린 그림이 아니라 계속 정합되는 체계다\" ↓ 표준화와 10년 지속 가능성 이제 데이터의 생성·실행·판단까지 연결했습니다. 마지막 장에서는 이 architecture가 시간이 지나도 무너지지 않도록 naming, ci, artifact, deployment, evidence, adr를 하나의 closed loop로 묶습니다."}, {"id": "topic-13-1", "chapter": 13, "page": 1, "title": "0. Opening Script", "preview": "마지막 장의 질문은 단순합니다. 지금 잘 만든 구조가 3년, 5년, 10년 뒤에도 같은 원칙을 유지할 수 있는가입니다. Architecture는 시간이 지나면 자동으로 낡습니다. Source가 바뀌고 Config가 바뀌고 Deployment가 바뀌기 때문입니다. 그래서 최종 Architecture는 Naming → CI Rule → Imm…", "column": 3, "html": "<h2>0. Opening Script<\/h2>\n<p>마지막 장의 질문은 단순합니다. 지금 잘 만든 구조가 3년, 5년, 10년 뒤에도 같은 원칙을 유지할 수 있는가입니다.<\/p>\n<p>Architecture는 시간이 지나면 자동으로 낡습니다. Source가 바뀌고 Config가 바뀌고 Deployment가 바뀌기 때문입니다.<\/p>\n<p>그래서 최종 Architecture는 <strong>Naming → CI Rule → Immutable Artifact → Deployment Trace → Runtime Evidence → Drift → ADR → New Baseline<\/strong>이라는 Closed Loop로 끝나야 합니다.<\/p>\n<h3>FIG-13-01. 장 전체 Architecture<\/h3>\n<pre class=\"text-architecture\">Architecture\n ↓\nNaming / Rule\n ↓\nSource\n ↓\nCI Test\n ↓\nArtifact\n ↓\nDeployment\n ↓\nRuntime Evidence\n ↓\nDrift\n ↓\nGAP / ADR\n ↓\nNew Baseline\n ↓\nHG90<\/pre>\n<p>마지막 그림은 Architecture가 유지되는 방식을 보여줍니다. Naming과 Rule이 Source/CI로 내려가고, 동일 Artifact가 Deployment된 뒤 Runtime Evidence로 검증됩니다. Drift가 생기면 GAP/ADR로 다시 Baseline을 갱신합니다. <strong>지속가능성은 변하지 않는 Architecture가 아니라, 변화해도 다시 정합되는 Architecture<\/strong>입니다.<\/p>\n<hr>", "search": "0. opening script 마지막 장의 질문은 단순합니다. 지금 잘 만든 구조가 3년, 5년, 10년 뒤에도 같은 원칙을 유지할 수 있는가입니다. architecture는 시간이 지나면 자동으로 낡습니다. source가 바뀌고 config가 바뀌고 deployment가 바뀌기 때문입니다. 그래서 최종 architecture는 naming → ci rule → immutable artifact → deployment trace → runtime evidence → drift → adr → new baseline이라는 closed loop로 끝나야 합니다. fig-13-01. 장 전체 architecture text architecture ↓ naming / rule ↓ source ↓ ci test ↓ artifact ↓ deployment ↓ runtime evidence ↓ drift ↓ gap / adr ↓ new baseline ↓ hg90 마지막 그림은 architecture가 유지되는 방식을 보여줍니다. naming과 rule이 source/ci로 내려가고, 동일 artifact가 deployment된 뒤 runtime evidence로 검증됩니다. drift가 생기면 gap/adr로 다시 baseline을 갱신합니다. 지속가능성은 변하지 않는 architecture가 아니라, 변화해도 다시 정합되는 architecture입니다. ---"}, {"id": "topic-13-2", "chapter": 13, "page": 2, "title": "1. Naming Backbone", "preview": "FIG-13-02. Naming Backbone text Business ↓ Program ↓ ServiceId ↓ Package / Class", "column": 1, "html": "<h2>1. Naming Backbone<\/h2>\n<h3>FIG-13-02. Naming Backbone<\/h3>\n<pre class=\"text-architecture\">Business\n ↓\nProgram\n ↓\nServiceId\n ↓\nPackage / Class\n ↓\nMapper / SqlId\n ↓\nArtifact / Deployment<\/pre>\n<p>지속가능성의 시작은 식별입니다.<\/p>\n<p>Business와 Source, Runtime이 서로 다른 이름체계를 쓰면 자동 Trace가 불가능합니다. ServiceId와 Program, Package/Mapper 축이 정합해야 합니다.<\/p>\n<p>Naming은 규칙이 아니라 Trace Backbone입니다.<\/p>\n<hr>", "search": "1. naming backbone fig-13-02. naming backbone text business ↓ program ↓ serviceid ↓ package / class ↓ mapper / sqlid ↓ artifact / deployment 지속가능성의 시작은 식별입니다. business와 source, runtime이 서로 다른 이름체계를 쓰면 자동 trace가 불가능합니다. serviceid와 program, package/mapper 축이 정합해야 합니다. naming은 규칙이 아니라 trace backbone입니다. ---"}, {"id": "topic-13-3", "chapter": 13, "page": 3, "title": "2. Machine-readable Rule", "preview": "FIG-13-03. Machine-readable Rule text Architecture Standard ↓ Rule ↓ Scanner ↓ CI Gate", "column": 1, "html": "<h2>2. Machine-readable Rule<\/h2>\n<h3>FIG-13-03. Machine-readable Rule<\/h3>\n<pre class=\"text-architecture\">Architecture Standard\n ↓\nRule\n ↓\nScanner\n ↓\nCI Gate\n ↓\nPASS / FAIL<\/pre>\n<p>표준문서만으로는 10년을 유지할 수 없습니다.<\/p>\n<p>규칙을 Source Scanner와 CI Gate로 옮겨야 새 코드가 Architecture를 어기는 순간 바로 알 수 있습니다.<\/p>\n<p>예를 들어 Duplicate ServiceId, Handler→DAO 같은 금지 Dependency는 기계검증 대상입니다.<\/p>\n<hr>", "search": "2. machine-readable rule fig-13-03. machine-readable rule text architecture standard ↓ rule ↓ scanner ↓ ci gate ↓ pass / fail 표준문서만으로는 10년을 유지할 수 없습니다. 규칙을 source scanner와 ci gate로 옮겨야 새 코드가 architecture를 어기는 순간 바로 알 수 있습니다. 예를 들어 duplicate serviceid, handler→dao 같은 금지 dependency는 기계검증 대상입니다. ---"}, {"id": "topic-13-4", "chapter": 13, "page": 4, "title": "3. Build Once / Promote", "preview": "FIG-13-04. Build Once / Promote text Source Commit ↓ Build ↓ Artifact Hash ↓ DEV", "column": 2, "html": "<h2>3. Build Once / Promote<\/h2>\n<h3>FIG-13-04. Build Once / Promote<\/h3>\n<pre class=\"text-architecture\">Source Commit\n ↓\nBuild\n ↓\nArtifact Hash\n ↓\nDEV\n ↓\nTEST\n ↓\nPROD\n ↓\nDR<\/pre>\n<p>환경마다 다시 Build하면 같은 Source라도 Binary가 달라질 수 있습니다.<\/p>\n<p>Build Once 후 동일 Artifact를 승격하면 테스트한 Binary와 운영 Binary가 동일하다는 증명이 쉬워집니다.<\/p>\n<p>ArtifactHash가 Evidence Chain의 핵심이 됩니다.<\/p>\n<hr>", "search": "3. build once / promote fig-13-04. build once / promote text source commit ↓ build ↓ artifact hash ↓ dev ↓ test ↓ prod ↓ dr 환경마다 다시 build하면 같은 source라도 binary가 달라질 수 있습니다. build once 후 동일 artifact를 승격하면 테스트한 binary와 운영 binary가 동일하다는 증명이 쉬워집니다. artifacthash가 evidence chain의 핵심이 됩니다. ---"}, {"id": "topic-13-5", "chapter": 13, "page": 5, "title": "4. Config / Secret 분리", "preview": "FIG-13-05. Config / Secret 분리 text Artifact = code/binary Config = environment Secret / Key", "column": 2, "html": "<h2>4. Config / Secret 분리<\/h2>\n<h3>FIG-13-05. Config / Secret 분리<\/h3>\n<pre class=\"text-architecture\">Artifact\n= code/binary\n\nConfig\n= environment\n\nSecret / Key\n= protected store<\/pre>\n<p>Artifact 안에 Environment Config와 Secret을 섞으면 Promotion과 Key Rotation이 어려워집니다.<\/p>\n<p>특히 JWT Key는 Source나 일반 Config 파일과 분리해 Managed Store에서 다루는 방향이 필요합니다.<\/p>\n<p>DR에서도 같은 Trust Chain을 복구할 수 있어야 합니다.<\/p>\n<hr>", "search": "4. config / secret 분리 fig-13-05. config / secret 분리 text artifact = code/binary config = environment secret / key = protected store artifact 안에 environment config와 secret을 섞으면 promotion과 key rotation이 어려워집니다. 특히 jwt key는 source나 일반 config 파일과 분리해 managed store에서 다루는 방향이 필요합니다. dr에서도 같은 trust chain을 복구할 수 있어야 합니다. ---"}, {"id": "topic-13-6", "chapter": 13, "page": 6, "title": "5. Deployment Trace", "preview": "FIG-13-06. Deployment Trace text sourceCommit ↓ buildId ↓ artifactHash ↓ deploymentId", "column": 2, "html": "<h2>5. Deployment Trace<\/h2>\n<h3>FIG-13-06. Deployment Trace<\/h3>\n<pre class=\"text-architecture\">sourceCommit\n ↓\nbuildId\n ↓\nartifactHash\n ↓\ndeploymentId\n ↓\nWAR / JVM / Host\n ↓\nServiceId / GUID<\/pre>\n<p>Source와 Runtime을 연결하는 핵심 Chain입니다.<\/p>\n<p>장애가 났을 때 로그만 보고 끝나는 것이 아니라 어떤 Commit/Artifact가 어느 Host에서 실행됐는지 알아야 합니다.<\/p>\n<p>현재 이 Mapping 자동화가 주요 GAP입니다.<\/p>\n<hr>", "search": "5. deployment trace fig-13-06. deployment trace text sourcecommit ↓ buildid ↓ artifacthash ↓ deploymentid ↓ war / jvm / host ↓ serviceid / guid source와 runtime을 연결하는 핵심 chain입니다. 장애가 났을 때 로그만 보고 끝나는 것이 아니라 어떤 commit/artifact가 어느 host에서 실행됐는지 알아야 합니다. 현재 이 mapping 자동화가 주요 gap입니다. ---"}, {"id": "topic-13-7", "chapter": 13, "page": 7, "title": "6. Observability → Evidence", "preview": "FIG-13-07. Observability → Evidence text Metric + Log + Trace ↓ ServiceId / GUID ↓ Deployment", "column": 2, "html": "<h2>6. Observability → Evidence<\/h2>\n<h3>FIG-13-07. Observability → Evidence<\/h3>\n<pre class=\"text-architecture\">Metric\n+ Log\n+ Trace\n ↓\nServiceId / GUID\n ↓\nDeployment\n ↓\nArchitecture Rule\n ↓\nEvidence<\/pre>\n<p>Observability의 목적을 Dashboard에서 끝내지 않습니다.<\/p>\n<p>Metric/Log/Trace를 Architecture Rule과 연결해야 Runtime Evidence가 됩니다.<\/p>\n<p>예를 들어 Timeout Rule을 실제 p95와 Timeout/DB Wait Evidence로 검증할 수 있어야 합니다.<\/p>\n<hr>", "search": "6. observability → evidence fig-13-07. observability → evidence text metric + log + trace ↓ serviceid / guid ↓ deployment ↓ architecture rule ↓ evidence observability의 목적을 dashboard에서 끝내지 않습니다. metric/log/trace를 architecture rule과 연결해야 runtime evidence가 됩니다. 예를 들어 timeout rule을 실제 p95와 timeout/db wait evidence로 검증할 수 있어야 합니다. ---"}, {"id": "topic-13-8", "chapter": 13, "page": 8, "title": "7. Drift / ADR", "preview": "FIG-13-08. Drift / ADR text Baseline ↓ compare Source / Config / Runtime ↓ Drift ↓ GAP", "column": 2, "html": "<h2>7. Drift / ADR<\/h2>\n<h3>FIG-13-08. Drift / ADR<\/h3>\n<pre class=\"text-architecture\">Baseline\n ↓ compare\nSource / Config / Runtime\n ↓\nDrift\n ↓\nGAP\n ↓\nADR / Fix\n ↓\nNew Baseline<\/pre>\n<p>Drift는 실패가 아니라 변경의 신호입니다.<\/p>\n<p>중요한 것은 Drift를 숨기지 않고 GAP로 기록하고, Architecture 변경이 필요하면 ADR로 Baseline을 갱신하는 것입니다.<\/p>\n<p>이 과정이 없으면 문서와 실제가 다시 분리됩니다.<\/p>\n<hr>", "search": "7. drift / adr fig-13-08. drift / adr text baseline ↓ compare source / config / runtime ↓ drift ↓ gap ↓ adr / fix ↓ new baseline drift는 실패가 아니라 변경의 신호입니다. 중요한 것은 drift를 숨기지 않고 gap로 기록하고, architecture 변경이 필요하면 adr로 baseline을 갱신하는 것입니다. 이 과정이 없으면 문서와 실제가 다시 분리됩니다. ---"}, {"id": "topic-13-9", "chapter": 13, "page": 9, "title": "8. G00→HG90", "preview": "FIG-13-09. G00→HG90 text G00 Source ↓ G10 Document ↓ G20 Model ↓ G30 Conformance", "column": 3, "html": "<h2>8. G00→HG90<\/h2>\n<h3>FIG-13-09. G00→HG90<\/h3>\n<pre class=\"text-architecture\">G00 Source\n ↓\nG10 Document\n ↓\nG20 Model\n ↓\nG30 Conformance\n ↓\nG40 Test\n ↓\nG50 Runtime Evidence\n ↓\nG60 Drift\n ↓\nG70 GAP/ADR\n ↓\nG80 Approval\n ↓\nHG90<\/pre>\n<p>최종 Baseline은 단순 문서 승인으로 Release하지 않습니다.<\/p>\n<p>Source와 Model, Test, Runtime Evidence, GAP/ADR가 모두 Gate를 통과해야 HG90로 승격합니다.<\/p>\n<p>따라서 10년 지속가능성의 핵심은 '변하지 않는 구조'가 아니라 <strong>변화해도 다시 정합되는 절차<\/strong>입니다.<\/p>\n<hr>", "search": "8. g00→hg90 fig-13-09. g00→hg90 text g00 source ↓ g10 document ↓ g20 model ↓ g30 conformance ↓ g40 test ↓ g50 runtime evidence ↓ g60 drift ↓ g70 gap/adr ↓ g80 approval ↓ hg90 최종 baseline은 단순 문서 승인으로 release하지 않습니다. source와 model, test, runtime evidence, gap/adr가 모두 gate를 통과해야 hg90로 승격합니다. 따라서 10년 지속가능성의 핵심은 '변하지 않는 구조'가 아니라 변화해도 다시 정합되는 절차입니다. ---"}, {"id": "topic-13-10", "chapter": 13, "page": 10, "title": "정상패턴과 금지패턴", "preview": "FIG-13-10. Normal Pattern text Rule→CI→Artifact→Deploy→Evidence→Drift→ADR 정상패턴은 Architecture Rule을 Machine-readable하게 만들고 Source→Artifact→Deployment→Runtime Evidence까지 동일 Identity Chain으로 연결…", "column": 3, "html": "<h2>정상패턴과 금지패턴<\/h2>\n<h3>FIG-13-10. Normal Pattern<\/h3>\n<pre class=\"text-architecture\">Rule→CI→Artifact→Deploy→Evidence→Drift→ADR<\/pre>\n<p>정상패턴은 Architecture Rule을 Machine-readable하게 만들고 Source→Artifact→Deployment→Runtime Evidence까지 동일 Identity Chain으로 연결하는 것입니다.<\/p>\n<h3>FIG-13-11. Forbidden Pattern<\/h3>\n<pre class=\"text-architecture\">문서만 표준 / 재빌드 / Evidence 없이 PASS<\/pre>\n<p>문서 Review만으로 표준 준수를 선언하거나 환경마다 Artifact를 다시 Build하고 Runtime Evidence 없이 HG90를 PASS시키는 것을 금지합니다.<\/p>\n<hr>", "search": "정상패턴과 금지패턴 fig-13-10. normal pattern text rule→ci→artifact→deploy→evidence→drift→adr 정상패턴은 architecture rule을 machine-readable하게 만들고 source→artifact→deployment→runtime evidence까지 동일 identity chain으로 연결하는 것입니다. fig-13-11. forbidden pattern text 문서만 표준 / 재빌드 / evidence 없이 pass 문서 review만으로 표준 준수를 선언하거나 환경마다 artifact를 다시 build하고 runtime evidence 없이 hg90를 pass시키는 것을 금지합니다. ---"}, {"id": "topic-13-11", "chapter": 13, "page": 11, "title": "Architecture Decision", "preview": "FIG-13-12. 주안과 대안 text [주안] CI + Runtime Evidence Gate VS [대안] 문서 Review/수동점검", "column": 3, "html": "<h2>Architecture Decision<\/h2>\n<h3>FIG-13-12. 주안과 대안<\/h3>\n<pre class=\"text-architecture\">[주안]\nCI + Runtime Evidence Gate\n\n        VS\n\n[대안]\n문서 Review/수동점검<\/pre>\n<p>Machine-readable Rule, Immutable Artifact Promotion, Runtime Evidence Gate를 최종 운영모델로 채택합니다.<\/p>\n<p>수동 문서 Review와 환경별 재빌드는 사람이 기억해야 하는 규칙을 늘리고 동일 Binary 검증을 어렵게 하므로 장기 운영모델로 채택하지 않습니다.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>평가축<\/th><th>주안<\/th><th>대안<\/th><\/tr><\/thead><tbody><tr><td>책임/경계<\/td><td>명확<\/td><td>추가 보완 필요<\/td><\/tr><tr><td>Current PDMG 정합<\/td><td>높음<\/td><td>변경범위 가능<\/td><\/tr><tr><td>운영/장애분석<\/td><td>Trace 용이<\/td><td>복잡도 증가 가능<\/td><\/tr><tr><td>승인조건<\/td><td>기본 Rule/Test<\/td><td>별도 ADR + Evidence<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>", "search": "architecture decision fig-13-12. 주안과 대안 text [주안] ci + runtime evidence gate vs [대안] 문서 review/수동점검 machine-readable rule, immutable artifact promotion, runtime evidence gate를 최종 운영모델로 채택합니다. 수동 문서 review와 환경별 재빌드는 사람이 기억해야 하는 규칙을 늘리고 동일 binary 검증을 어렵게 하므로 장기 운영모델로 채택하지 않습니다. | 평가축 | 주안 | 대안 | |---|---|---| | 책임/경계 | 명확 | 추가 보완 필요 | | current pdmg 정합 | 높음 | 변경범위 가능 | | 운영/장애분석 | trace 용이 | 복잡도 증가 가능 | | 승인조건 | 기본 rule/test | 별도 adr + evidence | ---"}, {"id": "topic-13-12", "chapter": 13, "page": 12, "title": "Evidence / Conformance — 이 장의 Architecture를 무엇으로 증명하는가", "preview": "Evidence Architecture text 표준화와 10년 지속 가능성 Architecture Rule ↓ Source Evidence ↓ Config Evidence ↓ Runtime / Deployment Evidence", "column": 3, "html": "<h2>Evidence / Conformance — 이 장의 Architecture를 무엇으로 증명하는가<\/h2>\n<h3>Evidence Architecture<\/h3>\n<pre class=\"text-architecture\">표준화와 10년 지속 가능성 Architecture Rule\n        ↓\nSource Evidence\n        ↓\nConfig Evidence\n        ↓\nRuntime / Deployment Evidence\n        ↓\nConformance Test\n        ↓\nPASS / GAP / ADR<\/pre>\n<h4>Source Evidence<\/h4>\n<ul><li><code>[SOURCE]<\/code> Naming/ServiceId Standard<\/li><li><code>[SOURCE]<\/code> DevOps/OM/Observability<\/li><li><code>[SOURCE]<\/code> Traceability/PASS/GAP/ADR<\/li><li><code>[SOURCE]<\/code> Integrated Baseline<\/li><\/ul>\n<h4>Config Evidence<\/h4>\n<ul><li><code>[CONFIG]<\/code> Java 21 / Spring Boot 3.5.14 / Gradle multi-project<\/li><li><code>[CONFIG]<\/code> External Config + Secret Store Target<\/li><\/ul>\n<h4>Runtime / Deployment Evidence<\/h4>\n<ul><li><code>[RUNTIME]<\/code> sourceCommit→buildId→artifactHash→deploymentId→ServiceId/GUID→Runtime Evidence<\/li><\/ul>\n<h4>Architecture Decision<\/h4>\n<ul><li><code>[DECISION]<\/code> Build Once / Immutable Promotion<\/li><li><code>[DECISION]<\/code> CI + Runtime Evidence Gate<\/li><li><code>[DECISION]<\/code> Architecture Closed Loop<\/li><\/ul>\n<h4>Related ADR<\/h4>\n<ul><li><code>ADR-002 ServiceId SSOT<\/code><\/li><li><code>ADR-033 CI/CD Orchestrator OPEN<\/code><\/li><li><code>ADR-034 Immutable Artifact<\/code><\/li><li><code>ADR-035 Observability<\/code><\/li><li><code>ADR-037 Config/Secret<\/code><\/li><li><code>ADR-040 Runtime Evidence Gate<\/code><\/li><\/ul>\n<h4>Current GAP / OPEN<\/h4>\n<ul><li><code>[GAP/OPEN]<\/code> Naming Scanner<\/li><li><code>[GAP/OPEN]<\/code> Artifact/Deployment Identity<\/li><li><code>[GAP/OPEN]<\/code> Runtime Evidence Collector<\/li><li><code>[GAP/OPEN]<\/code> OM Control Plane<\/li><li><code>[GAP/OPEN]<\/code> Critical ADR Closure<\/li><\/ul>\n<h3>이 장의 판정<\/h3>\n<pre class=\"text-architecture\">Architecture Definition\n        ↓\nCONDITIONAL PASS\n\nCurrent PDMG Conformance\n        ↓\nPARTIAL / GAP\n\nRuntime Evidence Coverage\n        ↓\nMEDIUM\n\nArchitecture Definition PASS\n        ≠\nCurrent Implementation PASS<\/pre>\n<h4>PASS 전환조건<\/h4>\n<ul><li><code>CI Scanner<\/code><\/li><li><code>Immutable Artifact Identity<\/code><\/li><li><code>Deployment Trace<\/code><\/li><li><code>Runtime Evidence Collector<\/code><\/li><li><code>ADR-033/critical ADR closure<\/code><\/li><\/ul>\n<p>위 조건은 문서 완성도가 아니라 <strong>Current Implementation Conformance를 PASS로 전환하기 위한 Exit Criteria<\/strong>다. 해당 Evidence가 확보되기 전에는 <code>[GAP]<\/code>, <code>[OPEN]<\/code>, <code>[UNKNOWN]<\/code> 상태를 유지한다.<\/p>\n<hr>", "search": "evidence / conformance — 이 장의 architecture를 무엇으로 증명하는가 evidence architecture text 표준화와 10년 지속 가능성 architecture rule ↓ source evidence ↓ config evidence ↓ runtime / deployment evidence ↓ conformance test ↓ pass / gap / adr source evidence - [source] naming/serviceid standard - [source] devops/om/observability - [source] traceability/pass/gap/adr - [source] integrated baseline config evidence - [config] java 21 / spring boot 3.5.14 / gradle multi-project - [config] external config + secret store target runtime / deployment evidence - [runtime] sourcecommit→buildid→artifacthash→deploymentid→serviceid/guid→runtime evidence architecture decision - [decision] build once / immutable promotion - [decision] ci + runtime evidence gate - [decision] architecture closed loop related adr - adr-002 serviceid ssot - adr-033 ci/cd orchestrator open - adr-034 immutable artifact - adr-035 observability - adr-037 config/secret - adr-040 runtime evidence gate current gap / open - [gap/open] naming scanner - [gap/open] artifact/deployment identity - [gap/open] runtime evidence collector - [gap/open] om control plane - [gap/open] critical adr closure 이 장의 판정 text architecture definition ↓ conditional pass current pdmg conformance ↓ partial / gap runtime evidence coverage ↓ medium architecture definition pass ≠ current implementation pass pass 전환조건 - ci scanner - immutable artifact identity - deployment trace - runtime evidence collector - adr-033/critical adr closure 위 조건은 문서 완성도가 아니라 current implementation conformance를 pass로 전환하기 위한 exit criteria다. 해당 evidence가 확보되기 전에는 [gap], [open], [unknown] 상태를 유지한다. ---"}, {"id": "topic-13-13", "chapter": 13, "page": 13, "title": "Chapter Closing Script", "preview": "FIG-13-16. 다음 장 Handoff text 표준화와 10년 지속 가능성 ↓ 좋은 Architecture는 처음 잘 그린 그림이 아니라 계속 정합되는 체계다 ↓ 남은 질문 \"모든 Critical GAP와 Evidence를 닫고 공식 Architecture Baseline으로 Release한다\" ↓", "column": 3, "html": "<h2>Chapter Closing Script<\/h2>\n<h3>FIG-13-16. 다음 장 Handoff<\/h3>\n<pre class=\"text-architecture\">표준화와 10년 지속 가능성\n ↓\n좋은 Architecture는 처음 잘 그린 그림이 아니라 계속 정합되는 체계다\n ↓\n남은 질문\n&quot;모든 Critical GAP와 Evidence를 닫고 공식 Architecture Baseline으로 Release한다&quot;\n ↓\nHG90 Evidence-backed Baseline<\/pre>\n<p>13장의 결론은 명확합니다. 최종 산출물은 고정된 그림이 아니라 <strong>변경을 감지하고 Evidence로 다시 정합되는 Architecture 운영체계<\/strong>입니다. Critical GAP가 Source/Runtime/DR Evidence로 닫히고 G80 승인을 통과할 때 HG90 Architecture Baseline으로 Release합니다.<\/p>", "search": "chapter closing script fig-13-16. 다음 장 handoff text 표준화와 10년 지속 가능성 ↓ 좋은 architecture는 처음 잘 그린 그림이 아니라 계속 정합되는 체계다 ↓ 남은 질문 \"모든 critical gap와 evidence를 닫고 공식 architecture baseline으로 release한다\" ↓ hg90 evidence-backed baseline 13장의 결론은 명확합니다. 최종 산출물은 고정된 그림이 아니라 변경을 감지하고 evidence로 다시 정합되는 architecture 운영체계입니다. critical gap가 source/runtime/dr evidence로 닫히고 g80 승인을 통과할 때 hg90 architecture baseline으로 release합니다."}]}</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
let activeChapter=0, query='';
const byId=Object.fromEntries(DATA.pages.map(p=>[p.id,p]));
const q=s=>document.querySelector(s), qa=s=>[...document.querySelectorAll(s)];
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function chapter(no){return DATA.chapters.find(c=>c.no===no);}
function setTab(no){
 activeChapter=no;
 qa('.tab').forEach(b=>b.setAttribute('aria-selected', String(Number(b.dataset.ch)===no)));
 renderBoard();
}
function topicBadges(p){
 const title=p.title.toLowerCase();
 const out=[];
 if(title.includes('decision')||title.includes('adr')) out.push('<span class="type-badge decision">Decision</span>');
 if(title.includes('evidence')||title.includes('conformance')) out.push('<span class="type-badge evidence">Evidence</span>');
 if(title.includes('판정')) out.push('<span class="type-badge state">판정</span>');
 return out.length?`<div class="type-badges">${out.join('')}</div>`:'';
}
function makePageCard(p){
 const c=document.createElement('article'); c.className='card'; c.tabIndex=0; c.dataset.id=p.id;
 c.innerHTML=`<div class="card-no">PAGE ${String(p.page).padStart(2,'0')}</div><h3>${esc(p.title)}</h3>${topicBadges(p)}<div class="preview">${esc(p.preview)}</div><div class="more">내용 보기 →</div>`;
 c.onclick=()=>openTopic(p.id,true); c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openTopic(p.id,true)}};
 return c;
}
function renderBoard(){
 q('#detail').style.display='none'; q('#boardWrap').style.display='block'; q('#toolbar').style.display='flex';
 const board=q('#board'); board.innerHTML='';
 const chapters=activeChapter?DATA.chapters.filter(c=>c.no===activeChapter):DATA.chapters;
 let total=0, visibleChapters=0;
 chapters.forEach(ch=>{
   const pages=ch.pages.map(id=>byId[id]).filter(Boolean).filter(p=>!query||p.title.toLowerCase().includes(query)||p.search.includes(query));
   if(!pages.length) return;
   visibleChapters++; total+=pages.length;
   const sec=document.createElement('section'); sec.className='chapter-group'; sec.dataset.chapter=ch.no;
   sec.innerHTML=`<div class="chapter-head"><div><div class="chapter-kicker">CHAPTER ${String(ch.no).padStart(2,'0')}</div><h2 class="chapter-title">${esc(ch.title)}</h2></div><div class="chapter-meta">${pages.length} / ${ch.pages.length} 페이지</div></div><div class="page-grid"></div>`;
   const grid=sec.querySelector('.page-grid'); pages.forEach(p=>grid.appendChild(makePageCard(p)));
   board.appendChild(sec);
 });
 if(!total){board.innerHTML='<div class="empty">검색 결과가 없습니다.</div>'}
 q('#resultCount').textContent=activeChapter?`${total}개 페이지`:`${visibleChapters}개 Chapter · ${total}개 페이지`;
}

function sideLinks(current){
 const ch=chapter(current.chapter);
 const desktop=q('#sideLinks'), mobile=q('#mobileLinks');
 const html=ch.pages.map((id,idx)=>{
   const p=byId[id];
   if(!p) return '';
   const active=p.id===current.id?' active':'';
   const n=String(idx+1).padStart(2,'0');
   return `<a href="#${p.id}" class="${active.trim()}" data-topic="${p.id}" ${p.id===current.id?'aria-current="page"':''}>${n} ${esc(p.title)}</a>`;
 }).join('');
 desktop.innerHTML=html;
 mobile.innerHTML=html;
 [desktop,mobile].forEach(nav=>{
   nav.querySelectorAll('a[data-topic]').forEach(a=>{
     a.onclick=(e)=>{
       e.preventDefault();
       openTopic(a.dataset.topic,true);
     };
   });
 });
 const activeLink=desktop.querySelector('a.active');
 if(activeLink) activeLink.scrollIntoView({block:'nearest'});
}

function openTopic(id,push){
 const p=byId[id]; if(!p)return;
 activeChapter=p.chapter;
 qa('.tab').forEach(b=>b.setAttribute('aria-selected', String(Number(b.dataset.ch)===activeChapter)));
 q('#boardWrap').style.display='none'; q('#toolbar').style.display='none'; q('#detail').style.display='block';
 q('#detailEyebrow').textContent=`CHAPTER ${String(p.chapter).padStart(2,'0')} · ${chapter(p.chapter).title} · PAGE ${String(p.page).padStart(2,'0')}`;
 q('#detailTitle').textContent=p.title; q('#articleBody').innerHTML=p.html; sideLinks(p);
 const ch=chapter(p.chapter), idx=ch.pages.indexOf(p.id), prev=idx>0?byId[ch.pages[idx-1]]:null, next=idx<ch.pages.length-1?byId[ch.pages[idx+1]]:null;
 const pb=q('#prevBtn'), nb=q('#nextBtn');
 pb.disabled=!prev; pb.textContent=prev?`← ${prev.title}`:'← 이전 페이지 없음'; pb.onclick=()=>prev&&openTopic(prev.id,true);
 nb.textContent=next?`${next.title} →`:'NEXT INDEX →'; nb.onclick=()=>next?openTopic(next.id,true):document.getElementById('nextIndex').scrollIntoView({behavior:'smooth'});
 const ni=q('#nextIndex'), nextCh=DATA.chapters.find(c=>c.no===p.chapter+1);
 if(nextCh){
   ni.innerHTML=`<div class="label">NEXT INDEX</div><h3>CHAPTER ${String(nextCh.no).padStart(2,'0')} · ${esc(nextCh.title)}</h3><p>현재 장의 결론을 다음 Architecture 이야기로 자연스럽게 이어갑니다.</p><button id="nextIndexBtn">다음 Chapter로 이동 →</button>`;
   q('#nextIndexBtn').onclick=()=>openTopic(nextCh.pages[0],true);
 }else{
   ni.innerHTML=`<div class="label">NEXT INDEX</div><h3>전체 Architecture로 돌아가기</h3><p>모든 Chapter의 카드 보드에서 전체 흐름을 다시 살펴봅니다.</p><button id="nextIndexBtn">전체 카드 보드로 이동 →</button>`;
   q('#nextIndexBtn').onclick=()=>{activeChapter=0;query='';q('#search').value='';history.pushState({view:'board',chapter:0},'',location.pathname);setTab(0)};
 }
 if(push) history.pushState({view:'topic',id:p.id},'',`#${p.id}`);
 window.scrollTo({top:0,behavior:'auto'});
}
function backBoard(push=true){
 q('#search').value=query;
 if(push) history.pushState({view:'board',chapter:activeChapter},'',location.pathname+(activeChapter?`#chapter-${activeChapter}`:''));
 renderBoard();
}
qa('.tab').forEach(b=>b.onclick=()=>{const no=Number(b.dataset.ch); if(no===0){query='';q('#search').value='';history.pushState({view:'board',chapter:0},'',location.pathname);setTab(0)} else {history.pushState({view:'board',chapter:no},'',`#chapter-${no}`);setTab(no)}});
q('#search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();renderBoard()});
q('#backBtn').onclick=()=>backBoard(true);
document.addEventListener('keydown',e=>{
 const tag=(document.activeElement?.tagName||'').toLowerCase(); if(['input','textarea','select'].includes(tag))return;
 if(e.key==='/' && q('#toolbar').style.display!=='none'){e.preventDefault();q('#search').focus();return}
 if(q('#detail').style.display==='block'){
   const id=location.hash.slice(1), p=byId[id]; if(!p)return; const ch=chapter(p.chapter), idx=ch.pages.indexOf(p.id);
   if(e.key==='ArrowLeft'&&idx>0)openTopic(ch.pages[idx-1],true);
   if(e.key==='ArrowRight'){ if(idx<ch.pages.length-1)openTopic(ch.pages[idx+1],true); else q('#nextIndex').scrollIntoView({behavior:'smooth'});}
   if(e.key==='Escape')backBoard(true);
 }
});
window.addEventListener('popstate',()=>{
 const h=location.hash.slice(1);
 if(byId[h])openTopic(h,false);
 else if(h.startsWith('chapter-')){activeChapter=Number(h.split('-')[1])||0;renderBoard()}
 else {activeChapter=0;renderBoard()}
});
(function init(){
 const h=location.hash.slice(1);
 if(byId[h])openTopic(h,false);
 else if(h.startsWith('chapter-')){activeChapter=Number(h.split('-')[1])||0;renderBoard()}
 else renderBoard();
})();
</script>
</body>
