<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NSIGHT / PDMG Architecture Book — Interactive HTML</title>
<style>
:root{--navy:#102a43;--blue:#1769aa;--cyan:#00a6c7;--lt:#eef6fb;--white:#fff;--gray:#66788a;--line:#d9e4ec;--bg:#f5f8fb;--shadow:0 6px 18px rgba(16,42,67,.08)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:#172b3a;line-height:1.65}
.top{position:sticky;top:0;z-index:50;background:var(--navy);color:white;box-shadow:0 2px 10px rgba(0,0,0,.16)}
.brand{padding:14px 22px 8px;font-weight:800;letter-spacing:.2px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:thin}.tab{border:0;background:transparent;color:#d9e9f5;padding:9px 12px;border-radius:8px;white-space:nowrap;cursor:pointer;font-weight:700}.tab[aria-selected=true]{background:white;color:var(--blue);box-shadow:inset 0 -3px 0 var(--cyan)}
.toolbar{max-width:1500px;margin:18px auto 0;padding:0 20px;display:flex;gap:12px;align-items:center}.search{flex:1;max-width:620px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:white;font-size:15px}.count{color:var(--gray);font-size:14px}
.board{max-width:1500px;margin:16px auto 36px;padding:0 20px;display:block}
.chapter-group{background:#f7fbfe;border:1px solid #dcecf5;border-radius:16px;margin:0 0 20px;overflow:hidden;box-shadow:0 6px 22px rgba(16,55,80,.05)}
.chapter-group+.chapter-group{position:relative;margin-top:30px}
.chapter-group+.chapter-group:before{content:"↓";position:absolute;left:50%;top:-28px;transform:translateX(-50%);font-weight:900;color:var(--cyan);font-size:20px;line-height:24px}
.chapter-head{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;padding:18px 20px;background:linear-gradient(135deg,#eef8fd,#f9fcfe);border-bottom:1px solid #dcecf5}
.chapter-kicker{font-size:12px;font-weight:900;letter-spacing:.08em;color:var(--blue);margin-bottom:4px}
.chapter-title{font-size:22px;line-height:1.3;font-weight:900;color:var(--navy);margin:0}
.chapter-meta{white-space:nowrap;background:white;border:1px solid var(--line);padding:5px 10px;border-radius:999px;font-size:12px;color:var(--gray);font-weight:800}
.page-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;padding:16px}
.card{background:white;border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow);cursor:pointer;transition:.15s;outline:none;min-height:150px;display:flex;flex-direction:column}
.card:hover,.card:focus{transform:translateY(-1px);border-color:#8fc6df;box-shadow:0 8px 22px rgba(16,55,80,.10)}
.card-no{font-size:12px;color:var(--blue);font-weight:900;letter-spacing:.02em}.card h3{font-size:16px;line-height:1.35;margin:6px 0 8px;color:var(--navy)}.preview{font-size:13px;color:#52697a;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}.more{margin-top:auto;padding-top:12px;font-size:13px;color:var(--blue);font-weight:800}
.type-badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.type-badge{font-size:11px;padding:2px 7px;border-radius:999px;background:#eef5f8;border:1px solid #d4e5ed;color:#3b596b;font-weight:800}.type-badge.decision{background:#fff7e7;border-color:#f3d89d;color:#7c5712}.type-badge.evidence{background:#eef9f2;border-color:#bee2ca;color:#24633b}.type-badge.state{background:#f5f1ff;border-color:#d8caf8;color:#583d91;font-weight:800}
.empty{background:white;border:1px dashed var(--line);border-radius:12px;padding:30px;text-align:center;color:var(--gray)}
.detail{display:none;max-width:1500px;margin:18px auto 40px;padding:0 20px}.detail-grid{display:grid;grid-template-columns:280px minmax(0,1fr);gap:18px}.side{position:sticky;top:116px;align-self:start;max-height:calc(100vh - 140px);overflow:auto;background:white;border:1px solid var(--line);border-radius:12px;padding:14px}.side-title{font-weight:800;color:var(--navy);margin-bottom:8px}.side a{display:block;text-decoration:none;color:#425b6b;padding:8px 9px;border-radius:8px;font-size:13px}.side a.active{background:#e8f4fb;color:var(--blue);font-weight:800;border-left:4px solid var(--cyan)}
.article{min-width:0;background:white;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}.article-head{background:linear-gradient(135deg,var(--navy),#164d72);color:white;padding:22px}.back{border:1px solid rgba(255,255,255,.45);background:transparent;color:white;border-radius:8px;padding:8px 10px;cursor:pointer}.eyebrow{font-size:12px;opacity:.82;margin-top:15px}.article-head h1{margin:4px 0 0;font-size:28px;line-height:1.25}.article-body{padding:26px;max-width:1080px}.article-body h2,.article-body h3,.article-body h4{color:var(--navy);line-height:1.35}.article-body h2{margin-top:30px;border-bottom:1px solid var(--line);padding-bottom:8px}.article-body code{background:#edf3f7;color:#173247;padding:2px 5px;border-radius:4px}.article-body pre.text-architecture{display:block;margin:14px 0;background:#0c1b26!important;color:#e7f3fa!important;-webkit-text-fill-color:#e7f3fa!important;padding:18px!important;border-radius:10px;overflow:auto;line-height:1.55;font-family:Consolas,"Courier New","Malgun Gothic",monospace;font-size:14px;white-space:pre!important;tab-size:4}.article-body pre.text-architecture *{background:transparent!important;color:#e7f3fa!important;-webkit-text-fill-color:#e7f3fa!important;padding:0!important;border:0!important;box-shadow:none!important;font:inherit!important;white-space:inherit!important}.table-wrap{overflow:auto;margin:14px 0}.article-body table{border-collapse:collapse;width:100%;min-width:620px}.article-body th,.article-body td{border:1px solid var(--line);padding:9px 10px;vertical-align:top}.article-body th{background:#edf6fb;color:var(--navy)}blockquote{border-left:4px solid var(--cyan);margin:16px 0;padding:8px 14px;background:#f5fbfd;color:#385263}.article-body a{color:var(--blue)}
.nav-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:20px 26px;border-top:1px solid var(--line)}.navbtn{padding:13px 14px;border-radius:10px;border:1px solid var(--line);background:white;color:var(--navy);cursor:pointer;text-align:left;font-weight:700}.navbtn.next{text-align:right}.navbtn:disabled{opacity:.4;cursor:not-allowed}
.next-index{margin:0 26px 26px;padding:22px;border:1px solid #cfe7f3;border-radius:12px;background:#f1f9fd}.next-index .label{color:var(--cyan);font-weight:900;letter-spacing:1px}.next-index h3{margin:4px 0;color:var(--navy)}.next-index button{margin-top:8px;padding:10px 13px;border:0;border-radius:8px;background:var(--blue);color:white;font-weight:800;cursor:pointer}
.mobile-pages{display:none;margin:12px 0}.mobile-pages details{background:white;border:1px solid var(--line);border-radius:10px;padding:10px}.mobile-pages a{display:block;padding:8px;text-decoration:none;color:#425b6b}.mobile-pages a.active{font-weight:800;color:var(--blue)}
@media(max-width:1000px){.board{grid-template-columns:repeat(4,280px)}.detail-grid{display:block}.side{display:none}.mobile-pages{display:block}.article-head h1{font-size:24px}}
@media(max-width:620px){.brand{font-size:14px}.toolbar{display:block}.count{margin-top:8px}.article-body{padding:18px}.article-head{padding:18px}.nav-actions{grid-template-columns:1fr;padding:16px 18px}.navbtn.next{text-align:left}.next-index{margin:0 18px 18px}.board{padding:0 12px}.toolbar{padding:0 12px}}
@media print{.article-body pre.text-architecture{-webkit-print-color-adjust:exact;print-color-adjust:exact;}.top,.toolbar,.board,.side,.mobile-pages,.back,.nav-actions,.next-index{display:none!important}.detail{display:block!important;max-width:none;margin:0;padding:0}.detail-grid{display:block}.article{border:0;box-shadow:none}.article-head{background:white!important;color:black;padding:0 0 12px;border-bottom:2px solid #333}.article-body{max-width:none;padding:0}.text-architecture{background:white;color:black;border:1px solid #999;white-space:pre-wrap}.table-wrap{overflow:visible}.article-body table{min-width:0}}

@media(max-width:720px){.board{padding:0 10px}.chapter-head{padding:14px;gap:8px}.chapter-title{font-size:19px}.page-grid{grid-template-columns:1fr;padding:10px}.chapter-meta{display:none}.chapter-group+.chapter-group:before{top:-27px}}

/* Detail navigation reinforcement */
.detail[style*="display: block"] .side,
.detail[style*="display:block"] .side{display:block}
.nav-actions{position:relative;z-index:2;background:#fff}
.navbtn{display:block;min-height:52px}
@media(max-width:1000px){
  .detail[style*="display: block"] .side,
  .detail[style*="display:block"] .side{display:none}
}

</style>

↓\nLogical\n ↓\nPhysical\n ↓\nMechanism\n ↓\nRuntime\n ↓\nEvidence<\/pre>\n<p>이 그림은 이번 정의서의 출발점을 보여줍니다. 현재 PDMG에는 Module·Source·DB·Runtime이 각각 존재하지만, 그것들이 하나의 Architecture Chain으로 연결되어야 장애와 변경의 영향까지 설명할 수 있습니다. 따라서 1장에서는 새로운 제품을 정하지 않고, <strong>Current Fact를 Responsibility와 Runtime, Evidence로 다시 연결하는 이유<\/strong>를 먼저 고정합니다.<\/p>\n<hr>", "search": "0. opening script 이 장에서는 새로운 기술을 고르지 않습니다. 먼저 왜 다시 architecture를 정의해야 하는지부터 봅니다. pdmg에는 이미 source가 있고, module이 있고, db가 있고, 실제로 거래도 수행됩니다. 그런데 장애가 발생했을 때 “이 거래는 어느 thread에서 실행됐는가”, “이 serviceid는 어느 war와 jvm에서 실행됐는가”, “504가 발생한 뒤 db 작업은 실제로 끝났는가”를 하나의 구조로 설명하기는 어렵습니다. 그래서 이번 architecture 정의의 출발점은 시스템을 새로 상상하는 것이 아니라, 이미 존재하는 source·runtime·infrastructure·security·data·operations를 하나의 책임과 evidence 체계로 연결하는 것입니다. fig-01-01. 장 전체 architecture text 현재 보이는 것 module / source / server / data 각각 존재 ↓ 하지만 연결이 약함 ↓ runtime / failure / evidence 불명확 ↓ 재정의 business ↓ application ↓ logical ↓ physical ↓ mechanism ↓ runtime ↓ evidence 이 그림은 이번 정의서의 출발점을 보여줍니다. 현재 pdmg에는 module·source·db·runtime이 각각 존재하지만, 그것들이 하나의 architecture chain으로 연결되어야 장애와 변경의 영향까지 설명할 수 있습니다. 따라서 1장에서는 새로운 제품을 정하지 않고, current fact를 responsibility와 runtime, evidence로 다시 연결하는 이유를 먼저 고정합니다. ---"}, {"id": "topic-1-2", "chapter": 1, "page": 2, "title": "1. Inventory와 Architecture의 차이", "preview": "FIG-01-02. Inventory와 Architecture의 차이 text Inventory pdmg-ui / pdmg-jwt / pdmg-fw / pdmg-service Tomcat / MyBatis / DB VS Architecture", "column": 1, "html": "<h2>1. Inventory와 Architecture의 차이<\/h2>\n<h3>FIG-01-02. Inventory와 Architecture의 차이<\/h3>\n<pre class=\"text-architecture\">Inventory\npdmg-ui / pdmg-jwt / pdmg-fw / pdmg-service\nTomcat / MyBatis / DB\n\n        VS\n\nArchitecture\nUser\n ↓\nUI / Auth\n ↓\nRuntime Control\n ↓\nBusiness\n ↓\nData\n ↓\nEvidence<\/pre>\n<p>이 그림에서 먼저 봐야 할 것은 <strong>목록과 구조의 차이<\/strong>입니다. Inventory는 “무엇이 있는가”를 알려주지만, Architecture는 “누가 무엇을 책임지고, 어떤 순서로 실행되며, 실패하면 어디까지 영향을 주는가”를 설명해야 합니다.<\/p>\n<p>예를 들어 <code>pdmg-fw<\/code>가 존재한다는 사실만으로는 이것이 별도 서버인지, <code>pdmg-service<\/code>와 같은 Spring Context에 들어가는 Framework Module인지 알 수 없습니다. 그래서 Architecture는 이름이 아니라 <strong>책임과 Runtime 관계<\/strong>로 다시 읽어야 합니다.<\/p>\n<p>이 차이를 고정해야 뒤에서 Module, Logical Node, Physical Node를 혼동하지 않게 됩니다.<\/p>\n<hr>", "search": "1. inventory와 architecture의 차이 fig-01-02. inventory와 architecture의 차이 text inventory pdmg-ui / pdmg-jwt / pdmg-fw / pdmg-service tomcat / mybatis / db vs architecture user ↓ ui / auth ↓ runtime control ↓ business ↓ data ↓ evidence 이 그림에서 먼저 봐야 할 것은 목록과 구조의 차이입니다. inventory는 “무엇이 있는가”를 알려주지만, architecture는 “누가 무엇을 책임지고, 어떤 순서로 실행되며, 실패하면 어디까지 영향을 주는가”를 설명해야 합니다. 예를 들어 pdmg-fw가 존재한다는 사실만으로는 이것이 별도 서버인지, pdmg-service와 같은 spring context에 들어가는 framework module인지 알 수 없습니다. 그래서 architecture는 이름이 아니라 책임과 runtime 관계로 다시 읽어야 합니다. 이 차이를 고정해야 뒤에서 module, logical node, physical node를 혼동하지 않게 됩니다. ---"}, {"id": "topic-1-3", "chapter": 1, "page": 3, "title": "2. Module을 Responsibility로 다시 읽기", "preview": "FIG-01-03. Module을 Responsibility로 다시 읽기 text pdmg-ui → UI Delivery pdmg-jwt → Authentication / Token pdmg-service → Business Runtime pdmg-fw → Framework Runtime Control pdmg-om → Operations…", "column": 2, "html": "<h2>2. Module을 Responsibility로 다시 읽기<\/h2>\n<h3>FIG-01-03. Module을 Responsibility로 다시 읽기<\/h3>\n<pre class=\"text-architecture\">pdmg-ui      → UI Delivery\npdmg-jwt     → Authentication / Token\npdmg-service → Business Runtime\npdmg-fw      → Framework Runtime Control\npdmg-om      → Operations [UNKNOWN CURRENT]<\/pre>\n<p>여기서부터 PDMG를 단순 Module 집합이 아니라 <strong>책임의 집합<\/strong>으로 다시 읽습니다.<\/p>\n<p><code>pdmg-ui<\/code>는 화면과 요청 조립, <code>pdmg-jwt<\/code>는 인증과 토큰, <code>pdmg-service<\/code>는 업무 실행, <code>pdmg-fw<\/code>는 Filter·Context·TCF·Timeout·Transaction 같은 공통 Runtime Control을 담당합니다. <code>pdmg-om<\/code>은 기준에는 존재하지만 현재 Source/Runtime 범위가 충분히 확인되지 않았으므로 <code>[UNKNOWN]<\/code>을 유지합니다.<\/p>\n<p>이렇게 책임을 먼저 고정하면 Module을 Physical Server로 바로 내려보내는 오류를 피할 수 있습니다.<\/p>\n<hr>", "search": "2. module을 responsibility로 다시 읽기 fig-01-03. module을 responsibility로 다시 읽기 text pdmg-ui → ui delivery pdmg-jwt → authentication / token pdmg-service → business runtime pdmg-fw → framework runtime control pdmg-om → operations [unknown current] 여기서부터 pdmg를 단순 module 집합이 아니라 책임의 집합으로 다시 읽습니다. pdmg-ui는 화면과 요청 조립, pdmg-jwt는 인증과 토큰, pdmg-service는 업무 실행, pdmg-fw는 filter·context·tcf·timeout·transaction 같은 공통 runtime control을 담당합니다. pdmg-om은 기준에는 존재하지만 현재 source/runtime 범위가 충분히 확인되지 않았으므로 [unknown]을 유지합니다. 이렇게 책임을 먼저 고정하면 module을 physical server로 바로 내려보내는 오류를 피할 수 있습니다. ---"}, {"id": "topic-1-4", "chapter": 1, "page": 4, "title": "3. Source와 Runtime은 다른 그림이다", "preview": "FIG-01-04. Source와 Runtime은 다른 그림이다 text SOURCE VIEW Controller / Handler ↓ Facade ↓ Service ↓", "column": 2, "html": "<h2>3. Source와 Runtime은 다른 그림이다<\/h2>\n<h3>FIG-01-04. Source와 Runtime은 다른 그림이다<\/h3>\n<pre class=\"text-architecture\">SOURCE VIEW\nController / Handler\n ↓\nFacade\n ↓\nService\n ↓\nDAO\n ↓\nMapper\n\n        VS\n\nRUNTIME VIEW\nFilter → Security → MVC → TCF\n→ Worker → TX → Handler\n→ Facade → Service → DAO → DB<\/pre>\n<p>Source Layer Diagram은 코드 구조를 설명하고, Runtime Diagram은 <strong>거래 한 건이 실제로 지나가는 시간순서<\/strong>를 설명합니다. 둘은 같은 그림이 아닙니다.<\/p>\n<p>Source만 보면 Filter와 Security, Worker Pool, TransactionTemplate, Context 전파가 보이지 않습니다. 반대로 Runtime만 보면 Program·Package·Mapper의 정적 구조가 보이지 않습니다.<\/p>\n<p>따라서 이번 정의서는 두 그림을 분리해서 설명한 뒤, 마지막에 ServiceId와 GUID를 축으로 다시 연결합니다.<\/p>\n<hr>", "search": "3. source와 runtime은 다른 그림이다 fig-01-04. source와 runtime은 다른 그림이다 text source view controller / handler ↓ facade ↓ service ↓ dao ↓ mapper vs runtime view filter → security → mvc → tcf → worker → tx → handler → facade → service → dao → db source layer diagram은 코드 구조를 설명하고, runtime diagram은 거래 한 건이 실제로 지나가는 시간순서를 설명합니다. 둘은 같은 그림이 아닙니다. source만 보면 filter와 security, worker pool, transactiontemplate, context 전파가 보이지 않습니다. 반대로 runtime만 보면 program·package·mapper의 정적 구조가 보이지 않습니다. 따라서 이번 정의서는 두 그림을 분리해서 설명한 뒤, 마지막에 serviceid와 guid를 축으로 다시 연결합니다. ---"}, {"id": "topic-1-5", "chapter": 1, "page": 5, "title": "4. Timeout과 Transaction의 경계", "preview": "FIG-01-05. Timeout과 Transaction의 경계 text Request Thread ↓ Future.get(5000ms) ├─ complete └─ timeout → 504 │ │ worker may continue", "column": 2, "html": "<h2>4. Timeout과 Transaction의 경계<\/h2>\n<h3>FIG-01-05. Timeout과 Transaction의 경계<\/h3>\n<pre class=\"text-architecture\">Request Thread\n ↓\nFuture.get(5000ms)\n ├─ complete\n └─ timeout → 504\n        │\n        │ worker may continue\n        ▼\nWorker Thread\n ↓\nTransactionTemplate\n ↓\nJDBC / DB<\/pre>\n<p>이 그림이 중요한 이유는 <strong>HTTP 응답의 수명과 DB Transaction의 수명이 같지 않기 때문<\/strong>입니다.<\/p>\n<p>현재 Snapshot에서 Request Thread는 <code>Future.get(5000ms)<\/code>로 Worker 완료를 기다릴 수 있지만, 5초가 지나 504를 반환했다고 해서 Worker가 같은 시점에 끝났다는 보장은 없습니다. <code>cancel(true)<\/code>도 JDBC Statement Cancel이나 DB Session Kill을 자동으로 의미하지 않습니다.<\/p>\n<p>그래서 이후 Runtime 장에서는 <code>HTTP 504 ≠ Worker 종료 ≠ JDBC cancel ≠ Rollback 완료<\/code>를 핵심 원칙으로 사용합니다.<\/p>\n<hr>", "search": "4. timeout과 transaction의 경계 fig-01-05. timeout과 transaction의 경계 text request thread ↓ future.get(5000ms) ├─ complete └─ timeout → 504 │ │ worker may continue ▼ worker thread ↓ transactiontemplate ↓ jdbc / db 이 그림이 중요한 이유는 http 응답의 수명과 db transaction의 수명이 같지 않기 때문입니다. 현재 snapshot에서 request thread는 future.get(5000ms)로 worker 완료를 기다릴 수 있지만, 5초가 지나 504를 반환했다고 해서 worker가 같은 시점에 끝났다는 보장은 없습니다. cancel(true)도 jdbc statement cancel이나 db session kill을 자동으로 의미하지 않습니다. 그래서 이후 runtime 장에서는 http 504 ≠ worker 종료 ≠ jdbc cancel ≠ rollback 완료를 핵심 원칙으로 사용합니다. ---"}, {"id": "topic-1-6", "chapter": 1, "page": 6, "title": "5. Security GAP는 구조 문제다", "preview": "FIG-01-06. Security GAP는 구조 문제다 text pdmg-jwt RS256 Issue ↓ JWT ↓ pdmg-fw HMAC Verify Path", "column": 2, "html": "<h2>5. Security GAP는 구조 문제다<\/h2>\n<h3>FIG-01-06. Security GAP는 구조 문제다<\/h3>\n<pre class=\"text-architecture\">pdmg-jwt\n  RS256 Issue\n      ↓\n     JWT\n      ↓\npdmg-fw\n  HMAC Verify Path\n      ↓\nBusiness Runtime\n\n[CRITICAL GAP]<\/pre>\n<p>JWT의 발급과 검증 방식이 맞지 않는 문제는 단순 구현 버그로 끝나지 않습니다. Issuer, Verifier, Key Source, JWKS, Rotation, Multi-instance, DR Trust까지 연결되는 <strong>Architecture Boundary 문제<\/strong>입니다.<\/p>\n<p>특히 인증 성공과 업무 인가는 다릅니다. Token이 검증되더라도 <code>sub/ssoId<\/code>가 실제 Business User Context와 어떻게 묶이는지 확인되어야 합니다.<\/p>\n<p>그래서 Security는 별도 장으로 분리되지만, 1장부터 Critical GAP로 전면에 둡니다.<\/p>\n<hr>", "search": "5. security gap는 구조 문제다 fig-01-06. security gap는 구조 문제다 text pdmg-jwt rs256 issue ↓ jwt ↓ pdmg-fw hmac verify path ↓ business runtime [critical gap] jwt의 발급과 검증 방식이 맞지 않는 문제는 단순 구현 버그로 끝나지 않습니다. issuer, verifier, key source, jwks, rotation, multi-instance, dr trust까지 연결되는 architecture boundary 문제입니다. 특히 인증 성공과 업무 인가는 다릅니다. token이 검증되더라도 sub/ssoid가 실제 business user context와 어떻게 묶이는지 확인되어야 합니다. 그래서 security는 별도 장으로 분리되지만, 1장부터 critical gap로 전면에 둡니다. ---"}, {"id": "topic-1-7", "chapter": 1, "page": 7, "title": "6. ServiceId를 Architecture Backbone으로 본다", "preview": "FIG-01-07. ServiceId를 Architecture Backbone으로 본다 text Business ↓ Program ↓ ServiceId ↓ Handler", "column": 1, "html": "<h2>6. ServiceId를 Architecture Backbone으로 본다<\/h2>\n<h3>FIG-01-07. ServiceId를 Architecture Backbone으로 본다<\/h3>\n<pre class=\"text-architecture\">Business\n ↓\nProgram\n ↓\nServiceId\n ↓\nHandler\n ↓\nFacade\n ↓\nService\n ↓\nDAO\n ↓\nMapper / SqlId\n ↓\nTable<\/pre>\n<p>PDMG에서 가장 중요한 연결축 중 하나는 <code>ServiceId<\/code>입니다. 이것은 단순한 URL 코드가 아니라 Business와 Source, SQL, Runtime을 연결하는 식별자입니다.<\/p>\n<p>예를 들어 <code>mgcoa9001S0<\/code>은 Handler Registry의 Key가 되고, Handler에서 Facade/Service를 거쳐 Mapper/SqlId와 연결될 수 있습니다. 운영 시에는 이 ServiceId가 GUID, elapsed, ErrorCode와 결합되어야 합니다.<\/p>\n<p>이 축이 안정되면 “이 업무가 어떤 코드와 SQL을 타는가”뿐 아니라 “장애 시 어느 Deployment에서 실행됐는가”까지 확장할 수 있습니다.<\/p>\n<hr>", "search": "6. serviceid를 architecture backbone으로 본다 fig-01-07. serviceid를 architecture backbone으로 본다 text business ↓ program ↓ serviceid ↓ handler ↓ facade ↓ service ↓ dao ↓ mapper / sqlid ↓ table pdmg에서 가장 중요한 연결축 중 하나는 serviceid입니다. 이것은 단순한 url 코드가 아니라 business와 source, sql, runtime을 연결하는 식별자입니다. 예를 들어 mgcoa9001s0은 handler registry의 key가 되고, handler에서 facade/service를 거쳐 mapper/sqlid와 연결될 수 있습니다. 운영 시에는 이 serviceid가 guid, elapsed, errorcode와 결합되어야 합니다. 이 축이 안정되면 “이 업무가 어떤 코드와 sql을 타는가”뿐 아니라 “장애 시 어느 deployment에서 실행됐는가”까지 확장할 수 있습니다. ---"}, {"id": "topic-1-8", "chapter": 1, "page": 8, "title": "7. Logical에서 Physical까지 연결되어야 한다", "preview": "FIG-01-08. Logical에서 Physical까지 연결되어야 한다 text Application ↓ Logical Technical Node ↓ Environment ↓ Center", "column": 1, "html": "<h2>7. Logical에서 Physical까지 연결되어야 한다<\/h2>\n<h3>FIG-01-08. Logical에서 Physical까지 연결되어야 한다<\/h3>\n<pre class=\"text-architecture\">Application\n ↓\nLogical Technical Node\n ↓\nEnvironment\n ↓\nCenter\n ↓\nHost / VM\n ↓\nJVM\n ↓\nWAR\n ↓\nDeploymentId\n ↓\nEvidence<\/pre>\n<p>Application 이름과 Server 이름 사이에는 여러 단계가 있습니다. 이 단계를 생략하면 <code>Server = JVM = WAR<\/code> 같은 잘못된 모델이 생깁니다.<\/p>\n<p>이번 정의서에서는 Application Responsibility를 Logical Node로 변환한 뒤, Physical 장에서 Center·Host·VM·JVM·WAR로 내려갑니다. 그 다음 DevOps 장에서 Artifact/DeploymentId와 연결합니다.<\/p>\n<p>현재 가장 큰 Physical GAP는 이 전수 Mapping이 아직 완전히 닫히지 않았다는 점입니다.<\/p>\n<hr>", "search": "7. logical에서 physical까지 연결되어야 한다 fig-01-08. logical에서 physical까지 연결되어야 한다 text application ↓ logical technical node ↓ environment ↓ center ↓ host / vm ↓ jvm ↓ war ↓ deploymentid ↓ evidence application 이름과 server 이름 사이에는 여러 단계가 있습니다. 이 단계를 생략하면 server = jvm = war 같은 잘못된 모델이 생깁니다. 이번 정의서에서는 application responsibility를 logical node로 변환한 뒤, physical 장에서 center·host·vm·jvm·war로 내려갑니다. 그 다음 devops 장에서 artifact/deploymentid와 연결합니다. 현재 가장 큰 physical gap는 이 전수 mapping이 아직 완전히 닫히지 않았다는 점입니다. ---"}, {"id": "topic-1-9", "chapter": 1, "page": 9, "title": "8. Architecture Closed Loop", "preview": "FIG-01-09. Architecture Closed Loop text Document ↓ Model ↓ Code ↓ Test", "column": 3, "html": "<h2>8. Architecture Closed Loop<\/h2>\n<h3>FIG-01-09. Architecture Closed Loop<\/h3>\n<pre class=\"text-architecture\">Document\n ↓\nModel\n ↓\nCode\n ↓\nTest\n ↓\nRuntime Evidence\n ↓\nDrift\n ↓\nGAP / ADR\n ↓\nNew Baseline<\/pre>\n<p>Architecture는 한 번 작성하고 끝나는 문서가 아닙니다. Source와 Config, Deployment는 계속 바뀌기 때문에 문서가 자동으로 낡습니다.<\/p>\n<p>그래서 마지막 장에서는 Architecture Rule을 CI와 Runtime Evidence에 연결하고, Drift가 발생하면 GAP나 ADR로 닫은 뒤 Baseline을 갱신하는 Closed Loop를 정의합니다.<\/p>\n<p>1장의 결론은 명확합니다. <strong>우리가 다시 짓는 것은 시스템이 아니라, 시스템을 설명하고 검증하는 Architecture 체계입니다.<\/strong><\/p>\n<hr>", "search": "8. architecture closed loop fig-01-09. architecture closed loop text document ↓ model ↓ code ↓ test ↓ runtime evidence ↓ drift ↓ gap / adr ↓ new baseline architecture는 한 번 작성하고 끝나는 문서가 아닙니다. source와 config, deployment는 계속 바뀌기 때문에 문서가 자동으로 낡습니다. 그래서 마지막 장에서는 architecture rule을 ci와 runtime evidence에 연결하고, drift가 발생하면 gap나 adr로 닫은 뒤 baseline을 갱신하는 closed loop를 정의합니다. 1장의 결론은 명확합니다. 우리가 다시 짓는 것은 시스템이 아니라, 시스템을 설명하고 검증하는 architecture 체계입니다. ---"}, {"id": "topic-1-10", "chapter": 1, "page": 10, "title": "정상패턴과 금지패턴", "preview": "FIG-01-10. Normal Pattern text Current Fact → Responsibility → Runtime → Evidence 정상패턴은 Current Fact를 먼저 고정한 뒤 책임·Runtime·Evidence를 연결하는 것입니다. 문서의 문장을 Source보다 우선하지 않고, Target을 Current로 승격하지…", "column": 3, "html": "<h2>정상패턴과 금지패턴<\/h2>\n<h3>FIG-01-10. Normal Pattern<\/h3>\n<pre class=\"text-architecture\">Current Fact → Responsibility → Runtime → Evidence<\/pre>\n<p>정상패턴은 Current Fact를 먼저 고정한 뒤 책임·Runtime·Evidence를 연결하는 것입니다. 문서의 문장을 Source보다 우선하지 않고, Target을 Current로 승격하지 않습니다.<\/p>\n<h3>FIG-01-11. Forbidden Pattern<\/h3>\n<pre class=\"text-architecture\">문서=Fact / Target=Current / Log=Evidence<\/pre>\n<p>금지해야 할 것은 문서에 있는 Target 구조를 Current Fact처럼 쓰거나, 로그가 존재한다는 이유만으로 Runtime Evidence가 확보됐다고 판단하는 것입니다.<\/p>\n<hr>", "search": "정상패턴과 금지패턴 fig-01-10. normal pattern text current fact → responsibility → runtime → evidence 정상패턴은 current fact를 먼저 고정한 뒤 책임·runtime·evidence를 연결하는 것입니다. 문서의 문장을 source보다 우선하지 않고, target을 current로 승격하지 않습니다. fig-01-11. forbidden pattern text 문서=fact / target=current / log=evidence 금지해야 할 것은 문서에 있는 target 구조를 current fact처럼 쓰거나, 로그가 존재한다는 이유만으로 runtime evidence가 확보됐다고 판단하는 것입니다. ---"}, {"id": "topic-1-11", "chapter": 1, "page": 11, "title": "Architecture Decision", "preview": "FIG-01-12. 주안과 대안 text [주안] Evidence-backed Architecture Baseline VS [대안] Document-centered Baseline", "column": 3, "html": "<h2>Architecture Decision<\/h2>\n<h3>FIG-01-12. 주안과 대안<\/h3>\n<pre class=\"text-architecture\">[주안]\nEvidence-backed Architecture Baseline\n\n        VS\n\n[대안]\nDocument-centered Baseline<\/pre>\n<p>Evidence-backed Baseline을 주안으로 고정합니다. 문서 중심 방식보다 구현·배포·Runtime과의 Drift를 발견할 수 있고, 이후 Architecture를 운영체계로 전환할 수 있기 때문입니다.<\/p>\n<p>Document-centered Baseline은 초기 정리에는 빠르지만 Source/Runtime 변경을 자동으로 감지할 수 없습니다. 따라서 설명자료로는 사용할 수 있어도 최종 Baseline의 주안으로는 채택하지 않습니다.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>평가축<\/th><th>주안<\/th><th>대안<\/th><\/tr><\/thead><tbody><tr><td>책임/경계<\/td><td>명확<\/td><td>추가 보완 필요<\/td><\/tr><tr><td>Current PDMG 정합<\/td><td>높음<\/td><td>변경범위 가능<\/td><\/tr><tr><td>운영/장애분석<\/td><td>Trace 용이<\/td><td>복잡도 증가 가능<\/td><\/tr><tr><td>승인조건<\/td><td>기본 Rule/Test<\/td><td>별도 ADR + Evidence<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>", "search": "architecture decision fig-01-12. 주안과 대안 text [주안] evidence-backed architecture baseline vs [대안] document-centered baseline evidence-backed baseline을 주안으로 고정합니다. 문서 중심 방식보다 구현·배포·runtime과의 drift를 발견할 수 있고, 이후 architecture를 운영체계로 전환할 수 있기 때문입니다. document-centered baseline은 초기 정리에는 빠르지만 source/runtime 변경을 자동으로 감지할 수 없습니다. 따라서 설명자료로는 사용할 수 있어도 최종 baseline의 주안으로는 채택하지 않습니다. | 평가축 | 주안 | 대안 | |---|---|---| | 책임/경계 | 명확 | 추가 보완 필요 | | current pdmg 정합 | 높음 | 변경범위 가능 | | 운영/장애분석 | trace 용이 | 복잡도 증가 가능 | | 승인조건 | 기본 rule/test | 별도 adr + evidence | ---"}, {"id": "topic-1-12", "chapter": 1, "page": 12, "title": "Evidence / Conformance — 이 장의 Architecture를 무엇으로 증명하는가", "preview": "Evidence Architecture text 왜 다시 짓는가 Architecture Rule ↓ Source Evidence ↓ Config Evidence ↓ Runtime / Deployment Evidence", "column": 2, "html": "<h2>Evidence / Conformance — 이 장의 Architecture를 무엇으로 증명하는가<\/h2>\n<h3>Evidence Architecture<\/h3>\n<pre class=\"text-architecture\">왜 다시 짓는가 Architecture Rule\n        ↓\nSource Evidence\n        ↓\nConfig Evidence\n        ↓\nRuntime / Deployment Evidence\n        ↓\nConformance Test\n        ↓\nPASS / GAP / ADR<\/pre>\n<h4>Source Evidence<\/h4>\n<ul><li><code>[SOURCE]<\/code> PDMG 기준 Module: pdmg-ui / pdmg-jwt / pdmg-fw / pdmg-service / pdmg-om<\/li><li><code>[SOURCE]<\/code> Business Package: nhnis.mg.co.a.*<\/li><li><code>[SOURCE]<\/code> Framework Package: nhnis.fw.<em>, com.ims.superspring.<\/em><\/li><li><code>[SOURCE]<\/code> Mapper Resource: rdw.mg.co.a/<\/li><\/ul>\n<h4>Config Evidence<\/h4>\n<ul><li><code>[CONFIG]<\/code> TCF enabled=true<\/li><li><code>[CONFIG]<\/code> Timeout enabled=true / 5000ms<\/li><li><code>[CONFIG]<\/code> Worker pool=20 / queue=100<\/li><\/ul>\n<h4>Runtime / Deployment Evidence<\/h4>\n<ul><li><code>[RUNTIME]<\/code> Filter→Security→MVC→TCF→Worker→Transaction→Handler→Facade→Service→DAO→DB<\/li><li><code>[RUNTIME]<\/code> ServiceId/GUID 기반 추적 기반 존재<\/li><\/ul>\n<h4>Architecture Decision<\/h4>\n<ul><li><code>[DECISION]<\/code> Evidence-backed Architecture Baseline<\/li><li><code>[DECISION]<\/code> PDMG Current ≠ NSIGHT Target<\/li><\/ul>\n<h4>Related ADR<\/h4>\n<ul><li><code>ADR-001 Architecture Baseline/SSOT<\/code><\/li><li><code>ADR-003 PDMG↔NSIGHT Mapping<\/code><\/li><li><code>ADR-040 Runtime Evidence Gate<\/code><\/li><\/ul>\n<h4>Current GAP / OPEN<\/h4>\n<ul><li><code>[GAP/OPEN]<\/code> JWT 발급/검증 정합<\/li><li><code>[GAP/OPEN]<\/code> Identity Binding<\/li><li><code>[GAP/OPEN]<\/code> Artifact→JVM/Host<\/li><li><code>[GAP/OPEN]<\/code> pdmg-om Scope<\/li><li><code>[GAP/OPEN]<\/code> Runtime Evidence 자동화<\/li><\/ul>\n<h3>이 장의 판정<\/h3>\n<pre class=\"text-architecture\">Architecture Definition\n        ↓\nCONDITIONAL PASS\n\nCurrent PDMG Conformance\n        ↓\nPARTIAL / GAP\n\nRuntime Evidence Coverage\n        ↓\nMEDIUM\n\nArchitecture Definition PASS\n        ≠\nCurrent Implementation PASS<\/pre>\n<h4>PASS 전환조건<\/h4>\n<ul><li><code>JWT 발급/검증/Key 정합<\/code><\/li><li><code>Identity Binding<\/code><\/li><li><code>Artifact→JVM/Host Trace<\/code><\/li><li><code>pdmg-om Scope<\/code><\/li><li><code>Runtime Evidence 자동화<\/code><\/li><\/ul>\n<p>위 조건은 문서 완성도가 아니라 <strong>Current Implementation Conformance를 PASS로 전환하기 위한 Exit Criteria<\/strong>다. 해당 Evidence가 확보되기 전에는 <code>[GAP]<\/code>, <code>[OPEN]<\/code>, <code>[UNKNOWN]<\/code> 상태를 유지한다.<\/p>\n<hr>", "search": "evidence / conformance — 이 장의 architecture를 무엇으로 증명하는가 evidence architecture text 왜 다시 짓는가 architecture rule ↓ source evidence ↓ config evidence ↓ runtime / deployment evidence ↓ conformance test ↓ pass / gap / adr source evidence - [source] pdmg 기준 module: pdmg-ui / pdmg-jwt / pdmg-fw / pdmg-service / pdmg-om - [source] business package: nhnis.mg.co.a. - [source] framework package: nhnis.fw., com.ims.superspring. - [source] mapper resource: rdw.mg.co.a/ config evidence - [config] tcf enabled=true - [config] timeout enabled=true / 5000ms - [config] worker pool=20 / queue=100 runtime / deployment evidence - [runtime] filter→security→mvc→tcf→worker→transaction→handler→facade→service→dao→db - [runtime] serviceid/guid 기반 추적 기반 존재 architecture decision - [decision] evidence-backed architecture baseline - [decision] pdmg current ≠ nsight target related adr - adr-001 architecture baseline/ssot - adr-003 pdmg↔nsight mapping - adr-040 runtime evidence gate current gap / open - [gap/open] jwt 발급/검증 정합 - [gap/open] identity binding - [gap/open] artifact→jvm/host - [gap/open] pdmg-om scope - [gap/open] runtime evidence 자동화 이 장의 판정 text architecture definition ↓ conditional pass current pdmg conformance ↓ partial / gap runtime evidence coverage ↓ medium architecture definition pass ≠ current implementation pass pass 전환조건 - jwt 발급/검증/key 정합 - identity binding - artifact→jvm/host trace - pdmg-om scope - runtime evidence 자동화 위 조건은 문서 완성도가 아니라 current implementation conformance를 pass로 전환하기 위한 exit criteria다. 해당 evidence가 확보되기 전에는 [gap], [open], [unknown] 상태를 유지한다. ---"}, {"id": "topic-1-13", "chapter": 1, "page": 13, "title": "Chapter Closing Script", "preview": "FIG-01-16. 다음 장 Handoff text 왜 다시 짓는가 ↓ 이미 시스템은 있지만, Architecture는 하나로 보이지 않는다 ↓ 남은 질문 \"저장소와 Application 중심에서 살아 움직이는 Platform Architecture로\" ↓", "column": 0, "html": "<h2>Chapter Closing Script<\/h2>\n<h3>FIG-01-16. 다음 장 Handoff<\/h3>\n<pre class=\"text-architecture\">왜 다시 짓는가\n ↓\n이미 시스템은 있지만, Architecture는 하나로 보이지 않는다\n ↓\n남은 질문\n&quot;저장소와 Application 중심에서 살아 움직이는 Platform Architecture로&quot;\n ↓\n정보계 패러다임의 전환<\/pre>\n<p>1장의 결론은 시스템을 새로 상상하는 것이 아니라 <strong>이미 존재하는 PDMG를 설명 가능한 Architecture로 다시 연결해야 한다<\/strong>는 것입니다. 다음 장에서는 왜 기존 Application 중심 관점만으로는 이 연결을 설명하기 어려운지, 정보계 패러다임 변화부터 정리합니다.<\/p>", "search": "chapter closing script fig-01-16. 다음 장 handoff text 왜 다시 짓는가 ↓ 이미 시스템은 있지만, architecture는 하나로 보이지 않는다 ↓ 남은 질문 \"저장소와 application 중심에서 살아 움직이는 platform architecture로\" ↓ 정보계 패러다임의 전환 1장의 결론은 시스템을 새로 상상하는 것이 아니라 이미 존재하는 pdmg를 설명 가능한 architecture로 다시 연결해야 한다는 것입니다. 다음 장에서는 왜 기존 application 중심 관점만으로는 이 연결을 설명하기 어려운지, 정보계 패러다임 변화부터 정리합니다."}, {"id": "topic-2-1", "chapter": 2, "page": 1, "title": "0. Opening Script", "preview": "1장에서 왜 다시 정의해야 하는지 확인했다면, 2장에서는 무엇이 달라져야 하는가를 봅니다. 기존 정보계는 화면·업무 Java·DB를 중심으로 설명해도 어느 정도 이해할 수 있었습니다. 그러나 차세대 정보계는 실시간 거래, 인증, 데이터 이동, 대량 분석, 장애격리, 운영증적이 하나의 플랫폼 안에서 동시에 움직입니다. 따라서 설명의 중심도 …", "column": 1, "html": "<h2>0. Opening Script<\/h2>\n<p>1장에서 왜 다시 정의해야 하는지 확인했다면, 2장에서는 <strong>무엇이 달라져야 하는가<\/strong>를 봅니다.<\/p>\n<p>기존 정보계는 화면·업무 Java·DB를 중심으로 설명해도 어느 정도 이해할 수 있었습니다. 그러나 차세대 정보계는 실시간 거래, 인증, 데이터 이동, 대량 분석, 장애격리, 운영증적이 하나의 플랫폼 안에서 동시에 움직입니다.<\/p>\n<p>따라서 설명의 중심도 Application 자체에서 <strong>Responsibility, Runtime, Data Flow, Failure Domain, Evidence<\/strong>로 이동해야 합니다.<\/p>\n<h3>FIG-02-01. 장 전체 Architecture<\/h3>\n<pre class=\"text-architecture\">과거\nUser → Application → DB\n\n        ↓ 전환\n\n현재/목표\nUser\n ↓\nUI / Authentication\n ↓\nApplication Runtime\n ↓\nFramework Control\n ↓\nData / Integration\n ↓\nOperations / Evidence<\/pre>\n<p>이 그림에서 변화의 중심은 Application 개수가 아닙니다. <code>User → Application → DB<\/code>만으로 설명하던 관점에서 벗어나, UI·인증·Runtime Control·Data Flow·Operations까지 Architecture 범위로 확장합니다. 앞으로의 설계는 제품이 아니라 <strong>책임과 Capability, Runtime 특성<\/strong>을 기준으로 내려갑니다.<\/p>\n<hr>", "search": "0. opening script 1장에서 왜 다시 정의해야 하는지 확인했다면, 2장에서는 무엇이 달라져야 하는가를 봅니다. 기존 정보계는 화면·업무 java·db를 중심으로 설명해도 어느 정도 이해할 수 있었습니다. 그러나 차세대 정보계는 실시간 거래, 인증, 데이터 이동, 대량 분석, 장애격리, 운영증적이 하나의 플랫폼 안에서 동시에 움직입니다. 따라서 설명의 중심도 application 자체에서 responsibility, runtime, data flow, failure domain, evidence로 이동해야 합니다. fig-02-01. 장 전체 architecture text 과거 user → application → db ↓ 전환 현재/목표 user ↓ ui / authentication ↓ application runtime ↓ framework control ↓ data / integration ↓ operations / evidence 이 그림에서 변화의 중심은 application 개수가 아닙니다. user → application → db만으로 설명하던 관점에서 벗어나, ui·인증·runtime control·data flow·operations까지 architecture 범위로 확장합니다. 앞으로의 설계는 제품이 아니라 책임과 capability, runtime 특성을 기준으로 내려갑니다. ---"}, {"id": "topic-2-2", "chapter": 2, "page": 2, "title": "1. Application-centric의 한계", "preview": "FIG-02-02. Application-centric의 한계 text Screen ↓ Business Java ↓ SQL ↓ DB", "column": 1, "html": "<h2>1. Application-centric의 한계<\/h2>\n<h3>FIG-02-02. Application-centric의 한계<\/h3>\n<pre class=\"text-architecture\">Screen\n ↓\nBusiness Java\n ↓\nSQL\n ↓\nDB\n\n보이지 않는 것\nThread / Security / Timeout / Deployment / Evidence<\/pre>\n<p>기존 방식이 틀렸다는 의미는 아닙니다. 기능 중심 개발에는 충분했습니다. 문제는 시스템 규모와 운영복잡도가 커졌는데도 같은 관점으로 설명하려 할 때 생깁니다.<\/p>\n<p>Thread와 Connection Pool, Token Verification, Interface Contract, Deployment Artifact를 설명하지 못하면 장애 원인을 Application 내부에서만 찾게 됩니다.<\/p>\n<p>그래서 Architecture의 범위를 Source Code 밖으로 확장합니다.<\/p>\n<hr>", "search": "1. application-centric의 한계 fig-02-02. application-centric의 한계 text screen ↓ business java ↓ sql ↓ db 보이지 않는 것 thread / security / timeout / deployment / evidence 기존 방식이 틀렸다는 의미는 아닙니다. 기능 중심 개발에는 충분했습니다. 문제는 시스템 규모와 운영복잡도가 커졌는데도 같은 관점으로 설명하려 할 때 생깁니다. thread와 connection pool, token verification, interface contract, deployment artifact를 설명하지 못하면 장애 원인을 application 내부에서만 찾게 됩니다. 그래서 architecture의 범위를 source code 밖으로 확장합니다. ---"}, {"id": "topic-2-3", "chapter": 2, "page": 3, "title": "2. Responsibility-centric 전환", "preview": "FIG-02-03. Responsibility-centric 전환 text UI Delivery Authentication Application Runtime Framework Control Data Service Integration Operations", "column": 1, "html": "<h2>2. Responsibility-centric 전환<\/h2>\n<h3>FIG-02-03. Responsibility-centric 전환<\/h3>\n<pre class=\"text-architecture\">UI Delivery\nAuthentication\nApplication Runtime\nFramework Control\nData Service\nIntegration\nOperations\n\n각 책임은 분리\n연결은 Contract<\/pre>\n<p>이번 전환의 첫 번째 핵심은 Application 이름 대신 <strong>책임을 먼저 보는 것<\/strong>입니다.<\/p>\n<p>UI가 인증을 소유하지 않고, 인증이 Business Logic을 소유하지 않으며, Framework가 특정 업무 SQL을 소유하지 않도록 경계를 둡니다. 책임은 안으로 고정하고 연결은 경계에서 통제하는 방식입니다.<\/p>\n<p>이렇게 해야 한 영역의 변경이 다른 영역으로 번지는 범위를 줄일 수 있습니다.<\/p>\n<hr>", "search": "2. responsibility-centric 전환 fig-02-03. responsibility-centric 전환 text ui delivery authentication application runtime framework control data service integration operations 각 책임은 분리 연결은 contract 이번 전환의 첫 번째 핵심은 application 이름 대신 책임을 먼저 보는 것입니다. ui가 인증을 소유하지 않고, 인증이 business logic을 소유하지 않으며, framework가 특정 업무 sql을 소유하지 않도록 경계를 둡니다. 책임은 안으로 고정하고 연결은 경계에서 통제하는 방식입니다. 이렇게 해야 한 영역의 변경이 다른 영역으로 번지는 범위를 줄일 수 있습니다. ---"}, {"id": "topic-2-4", "chapter": 2, "page": 4, "title": "3. Module에서 Runtime Boundary로", "preview": "FIG-02-04. Module에서 Runtime Boundary로 text Build Module ↓ Runtime Relationship ↓ Process / JVM ↓ Spring Context", "column": 1, "html": "<h2>3. Module에서 Runtime Boundary로<\/h2>\n<h3>FIG-02-04. Module에서 Runtime Boundary로<\/h3>\n<pre class=\"text-architecture\">Build Module\n ↓\nRuntime Relationship\n ↓\nProcess / JVM\n ↓\nSpring Context\n\nModule ≠ Process ≠ JVM<\/pre>\n<p>두 번째 전환은 Module과 Runtime을 구분하는 것입니다. <code>pdmg-service<\/code>와 <code>pdmg-fw<\/code>가 각각 Build Module이라고 해서 반드시 서로 다른 Process라는 뜻은 아닙니다.<\/p>\n<p>현재 분석에서는 <code>scanBasePackages=\"nhnis\"<\/code>에 의해 Framework Bean과 Business Bean이 같은 ApplicationContext에서 협력할 수 있습니다.<\/p>\n<p>따라서 Build 구조는 Source Management 관점, Runtime Boundary는 실행/장애 관점으로 분리해서 봐야 합니다.<\/p>\n<hr>", "search": "3. module에서 runtime boundary로 fig-02-04. module에서 runtime boundary로 text build module ↓ runtime relationship ↓ process / jvm ↓ spring context module ≠ process ≠ jvm 두 번째 전환은 module과 runtime을 구분하는 것입니다. pdmg-service와 pdmg-fw가 각각 build module이라고 해서 반드시 서로 다른 process라는 뜻은 아닙니다. 현재 분석에서는 scanbasepackages=\"nhnis\"에 의해 framework bean과 business bean이 같은 applicationcontext에서 협력할 수 있습니다. 따라서 build 구조는 source management 관점, runtime boundary는 실행/장애 관점으로 분리해서 봐야 합니다. ---"}, {"id": "topic-2-5", "chapter": 2, "page": 5, "title": "4. Product에서 Capability로", "preview": "FIG-02-05. Product에서 Capability로 text Tomcat ↓ Application Runtime Capability HikariCP ↓ Connection Pool Capability", "column": 2, "html": "<h2>4. Product에서 Capability로<\/h2>\n<h3>FIG-02-05. Product에서 Capability로<\/h3>\n<pre class=\"text-architecture\">Tomcat\n ↓\nApplication Runtime Capability\n\nHikariCP\n ↓\nConnection Pool Capability\n\nMyBatis\n ↓\nSQL Mapping Capability<\/pre>\n<p>제품은 Architecture가 아닙니다. 제품은 Architecture가 요구하는 Capability를 구현하는 수단입니다.<\/p>\n<p>예를 들어 Tomcat을 쓴다는 사실보다 중요한 것은 Request Thread, Connector, JVM Failure Domain을 어떻게 가져갈지입니다. HikariCP 역시 제품명보다 Connection Pool의 Capacity와 Timeout 관계가 중요합니다.<\/p>\n<p>그래서 Logical 장에서는 제품보다 Capability를 먼저 정의합니다.<\/p>\n<hr>", "search": "4. product에서 capability로 fig-02-05. product에서 capability로 text tomcat ↓ application runtime capability hikaricp ↓ connection pool capability mybatis ↓ sql mapping capability 제품은 architecture가 아닙니다. 제품은 architecture가 요구하는 capability를 구현하는 수단입니다. 예를 들어 tomcat을 쓴다는 사실보다 중요한 것은 request thread, connector, jvm failure domain을 어떻게 가져갈지입니다. hikaricp 역시 제품명보다 connection pool의 capacity와 timeout 관계가 중요합니다. 그래서 logical 장에서는 제품보다 capability를 먼저 정의합니다. ---"}, {"id": "topic-2-6", "chapter": 2, "page": 6, "title": "5. Online에서 FAST/DEEP Workload로", "preview": "FIG-02-06. Online에서 FAST/DEEP Workload로 text FAST HTTP / Event / CDC ↓ bounded latency DEEP ETL / ADW / BI", "column": 2, "html": "<h2>5. Online에서 FAST/DEEP Workload로<\/h2>\n<h3>FIG-02-06. Online에서 FAST/DEEP Workload로<\/h3>\n<pre class=\"text-architecture\">FAST\nHTTP / Event / CDC\n ↓\nbounded latency\n\nDEEP\nETL / ADW / BI\n ↓\nheavy workload<\/pre>\n<p>차세대 정보계는 모든 처리를 같은 Runtime으로 묶지 않습니다. 즉시 응답이 필요한 FAST와 장시간·대량 연산이 가능한 DEEP Workload를 분리합니다.<\/p>\n<p>PDMG Current는 HTTP/Transaction 중심의 FAST Runtime Evidence가 강합니다. Event/CDC/ETL/BI는 NSIGHT Target Reference로 별도 관리합니다.<\/p>\n<p>이 구분이 나중에 RDW/ADW 분리와 Capacity Isolation의 근거가 됩니다.<\/p>\n<hr>", "search": "5. online에서 fast/deep workload로 fig-02-06. online에서 fast/deep workload로 text fast http / event / cdc ↓ bounded latency deep etl / adw / bi ↓ heavy workload 차세대 정보계는 모든 처리를 같은 runtime으로 묶지 않습니다. 즉시 응답이 필요한 fast와 장시간·대량 연산이 가능한 deep workload를 분리합니다. pdmg current는 http/transaction 중심의 fast runtime evidence가 강합니다. event/cdc/etl/bi는 nsight target reference로 별도 관리합니다. 이 구분이 나중에 rdw/adw 분리와 capacity isolation의 근거가 됩니다. ---"}, {"id": "topic-2-7", "chapter": 2, "page": 7, "title": "6. Server에서 Logical→Physical로", "preview": "FIG-02-07. Server에서 Logical→Physical로 text Responsibility ↓ Logical Node ↓ Scale / State / Failure ↓ VM / JVM / WAR", "column": 1, "html": "<h2>6. Server에서 Logical→Physical로<\/h2>\n<h3>FIG-02-07. Server에서 Logical→Physical로<\/h3>\n<pre class=\"text-architecture\">Responsibility\n ↓\nLogical Node\n ↓\nScale / State / Failure\n ↓\nVM / JVM / WAR<\/pre>\n<p>세 번째 전환은 Application을 곧바로 Server에 배치하지 않는 것입니다.<\/p>\n<p>Logical Node 단계에서 Stateless인지, 어떤 Scale Unit을 가지는지, 어떤 Failure Domain을 가져야 하는지 결정한 뒤 Physical Resource로 내려갑니다.<\/p>\n<p>이렇게 해야 VM 크기나 Server 수량이 Architecture Intent와 연결됩니다.<\/p>\n<hr>", "search": "6. server에서 logical→physical로 fig-02-07. server에서 logical→physical로 text responsibility ↓ logical node ↓ scale / state / failure ↓ vm / jvm / war 세 번째 전환은 application을 곧바로 server에 배치하지 않는 것입니다. logical node 단계에서 stateless인지, 어떤 scale unit을 가지는지, 어떤 failure domain을 가져야 하는지 결정한 뒤 physical resource로 내려갑니다. 이렇게 해야 vm 크기나 server 수량이 architecture intent와 연결됩니다. ---"}, {"id": "topic-2-8", "chapter": 2, "page": 8, "title": "7. Logging에서 Evidence로", "preview": "FIG-02-08. Logging에서 Evidence로 text Log = 사건 기록 Evidence = Rule 준수 증명 Rule", "column": 3, "html": "<h2>7. Logging에서 Evidence로<\/h2>\n<h3>FIG-02-08. Logging에서 Evidence로<\/h3>\n<pre class=\"text-architecture\">Log\n= 사건 기록\n\nEvidence\n= Rule 준수 증명\n\nRule\n ↓\nRuntime Metric/Test\n ↓\nEvidence\n ↓\nPASS<\/pre>\n<p>로그는 중요하지만 로그가 있다고 Architecture가 지켜졌다고 말할 수는 없습니다.<\/p>\n<p>예를 들어 ServiceId가 로그에 찍힌다는 것과 “모든 거래가 올바른 Handler로 라우팅됐다”는 것은 다른 주장입니다. 후자는 Registry/Runtime Test가 필요합니다.<\/p>\n<p>따라서 마지막에는 Log를 Metric/Trace/Test와 묶어 Evidence로 승격합니다.<\/p>\n<hr>", "search": "7. logging에서 evidence로 fig-02-08. logging에서 evidence로 text log = 사건 기록 evidence = rule 준수 증명 rule ↓ runtime metric/test ↓ evidence ↓ pass 로그는 중요하지만 로그가 있다고 architecture가 지켜졌다고 말할 수는 없습니다. 예를 들어 serviceid가 로그에 찍힌다는 것과 “모든 거래가 올바른 handler로 라우팅됐다”는 것은 다른 주장입니다. 후자는 registry/runtime test가 필요합니다. 따라서 마지막에는 log를 metric/trace/test와 묶어 evidence로 승격합니다. ---"}, {"id": "topic-2-9", "chapter": 2, "page": 9, "title": "8. Document에서 Closed Loop로", "preview": "FIG-02-09. Document에서 Closed Loop로 text Document ↓ Rule ↓ Source / CI ↓ Deployment", "column": 2, "html": "<h2>8. Document에서 Closed Loop로<\/h2>\n<h3>FIG-02-09. Document에서 Closed Loop로<\/h3>\n<pre class=\"text-architecture\">Document\n ↓\nRule\n ↓\nSource / CI\n ↓\nDeployment\n ↓\nRuntime\n ↓\nDrift / ADR<\/pre>\n<p>패러다임 전환의 마지막은 문서 운영 방식입니다.<\/p>\n<p>문서가 Source를 따라가는 것이 아니라, Architecture Rule이 Source와 Deployment를 검사하고 Runtime Evidence가 이를 다시 확인하는 구조로 전환합니다.<\/p>\n<p>이제 Architecture는 산출물이 아니라 <strong>변경을 통제하는 운영체계<\/strong>가 됩니다.<\/p>\n<hr>", "search": "8. document에서 closed loop로 fig-02-09. document에서 closed loop로 text document ↓ rule ↓ source / ci ↓ deployment ↓ runtime ↓ drift / adr 패러다임 전환의 마지막은 문서 운영 방식입니다. 문서가 source를 따라가는 것이 아니라, architecture rule이 source와 deployment를 검사하고 runtime evidence가 이를 다시 확인하는 구조로 전환합니다. 이제 architecture는 산출물이 아니라 변경을 통제하는 운영체계가 됩니다. ---"}, {"id": "topic-2-10", "chapter": 2, "page": 10, "title": "정상패턴과 금지패턴", "preview": "FIG-02-10. Normal Pattern text Responsibility → Capability → Runtime → Evidence 정상패턴은 Application 이름을 곧바로 Server나 Product로 매핑하지 않고 Responsibility→Capability→Runtime→Evidence 순서로 해석하는 것입니다. F…", "column": 1, "html": "<h2>정상패턴과 금지패턴<\/h2>\n<h3>FIG-02-10. Normal Pattern<\/h3>\n<pre class=\"text-architecture\">Responsibility → Capability → Runtime → Evidence<\/pre>\n<p>정상패턴은 Application 이름을 곧바로 Server나 Product로 매핑하지 않고 Responsibility→Capability→Runtime→Evidence 순서로 해석하는 것입니다.<\/p>\n<h3>FIG-02-11. Forbidden Pattern<\/h3>\n<pre class=\"text-architecture\">Module=Server / Product=Node / Current=Target<\/pre>\n<p>Module=Server, Product=Logical Node, Current=Target 같은 단축 해석은 이후 Capacity·Security·DR 판단을 모두 왜곡하므로 허용하지 않습니다.<\/p>\n<hr>", "search": "정상패턴과 금지패턴 fig-02-10. normal pattern text responsibility → capability → runtime → evidence 정상패턴은 application 이름을 곧바로 server나 product로 매핑하지 않고 responsibility→capability→runtime→evidence 순서로 해석하는 것입니다. fig-02-11. forbidden pattern text module=server / product=node / current=target module=server, product=logical node, current=target 같은 단축 해석은 이후 capacity·security·dr 판단을 모두 왜곡하므로 허용하지 않습니다. ---"}, {"id": "topic-2-11", "chapter": 2, "page": 11, "title": "Architecture Decision", "preview": "FIG-02-12. 주안과 대안 text [주안] Runtime/Platform까지 Architecture Scope 확장 VS [대안] Application Source 중심 Scope", "column": 1, "html": "<h2>Architecture Decision<\/h2>\n<h3>FIG-02-12. 주안과 대안<\/h3>\n<pre class=\"text-architecture\">[주안]\nRuntime/Platform까지 Architecture Scope 확장\n\n        VS\n\n[대안]\nApplication Source 중심 Scope<\/pre>\n<p>Architecture Scope를 Source 내부에 한정하지 않고 Runtime/Platform/Data/Operations까지 확장합니다. 이것이 차세대 정보계의 실제 장애와 변경영향을 설명할 수 있는 최소 범위입니다.<\/p>\n<p>Application Source 중심 Scope는 개발 관점에서는 단순하지만 Thread·Security·Deployment·Data Flow를 별도 문서로 분산시키므로 전체 Architecture 기준으로는 부족합니다.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>평가축<\/th><th>주안<\/th><th>대안<\/th><\/tr><\/thead><tbody><tr><td>책임/경계<\/td><td>명확<\/td><td>추가 보완 필요<\/td><\/tr><tr><td>Current PDMG 정합<\/td><td>높음<\/td><td>변경범위 가능<\/td><\/tr><tr><td>운영/장애분석<\/td><td>Trace 용이<\/td><td>복잡도 증가 가능<\/td><\/tr><tr><td>승인조건<\/td><td>기본 Rule/Test<\/td><td>별도 ADR + Evidence<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>", "search": "architecture decision fig-02-12. 주안과 대안 text [주안] runtime/platform까지 architecture scope 확장 vs [대안] application source 중심 scope architecture scope를 source 내부에 한정하지 않고 runtime/platform/data/operations까지 확장합니다. 이것이 차세대 정보계의 실제 장애와 변경영향을 설명할 수 있는 최소 범위입니다. application source 중심 scope는 개발 관점에서는 단순하지만 thread·security·deployment·data flow를 별도 문서로 분산시키므로 전체 architecture 기준으로는 부족합니다. | 평가축 | 주안 | 대안 | |---|---|---| | 책임/경계 | 명확 | 추가 보완 필요 | | current pdmg 정합 | 높음 | 변경범위 가능 | | 운영/장애분석 | trace 용이 | 복잡도 증가 가능 | | 승인조건 | 기본 rule/test | 별도 adr + evidence | ---"}, {"id": "topic-2-12", "chapter": 2, "page": 12, "title": "Evidence / Conformance — 이 장의 Architecture를 무엇으로 증명하는가", "preview": "Evidence Architecture text 정보계 패러다임의 전환 Architecture Rule ↓ Source Evidence ↓ Config Evidence ↓ Runtime / Deployment Evidence", "column": 3, "html": "<h2>Evidence / Conformance — 이 장의 Architecture를 무엇으로 증명하는가<\/h2>\n<h3>Evidence Architecture<\/h3>\n<pre class=\"text-architecture\">정보계 패러다임의 전환 Architecture Rule\n        ↓\nSource Evidence\n        ↓\nConfig Evidence\n        ↓\nRuntime / Deployment Evidence\n        ↓\nConformance Test\n        ↓\nPASS / GAP / ADR<\/pre>\n<h4>Source Evidence<\/h4>\n<ul><li><code>[SOURCE]<\/code> Module 책임과 Runtime Boundary 분석<\/li><li><code>[SOURCE]<\/code> pdmg-service + pdmg-fw 동일 Spring Runtime 가능<\/li><\/ul>\n<h4>Config Evidence<\/h4>\n<ul><li><code>[CONFIG]<\/code> Module build 2>0. Opening Script<\/h2>\n<p>전환 방향을 정했으면 이제 설계 순서가 필요합니다. 복잡한 정보계를 한 번에 그리면 Application, Server, Product, Runtime이 같은 레벨에 섞입니다.<\/p>\n<p>그래서 NSIGHT Architecture는 <strong>VISION → BIG PICTURE → LOGICAL → PHYSICAL → MECHANISM → RUNTIME<\/strong>의 여섯 단계로 내려갑니다. 그리고 마지막에는 Evidence로 다시 위로 올라옵니다.<\/p>\n<p>이 순서는 문서 목차가 아니라, 의사결정의 순서입니다.<\/p>\n<h3>FIG-03-01. 장 전체 Architecture<\/h3>\n<pre class=\"text-architecture\">VISION\n ↓\nBIG PICTURE\n ↓\nLOGICAL\n ↓\nPHYSICAL\n ↓\nMECHANISM\n ↓\nRUNTIME\n ↓\nEVIDENCE / PASS<\/pre>\n<p>이 여섯 단계는 목차가 아니라 의사결정 순서입니다. 상위 단계에서 방향과 경계를 정하지 않은 채 Physical이나 제품부터 고르면 뒤에서 설계를 합리화하게 됩니다. 그래서 VISION에서 시작해 RUNTIME까지 내려간 후, 마지막에는 Source와 Runtime Evidence로 다시 위의 의도를 검증합니다.<\/p>\n<hr>", "search": "0. opening script 전환 방향을 정했으면 이제 설계 순서가 필요합니다. 복잡한 정보계를 한 번에 그리면 application, server, product, runtime이 같은 레벨에 섞입니다. 그래서 nsight architecture는 vision → big picture → logical → physical → mechanism → runtime의 여섯 단계로 내려갑니다. 그리고 마지막에는 evidence로 다시 위로 올라옵니다. 이 순서는 문서 목차가 아니라, 의사결정의 순서입니다. fig-03-01. 장 전체 architecture text vision ↓ big picture ↓ logical ↓ physical ↓ mechanism ↓ runtime ↓ evidence / pass 이 여섯 단계는 목차가 아니라 의사결정 순서입니다. 상위 단계에서 방향과 경계를 정하지 않은 채 physical이나 제품부터 고르면 뒤에서 설계를 합리화하게 됩니다. 그래서 vision에서 시작해 runtime까지 내려간 후, 마지막에는 source와 runtime evidence로 다시 위의 의도를 검증합니다. ---"}, {"id": "topic-3-2", "chapter": 3, "page": 2, "title": "1. VISION — 방향을 고정한다", "preview": "FIG-03-02. VISION — 방향을 고정한다 text Scalable Resilient Data-Centric ↓ Architecture Decision Criteria", "column": 2, "html": "<h2>1. VISION — 방향을 고정한다<\/h2>\n<h3>FIG-03-02. VISION — 방향을 고정한다<\/h3>\n<pre class=\"text-architecture\">Scalable\nResilient\nData-Centric\n ↓\nArchitecture Decision Criteria<\/pre>\n<p>VISION은 제품을 정하는 단계가 아닙니다. 이후 모든 의사결정을 판단할 기준을 고정하는 단계입니다.<\/p>\n<p>예를 들어 Scalable을 말하면서 하나의 거대한 Failure Domain을 만들 수는 없습니다. Resilient를 말하면서 Restore Drill 없이 DR PASS를 선언할 수도 없습니다.<\/p>\n<p>VISION은 뒤의 Logical·Physical 장을 구속하는 설계계약입니다.<\/p>\n<hr>", "search": "1. vision — 방향을 고정한다 fig-03-02. vision — 방향을 고정한다 text scalable resilient data-centric ↓ architecture decision criteria vision은 제품을 정하는 단계가 아닙니다. 이후 모든 의사결정을 판단할 기준을 고정하는 단계입니다. 예를 들어 scalable을 말하면서 하나의 거대한 failure domain을 만들 수는 없습니다. resilient를 말하면서 restore drill 없이 dr pass를 선언할 수도 없습니다. vision은 뒤의 logical·physical 장을 구속하는 설계계약입니다. ---"}, {"id": "topic-3-3", "chapter": 3, "page": 3, "title": "2. BIG PICTURE — 책임과 경계를 고정한다", "preview": "FIG-03-03. BIG PICTURE — 책임과 경계를 고정한다 text User / Channel ↓ Application Boundary ↓ Data / Integration ↓ Operations", "column": 1, "html": "<h2>2. BIG PICTURE — 책임과 경계를 고정한다<\/h2>\n<h3>FIG-03-03. BIG PICTURE — 책임과 경계를 고정한다<\/h3>\n<pre class=\"text-architecture\">User / Channel\n ↓\nApplication Boundary\n ↓\nData / Integration\n ↓\nOperations<\/pre>\n<p>Big Picture에서는 세부 Class나 Product를 보지 않습니다. 누가 어떤 책임을 가지고 어떤 경계를 넘는지만 봅니다.<\/p>\n<p>이 단계가 약하면 뒤에서 UI가 DB를 직접 보거나, External System이 내부 Table을 직접 변경하는 구조가 생길 수 있습니다.<\/p>\n<p>따라서 Big Picture는 적은 박스로 전체 책임을 고정하는 단계입니다.<\/p>\n<hr>", "search": "2. big picture — 책임과 경계를 고정한다 fig-03-03. big picture — 책임과 경계를 고정한다 text user / channel ↓ application boundary ↓ data / integration ↓ operations big picture에서는 세부 class나 product를 보지 않습니다. 누가 어떤 책임을 가지고 어떤 경계를 넘는지만 봅니다. 이 단계가 약하면 뒤에서 ui가 db를 직접 보거나, external system이 내부 table을 직접 변경하는 구조가 생길 수 있습니다. 따라서 big picture는 적은 박스로 전체 책임을 고정하는 단계입니다. ---"}, {"id": "topic-3-4", "chapter": 3, "page": 4, "title": "3. LOGICAL — 기술 역할을 정의한다", "preview": "FIG-03-04. LOGICAL — 기술 역할을 정의한다 text Application Responsibility ↓ Technical Capability ↓ Logical Node ↓ State / Scale / Failure / Security", "column": 1, "html": "<h2>3. LOGICAL — 기술 역할을 정의한다<\/h2>\n<h3>FIG-03-04. LOGICAL — 기술 역할을 정의한다<\/h3>\n<pre class=\"text-architecture\">Application Responsibility\n ↓\nTechnical Capability\n ↓\nLogical Node\n ↓\nState / Scale / Failure / Security<\/pre>\n<p>Logical Architecture는 제품을 사기 전에 필요한 기술 역할을 정의합니다.<\/p>\n<p>Application Runtime, Authentication, Data Service, Integration, Operations 같은 Node를 만들고 각각의 State와 Scale, Failure Domain을 정의합니다.<\/p>\n<p>이 단계가 있어야 Physical 설계가 제품과 서버 수량의 나열로 떨어지지 않습니다.<\/p>\n<hr>", "search": "3. logical — 기술 역할을 정의한다 fig-03-04. logical — 기술 역할을 정의한다 text application responsibility ↓ technical capability ↓ logical node ↓ state / scale / failure / security logical architecture는 제품을 사기 전에 필요한 기술 역할을 정의합니다. application runtime, authentication, data service, integration, operations 같은 node를 만들고 각각의 state와 scale, failure domain을 정의합니다. 이 단계가 있어야 physical 설계가 제품과 서버 수량의 나열로 떨어지지 않습니다. ---"}, {"id": "topic-3-5", "chapter": 3, "page": 5, "title": "4. PHYSICAL — 실제 자원으로 내린다", "preview": "FIG-03-05. PHYSICAL — 실제 자원으로 내린다 text Logical Node ↓ Environment ↓ Center ↓ Host / VM", "column": 2, "html": "<h2>4. PHYSICAL — 실제 자원으로 내린다<\/h2>\n<h3>FIG-03-05. PHYSICAL — 실제 자원으로 내린다<\/h3>\n<pre class=\"text-architecture\">Logical Node\n ↓\nEnvironment\n ↓\nCenter\n ↓\nHost / VM\n ↓\nJVM / WAR\n ↓\nNetwork / DB<\/pre>\n<p>Physical 장에서는 Logical Node가 실제 어디에서 실행되는지 확정합니다.<\/p>\n<p>Server, VM, JVM, WAR를 구분하고 Network, DB, Storage, Monitoring까지 함께 봅니다.<\/p>\n<p>여기서 Candidate Capacity와 실제 Production Fact를 구분하는 것이 중요합니다.<\/p>\n<hr>", "search": "4. physical — 실제 자원으로 내린다 fig-03-05. physical — 실제 자원으로 내린다 text logical node ↓ environment ↓ center ↓ host / vm ↓ jvm / war ↓ network / db physical 장에서는 logical node가 실제 어디에서 실행되는지 확정합니다. server, vm, jvm, war를 구분하고 network, db, storage, monitoring까지 함께 봅니다. 여기서 candidate capacity와 실제 production fact를 구분하는 것이 중요합니다. ---"}, {"id": "topic-3-6", "chapter": 3, "page": 6, "title": "5. MECHANISM — 실행규칙을 정한다", "preview": "FIG-03-06. MECHANISM — 실행규칙을 정한다 text Filter ↓ Security ↓ TCF ↓ Timeout", "column": 2, "html": "<h2>5. MECHANISM — 실행규칙을 정한다<\/h2>\n<h3>FIG-03-06. MECHANISM — 실행규칙을 정한다<\/h3>\n<pre class=\"text-architecture\">Filter\n ↓\nSecurity\n ↓\nTCF\n ↓\nTimeout\n ↓\nTransaction\n ↓\nError / Logging<\/pre>\n<p>Mechanism은 같은 Infrastructure 위에서도 거래가 동일한 방식으로 움직이게 만드는 표준입니다.<\/p>\n<p>Filter가 Context를 만들고 Security가 Trust를 확인하며 TCF가 ServiceId를 라우팅하고 Worker/Transaction이 실행경계를 만듭니다.<\/p>\n<p>시스템은 서버만으로 움직이지 않고 이런 실행규칙으로 움직입니다.<\/p>\n<hr>", "search": "5. mechanism — 실행규칙을 정한다 fig-03-06. mechanism — 실행규칙을 정한다 text filter ↓ security ↓ tcf ↓ timeout ↓ transaction ↓ error / logging mechanism은 같은 infrastructure 위에서도 거래가 동일한 방식으로 움직이게 만드는 표준입니다. filter가 context를 만들고 security가 trust를 확인하며 tcf가 serviceid를 라우팅하고 worker/transaction이 실행경계를 만듭니다. 시스템은 서버만으로 움직이지 않고 이런 실행규칙으로 움직입니다. ---"}, {"id": "topic-3-7", "chapter": 3, "page": 7, "title": "6. RUNTIME — 시간축으로 검증한다", "preview": "FIG-03-07. RUNTIME — 시간축으로 검증한다 text T0 Request T1 Filter T2 Security T3 Controller T4 Worker T5 Transaction T6 DB", "column": 2, "html": "<h2>6. RUNTIME — 시간축으로 검증한다<\/h2>\n<h3>FIG-03-07. RUNTIME — 시간축으로 검증한다<\/h3>\n<pre class=\"text-architecture\">T0 Request\nT1 Filter\nT2 Security\nT3 Controller\nT4 Worker\nT5 Transaction\nT6 DB\nT7 Response<\/pre>\n<p>Runtime 장에서는 정적인 구조를 실제 시간순서로 펼칩니다.<\/p>\n<p>여기서 Request Thread와 Worker Thread, HTTP Timeout과 DB Transaction 수명 같은 차이가 드러납니다.<\/p>\n<p>Runtime을 봐야 설계가 실제 동작과 맞는지 확인할 수 있습니다.<\/p>\n<hr>", "search": "6. runtime — 시간축으로 검증한다 fig-03-07. runtime — 시간축으로 검증한다 text t0 request t1 filter t2 security t3 controller t4 worker t5 transaction t6 db t7 response runtime 장에서는 정적인 구조를 실제 시간순서로 펼칩니다. 여기서 request thread와 worker thread, http timeout과 db transaction 수명 같은 차이가 드러납니다. runtime을 봐야 설계가 실제 동작과 맞는지 확인할 수 있습니다. ---"}, {"id": "topic-3-8", "chapter": 3, "page": 8, "title": "7. Top-down과 Bottom-up을 닫는다", "preview": "FIG-03-08. Top-down과 Bottom-up을 닫는다 text Top-down Intent → Design → Rule ↓ Bottom-up Source ← Test ← Runtime Evidence", "column": 3, "html": "<h2>7. Top-down과 Bottom-up을 닫는다<\/h2>\n<h3>FIG-03-08. Top-down과 Bottom-up을 닫는다<\/h3>\n<pre class=\"text-architecture\">Top-down\nIntent → Design → Rule\n          ↓\nBottom-up\nSource ← Test ← Runtime Evidence<\/pre>\n<p>Architecture는 위에서 아래로만 내려가면 문서가 되고, 아래에서 위로만 보면 Source 분석이 됩니다.<\/p>\n<p>둘을 닫아야 Baseline이 됩니다. 상위 Intent가 Rule로 내려가고, Runtime Evidence가 다시 그 Rule을 검증합니다.<\/p>\n<p>이 Closed Loop가 HG90의 전제가 됩니다.<\/p>\n<hr>", "search": "7. top-down과 bottom-up을 닫는다 fig-03-08. top-down과 bottom-up을 닫는다 text top-down intent → design → rule ↓ bottom-up source ← test ← runtime evidence architecture는 위에서 아래로만 내려가면 문서가 되고, 아래에서 위로만 보면 source 분석이 됩니다. 둘을 닫아야 baseline이 됩니다. 상위 intent가 rule로 내려가고, runtime evidence가 다시 그 rule을 검증합니다. 이 closed loop가 hg90의 전제가 됩니다. ---"}, {"id": "topic-3-9", "chapter": 3, "page": 9, "title": "8. Gate로 끝낸다", "preview": "FIG-03-09. Gate로 끝낸다 text G00 Source ↓ G20 Model ↓ G40 Test ↓ G50 Evidence", "column": 3, "html": "<h2>8. Gate로 끝낸다<\/h2>\n<h3>FIG-03-09. Gate로 끝낸다<\/h3>\n<pre class=\"text-architecture\">G00 Source\n ↓\nG20 Model\n ↓\nG40 Test\n ↓\nG50 Evidence\n ↓\nG70 GAP/ADR\n ↓\nHG90<\/pre>\n<p>6단계 그림을 완성했다고 끝나는 것이 아닙니다.<\/p>\n<p>Source/Config Conformance, Runtime Test, GAP/ADR가 닫혀야 공식 Baseline으로 Release할 수 있습니다.<\/p>\n<p>따라서 방법론의 마지막 단계는 항상 Evidence와 Gate입니다.<\/p>\n<hr>", "search": "8. gate로 끝낸다 fig-03-09. gate로 끝낸다 text g00 source ↓ g20 model ↓ g40 test ↓ g50 evidence ↓ g70 gap/adr ↓ hg90 6단계 그림을 완성했다고 끝나는 것이 아닙니다. source/config conformance, runtime test, gap/adr가 닫혀야 공식 baseline으로 release할 수 있습니다. 따라서 방법론의 마지막 단계는 항상 evidence와 gate입니다. ---"}, {"id": "topic-3-10", "chapter": 3, "page": 10, "title": "정상패턴과 금지패턴", "preview": "FIG-03-10. Normal Pattern text Vision→BigPicture→Logical→Physical→Mechanism→Runtime→Evidence 정상패턴은 상위 의도가 하위 설계를 구속하고, 하위 Source/Runtime이 다시 상위 의도를 검증하는 양방향 구조입니다. FIG-03-11. Forbidden Patte…", "column": 3, "html": "<h2>정상패턴과 금지패턴<\/h2>\n<h3>FIG-03-10. Normal Pattern<\/h3>\n<pre class=\"text-architecture\">Vision→BigPicture→Logical→Physical→Mechanism→Runtime→Evidence<\/pre>\n<p>정상패턴은 상위 의도가 하위 설계를 구속하고, 하위 Source/Runtime이 다시 상위 의도를 검증하는 양방향 구조입니다.<\/p>\n<h3>FIG-03-11. Forbidden Pattern<\/h3>\n<pre class=\"text-architecture\">제품→서버→사후합리화<\/pre>\n<p>제품이나 서버를 먼저 정한 뒤 Vision과 Logical Architecture를 사후에 맞추는 방식은 이 방법론의 역순이므로 기본패턴으로 사용하지 않습니다.<\/p>\n<hr>", "search": "정상패턴과 금지패턴 fig-  Rule ↓ Source Evidence ↓ Config Evidence ↓ Runtime / Deployment Evidence", "column": 3, "html": "<h2>Evidence / Conformance — 이 장의 Architecture를 무엇으로 증명하는가<\/h2>\n<h3>Evidence Architecture<\/h3>\n<pre class=\"text-architecture\">아키텍처 6단계 수립 방법론 Architecture Rule\n        ↓\nSource Evidence\n        ↓\nConfig Evidence\n        ↓\nRuntime / Deployment Evidence\n        ↓\nConformance Test\n        ↓\nPASS / GAP / ADR<\/pre>\n<h4>Source Evidence<\/h4>\n<ul><li><code>[SOURCE]<\/code> Architecture 00~18 정의서 및 Gate 체계<\/li><li><code>[SOURCE]<\/code> PDMG Source/Runtime 상세분석<\/li><\/ul>\n<h4>Config Evidence<\/h4>\n<ul><li><code>[CONFIG]<\/code> Architecture Rule / Manifest / Conformance 구조<\/li><\/ul>\n<h4>Runtime / Deployment Evidence<\/h4>\n<ul><li><code>[RUNTIME]<\/code> Top-down 설계와 Bottom-up Evidence 연결<\/li><\/ul>\n<h4>Architecture Decision<\/h4>\n<ul><li><code>[DECISION]<\/code> VISION→BIG PICTURE→LOGICAL→PHYSICAL→MECHANISM→RUNTIME→EVIDENCE<\/li><\/ul>\n<h4>Related ADR<\/h4>\n<ul><li><code>ADR-001 Baseline<\/code><\/li><li><code>ADR-040 Runtime Evidence<\/code><\/li><li><code>HG90 Gate<\/code><\/li><\/ul>\n<h4>Current GAP / OPEN<\/h4>\n<ul><li><code>[GAP/OPEN]<\/code> Architecture Model SSOT<\/li><li><code>[GAP/OPEN]<\/code> G50 Runtime Evidence 자동화<\/li><li><code>[GAP/OPEN]<\/code> HG90 자동 Gate<\/li><\/ul>\n<h3>이 장의 판정<\/h3>\n<pre class=\"text-architecture\">Architecture Definition\n        ↓\nPASS\n\nCurrent PDMG Conformance\n        ↓\nPARTIAL\n\nRuntime Evidence Coverage\n        ↓\nMEDIUM\n\nArchitecture Definition PASS\n        ≠\nCurrent Implementation PASS<\/pre>\n<h4>PASS 전환조건<\/h4>\n<ul><li><code>Architecture Model SSOT<\/code><\/li><li><code>G50 Runtime Evidence 자동화<\/code><\/li><li><code>HG90 Gate 운영<\/code><\/li><\/ul>\n<p>위 조건은 문서 완성도가 아니라 <strong>Current Implementation Conformance를 PASS로 전환하기 위한 Exit Criteria<\/strong>다. 해당 Evidence가 확보되기 전에는 <code>[GAP]<\/code>, <code>[OPEN]<\/code>, <code>[UNKNOWN]<\/code> 상태를 유지한다.<\/p>\n<hr>", "search": "evidence / conformance — 이 장의 architecture를 무엇으로 증명하는가 evidence architecture text 아키텍처 6단계 수립 방법론 architecture rule ↓ source evidence ↓ config evidence ↓ runtime / deployment evidence ↓ conformance test ↓ pass / gap / adr source evidence - [source] architecture 0018 정의서 및 gate 체계 - [source] pdmg source/runtime 상세분석 config evidence - [config] architecture rule / manifest / conformance 구조 runtime / deployment evidence - [runtime] top-down 설계와 bottom-up evidence 연결 architecture decision - [decision] vision→big picture→logical→physical→mechanism→runtime→evidence related adr - adr-001 baseline - adr-040 runtime evidence - hg90 gate current gap / open - [gap/open] architecture model ssot - [gap/open] g50 runtime evidence 자동화 - [gap/open] hg90 자동 gate 이 장의 판정 text architecture definition ↓ pass current pdmg conformance ↓ partial runtime evidence coverage ↓ medium architecture definition pass ≠ current implementation pass pass 전환조건 - architecture model ssot - g50 runtime evidence 자동화 - hg90 gate 운영 위 조건은 문서 완성도가 아니라 current implementation conformance를 pass로 전환하기 위한 exit criteria다. 해당 evidence가 확보되기 전에는 [gap], [open], [unknown] 상태를 유지한다. ---"}, {"id": "topic-3-13", "chapter": 3, "page": 13, "title": "Chapter Closing Script", "preview": "FIG-03-16. 다음 장 Handoff text 아키텍처 6단계 수립 방법론 ↓ 비전에서 시작해 실제 Runtime 검증까지 내려간다 ↓ 남은 질문 \"화려한 박스가 아니라 책임과 경계를 먼저 본다\" ↓", "column": 0, "html": "<h2>Chapter Closing Script<\/h2>\n<h3>FIG-03-16. 다음 장 Handoff<\/h3>\n<pre class=\"text-architecture\">아키텍처 6단계 수립 방법론\n ↓\n비전에서 시작해 실제 Runtime 검증까지 내려간다\n ↓\n남은 질문\n&quot;화려한 박스가 아니라 책임과 경계를 먼저 본다&quot;\n ↓\nBig Picture<\/pre>\n<p>방법론이 정해졌으므로 이제 실제 설계가 시작됩니다. 다음 장 Big Picture에서는 세부기술을 잠시 내려놓고 사용자·인증·업무·데이터·외부연계의 책임과 경계를 한 장으로 고정합니다.<\/p>", "search": "chapter closing script fig-03-16. 다음 장 handoff text 아키텍처 6단계 수립 방법론 ↓ 비전에서 시작해 실제 runtime 검증까지 내려간다 ↓ 남은 질문 \"화려한 박스가 아니라 책임과 경계를 먼저 본다\" ↓ big picture 방법론이 정해졌으므로 이제 실제 설계가 시작됩니다. 다음 장 big picture에서는 세부기술을 잠시 내려놓고 사용자·인증·업무·데이터·외부연계의 책임과 경계를 한 장으로 고정합니다."}, {"id": "topic-4-1", "chapter": 4, "page": 1, "title": "0. Opening Script", "preview": "이제 전체 시스템을 한 장으로 봅니다. 여기서 박스를 많이 넣는 것이 목적이 아닙니다. Big Picture의 역할은 사용자가 어디에서 들어오고, 인증은 어디에서 끝나며, 업무 Runtime과 Data는 어디에서 분리되고, External 연결은 어떤 경계를 통과하는가를 한눈에 보여주는 것입니다. 이 장이 이후 Logical·Physica…", "column": 1, "html": "<h2>0. Opening Script<\/h2>\n<p>이제 전체 시스템을 한 장으로 봅니다. 여기서 박스를 많이 넣는 것이 목적이 아닙니다.<\/p>\n<p>Big Picture의 역할은 <strong>사용자가 어디에서 들어오고, 인증은 어디에서 끝나며, 업무 Runtime과 Data는 어디에서 분리되고, External 연결은 어떤 경계를 통과하는가<\/strong>를 한눈에 보여주는 것입니다.<\/p>\n<p>이 장이 이후 Logical·Physical·Security·Interface 장의 공간적 기준이 됩니다.<\/p>\n<h3>FIG-04-01. 장 전체 Architecture<\/h3>\n<pre class=\"text-architecture\">User / Browser\n      ↓\nUI Delivery\n      ↓\nAuthentication\n      ↓\nApplication Runtime\n      ↓\nData\n\nExternal → Approved Contract\nSecurity / Observability = Cross-cutting<\/pre>\n<p>Big Picture에서는 세부 Class나 서버 이름을 최대한 지웁니다. 대신 사용자가 어디에서 들어오고, 인증은 어디에서 신뢰를 만들며, 업무 Runtime과 Data는 어디에서 갈라지고, External 연결은 어떤 Contract를 통과해야 하는지를 한 장에 고정합니다. 이후 모든 장은 이 경계를 확대하는 작업입니다.<\/p>\n<hr>", "search": "0. opening script 이제 전체 시스템을 한 장으로 봅니다. 여기서 박스를 많이 넣는 것이 목적이 아닙니다. big picture의 역할은 사용자가 어디에서 들어오고, 인증은 어디에서 끝나며, 업무 runtime과 data는 어디에서 분리되고, external 연결은 어떤 경계를 통과하는가를 한눈에 보여주는 것입니다. 이 장이 이후 logical·physical·security·interface 장의 공간적 기준이 됩니다. fig-04-01. 장 전체 architecture text user / browser ↓ ui delivery ↓ authentication ↓ application runtime ↓ data external → approved contract security / observability = cross-cutting big picture에서는 세부 class나 서버 이름을 최대한 지웁니다. 대신 사용자가 어디에서 들어오고, 인증은 어디에서 신뢰를 만들며, 업무 runtime과 data는 어디에서 갈라지고, external 연결은 어떤 contract를 통과해야 하는지를 한 장에 고정합니다. 이후 모든 장은 이 경계를 확대하는 작업입니다. ---"}, {"id": "topic-4-2", "chapter": 4, "page": 2, "title": "1. User와 Channel Boundary", "preview": "FIG-04-02. User와 Channel Boundary text User ↓ Browser / Channel ↓ Access Boundary ↓ pdmg-ui / pdmg-jwt / pdmg-service", "column": 1, "html": "<h2>1. User와 Channel Boundary<\/h2>\n<h3>FIG-04-02. User와 Channel Boundary<\/h3>\n<pre class=\"text-architecture\">User\n ↓\nBrowser / Channel\n ↓\nAccess Boundary\n ↓\npdmg-ui / pdmg-jwt / pdmg-service<\/pre>\n<p>첫 번째 경계는 사용자와 시스템 사이입니다. Browser는 업무를 시작하지만 Business Logic을 소유하지 않습니다.<\/p>\n<p>UI는 화면과 요청조립을 담당하고, Authentication은 신뢰를 만들며, Business Runtime은 거래를 실행합니다. 세 역할을 같은 Application처럼 보이게 하면 변경영향이 커집니다.<\/p>\n<p>그래서 Big Picture에서부터 UI/Auth/Business를 분리합니다.<\/p>\n<hr>", "search": "1. user와 channel boundary fig-04-02. user와 channel boundary text user ↓ browser / channel ↓ access boundary ↓ pdmg-ui / pdmg-jwt / pdmg-service 첫 번째 경계는 사용자와 시스템 사이입니다. browser는 업무를 시작하지만 business logic을 소유하지 않습니다. ui는 화면과 요청조립을 담당하고, authentication은 신뢰를 만들며, business runtime은 거래를 실행합니다. 세 역할을 같은 application처럼 보이게 하면 변경영향이 커집니다. 그래서 big picture에서부터 ui/auth/business를 분리합니다. ---"}, {"id": "topic-4-3", "chapter": 4, "page": 3, "title": "2. UI Delivery Boundary", "preview": "FIG-04-03. UI Delivery Boundary text Browser ↓ pdmg-ui ├─ Screen ├─ Transaction Catalog └─ Request Assembly ↓", "column": 1, "html": "<h2>2. UI Delivery Boundary<\/h2>\n<h3>FIG-04-03. UI Delivery Boundary<\/h3>\n<pre class=\"text-architecture\">Browser\n ↓\npdmg-ui\n ├─ Screen\n ├─ Transaction Catalog\n └─ Request Assembly\n ↓\nBusiness Call<\/pre>\n<p><code>pdmg-ui<\/code>는 Presentation 영역입니다. 화면, 정적자원, Transaction Catalog, Request Assembly를 담당합니다.<\/p>\n<p>여기서 중요한 금지사항은 UI가 DAO나 DB를 직접 보는 것입니다. UI가 Business/Data Boundary를 넘으면 Layering과 Security가 동시에 무너집니다.<\/p>\n<p>따라서 UI의 마지막 책임은 표준 Request를 만들어 Application Runtime으로 전달하는 데 있습니다.<\/p>\n<hr>", "search": "2. ui delivery boundary fig-04-03. ui delivery boundary text browser ↓ pdmg-ui ├─ screen ├─ transaction catalog └─ request assembly ↓ business call pdmg-ui는 presentation 영역입니다. 화면, 정적자원, transaction catalog, request assembly를 담당합니다. 여기서 중요한 금지사항은 ui가 dao나 db를 직접 보는 것입니다. ui가 business/data boundary를 넘으면 layering과 security가 동시에 무너집니다. 따라서 ui의 마지막 책임은 표준 request를 만들어 application runtime으로 전달하는 데 있습니다. ---"}, {"id": "topic-4-4", "chapter": 4, "page": 4, "title": "3. Authentication Boundary", "preview": "FIG-04-04. Authentication Boundary text Login / SSO ↓ pdmg-jwt ↓ Access / Refresh Token ↓ Verification", "column": 1, "html": "<h2>3. Authentication Boundary<\/h2>\n<h3>FIG-04-04. Authentication Boundary<\/h3>\n<pre class=\"text-architecture\">Login / SSO\n ↓\npdmg-jwt\n ↓\nAccess / Refresh Token\n ↓\nVerification\n ↓\nTrusted Principal<\/pre>\n<p>Authentication은 별도의 Trust Boundary입니다. 로그인이나 SSO를 통과한 결과는 Token이지만, 업무 Runtime에서 다시 검증되어야 합니다.<\/p>\n<p>현재 RS256 Issue와 HMAC Verify Path의 불일치는 이 Boundary가 완전히 닫히지 않았음을 의미합니다.<\/p>\n<p>또한 Authentication과 Authorization은 다르므로 Trusted Principal이 Business User Context로 어떻게 연결되는지도 별도로 검증해야 합니다.<\/p>\n<hr>", "search": "3. authentication boundary fig-04-04. authentication boundary text login / sso ↓ pdmg-jwt ↓ access / refresh token ↓ verification ↓ trusted principal authentication은 별도의 trust boundary입니다. 로그인이나 sso를 통과한 결과는 token이지만, 업무 runtime에서 다시 검증되어야 합니다. 현재 rs256 issue와 hmac verify path의 불일치는 이 boundary가 완전히 닫히지 않았음을 의미합니다. 또한 authentication과 authorization은 다르므로 trusted principal이 business user context로 어떻게 연결되는지도 별도로 검증해야 합니다. ---"}, {"id": "topic-4-5", "chapter": 4, "page": 5, "title": "4. Application Runtime Boundary", "preview": "FIG-04-05. Application Runtime Boundary text pdmg-service ┌──────────────────────────┐ │ pdmg-fw Runtime Control │ │ │ │ Handler / Facade │ │ Service / DAO │ └────────────┬─────────────┘", "column": 1, "html": "<h2>4. Application Runtime Boundary<\/h2>\n<h3>FIG-04-05. Application Runtime Boundary<\/h3>\n<pre class=\"text-architecture\">pdmg-service\n┌──────────────────────────┐\n│ pdmg-fw Runtime Control  │\n│                          │\n│ Handler / Facade         │\n│ Service / DAO            │\n└────────────┬─────────────┘\n             ↓\n           Data<\/pre>\n<p>PDMG의 중심 실행영역은 <code>pdmg-service<\/code>입니다. 이 안에서 <code>pdmg-fw<\/code> Framework Bean과 Business Bean이 협력할 수 있습니다.<\/p>\n<p>따라서 <code>pdmg-fw<\/code>를 Remote Server로 그리는 것은 현재 Evidence와 맞지 않습니다. Build Module과 Runtime Boundary는 다릅니다.<\/p>\n<p>이 Boundary 안에서 Framework는 실행정책을, Business는 Use Case를 담당합니다.<\/p>\n<hr>", "search": "4. application runtime boundary fig-04-05. application runtime boundary text pdmg-service ┌──────────────────────────┐ │ pdmg-fw runtime control │ │ │ │ handler / facade │ │ service / dao │ └────────────┬─────────────┘ ↓ data pdmg의 중심 실행영역은 pdmg-service입니다. 이 안에서 pdmg-fw framework bean과 business bean이 협력할 수 있습니다. 따라서 pdmg-fw를 remote server로 그리는 것은 현재 evidence와 맞지 않습니다. build module과 runtime boundary는 다릅니다. 이 boundary 안에서 framework는 실행정책을, business는 use case를 담당합니다. ---"}, {"id": "topic-4-6", "chapter": 4, "page": 6, "title": "5. Data Boundary", "preview": "FIG-04-06. Data Boundary text Business ↓ DAO / Mapper ↓ JDBC ↓ RDW / DB", "column": 1, "html": "<h2>5. Data Boundary<\/h2>\n<h3>FIG-04-06. Data Boundary<\/h3>\n<pre class=\"text-architecture\">Business\n ↓\nDAO / Mapper\n ↓\nJDBC\n ↓\nRDW / DB\n\nExternal Data\n ↓\nApproved Contract<\/pre>\n<p>Data Boundary에서는 내부 Data Access와 외부 시스템 Data를 분리합니다.<\/p>\n<p>PDMG Current에서 DAO→Mapper→JDBC→RDW/DB는 비교적 강한 Evidence가 있습니다. 반면 ADW 사용이나 Cross-system Data Access는 Inventory를 통해 확인해야 합니다.<\/p>\n<p>External System의 DB에 직접 DML하는 구조는 기본 정상패턴으로 보지 않습니다.<\/p>\n<hr>", "search": "5. data boundary fig-04-06. data boundary text business ↓ dao / mapper ↓ jdbc ↓ rdw / db external data ↓ approved contract data boundary에서는 내부 data access와 외부 시스템 data를 분리합니다. pdmg current에서 dao→mapper→jdbc→rdw/db는 비교적 강한 evidence가 있습니다. 반면 adw 사용이나 cross-system data access는 inventory를 통해 확인해야 합니다. external system의 db에 직접 dml하는 구조는 기본 정상패턴으로 보지 않습니다. ---"}, {"id": "topic-4-7", "chapter": 4, "page": 7, "title": "6. External Integration Boundary", "preview": "FIG-04-07. External Integration Boundary text PDMG ↓ Interface Contract ├─ API ├─ Event ├─ File └─ Data Movement", "column": 1, "html": "<h2>6. External Integration Boundary<\/h2>\n<h3>FIG-04-07. External Integration Boundary<\/h3>\n<pre class=\"text-architecture\">PDMG\n ↓\nInterface Contract\n ├─ API\n ├─ Event\n ├─ File\n └─ Data Movement\n ↓\nExternal System<\/pre>\n<p>외부 연결은 선 하나가 아니라 Contract입니다. Source/Target, Schema, Security, Timeout, Retry, Version, Operations가 함께 있어야 합니다.<\/p>\n<p>PDMG Current에서 어떤 Interface가 실제 존재하는지는 전수 Inventory가 필요합니다. Kafka/CDC/ETL이 NSIGHT Target에 있다는 이유로 PDMG Current Component로 넣지 않습니다.<\/p>\n<p>이 구분이 6장 Interface Architecture와 10장 Data Platform으로 이어집니다.<\/p>\n<hr>", "search": "6. external integration boundary fig-04-07. external integration boundary text pdmg ↓ interface contract ├─ api ├─ event ├─ file └─ data movement ↓ external system 외부 연결은 선 하나가 아니라 contract입니다. source/target, schema, security, timeout, retry, version, operations가 함께 있어야 합니다. pdmg current에서 어떤 interface가 실제 존재하는지는 전수 inventory가 필요합니다. kafka/cdc/etl이 nsight target에 있다는 이유로 pdmg current component로 넣지 않습니다. 이 구분이 6장 interface architecture와 10장 data platform으로 이어집니다. ---"}, {"id": "topic-4-8", "chapter": 4, "page": 8, "title": "7. Security와 Observability는 Cross-cutting이다", "preview": "FIG-04-08. Security와 Observability는 Cross-cutting이다 text Security ↓ all boundaries GUID / ServiceId ↓ Runtime ↓", "column": 2, "html": "<h2>7. Security와 Observability는 Cross-cutting이다<\/h2>\n<h3>FIG-04-08. Security와 Observability는 Cross-cutting이다<\/h3>\n<pre class=\"text-architecture\">Security\n ↓ all boundaries\n\nGUID / ServiceId\n ↓\nRuntime\n ↓\nMetric / Log / Trace\n ↓\nOperations<\/pre>\n<p>Security와 Observability는 한쪽 구석의 박스가 아닙니다. 모든 Boundary를 가로지릅니다.<\/p>\n<p>Security는 요청이 이동할 때마다 Trust를 유지해야 하고, Observability는 ServiceId/GUID를 기준으로 같은 거래를 끝까지 추적해야 합니다.<\/p>\n<p>그래서 Big Picture에서부터 Cross-cutting으로 표시합니다.<\/p>\n<hr>", "search": "7. security와 observability는 cross-cutting이다 fig-04-08. security와 observability는 cross-cutting이다 text security ↓ all boundaries guid / serviceid ↓ runtime ↓ metric / log / trace ↓ operations security와 observability는 한쪽 구석의 박스가 아닙니다. 모든 boundary를 가로지릅니다. security는 요청이 이동할 때마다 trust를 유지해야 하고, observability는 serviceid/guid를 기준으로 같은 거래를 끝까지 추적해야 합니다. 그래서 big picture에서부터 cross-cutting으로 표시합니다. ---"}, {"id": "topic-4-9", "chapter": 4, "page": 9, "title": "8. Big Picture에서 보이는 GAP", "preview": "FIG-04-09. Big Picture에서 보이는 GAP text CRITICAL JWT / Identity HIGH Interface Inventory Deployment Mapping", "column": 2, "html": "<h2>8. Big Picture에서 보이는 GAP<\/h2>\n<h3>FIG-04-09. Big Picture에서 보이는 GAP<\/h3>\n<pre class=\"text-architecture\">CRITICAL\nJWT / Identity\n\nHIGH\nInterface Inventory\nDeployment Mapping\n\nOPEN\npdmg-om\nADW current mapping<\/pre>\n<p>Big Picture는 세부내용을 숨기지만 GAP는 숨기지 않습니다.<\/p>\n<p>현재 가장 중요한 것은 Security, External Interface Inventory, Deployment Mapping, pdmg-om Scope입니다. 이 항목들이 뒤 장에서 구체화됩니다.<\/p>\n<p>Big Picture의 역할은 문제가 어디에 있는지 공간적으로 먼저 보여주는 것입니다.<\/p>\n<hr>", "search": "8. big picture에서 보이는 gap fig-04-09. big picture에서 보이는 gap text critical jwt / identity high interface inventory deployment mapping open pdmg-om adw current mapping big picture는 세부내용을 숨기지만 gap는 숨기지 않습니다. 현재 가장 중요한 것은 security, external interface inventory, deployment mapping, pdmg-om scope입니다. 이 항목들이 뒤 장에서 구체화됩니다. big picture의 역할은 문제가 어디에 있는지 공간적으로 먼저 보여주는 것입니다. ---"}, {"id": "topic-4-10", "chapter": 4, "page": 10, "title": "정상패턴과 금지패턴", "preview": "FIG-04-10. Normal Pattern text User→UI/Auth→Runtime→Data / External→Contract 정상패턴은 UI·Authentication·Business·Data의 책임을 분리하고 External 연결을 Contract를 통해 통제하는 것입니다. FIG-04-11. Forbidden Pattern", "column": 3, "html": "<h2>정상패턴과 금지패턴<\/h2>\n<h3>FIG-04-10. Normal Pattern<\/h3>\n<pre class=\"text-architecture\">User→UI/Auth→Runtime→Data / External→Contract<\/pre>\n<p>정상패턴은 UI·Authentication·Business·Data의 책임을 분리하고 External 연결을 Contract를 통해 통제하는 것입니다.<\/p>\n<h3>FIG-04-11. Forbidden Pattern<\/h3>\n<pre class=\"text-architecture\">Browser→DB / External→Direct DML<\/pre>\n<p>Browser→DB, UI→DAO, External→PDMG DB DML처럼 책임경계를 뛰어넘는 연결은 Architecture 기본패턴으로 허용하지 않습니다.<\/p>\n<hr>", "search": "정상패턴과 금지패턴 fig-04-10. normal pattern text user→ui/auth→runtime→data -service → Business Runtime pdmg-fw → Runtime Control DB → Data Service", "column": 1, "html": "<h2>1. Application에서 Capability로<\/h2>\n<h3>FIG-05-02. Application에서 Capability로<\/h3>\n<pre class=\"text-architecture\">pdmg-ui      → UI Delivery\npdmg-jwt     → Authentication\npdmg-service → Business Runtime\npdmg-fw      → Runtime Control\nDB           → Data Service<\/pre>\n<p>Application 이름을 바로 Physical Server로 내리지 않고 먼저 Capability로 번역합니다.<\/p>\n<p>이렇게 하면 현재 제품을 바꾸더라도 Architecture의 책임은 유지할 수 있습니다.<\/p>\n<p>Capability가 Logical Node를 만드는 재료가 됩니다.<\/p>\n<hr>", "search": "1. application에서 capability로 fig-05-02. application에서 capability로 text pdmg-ui → ui delivery pdmg-jwt → authentication pdmg-service → business runtime pdmg-fw → runtime control db → data service application 이름을 바로 physical server로 내리지 않고 먼저 capability로 번역합니다. 이렇게 하면 현재 제품을 바꾸더라도 architecture의 책임은 유지할 수 있습니다. capability가 logical node를 만드는 재료가 됩니다. ---"}, {"id": "topic-5-3", "chapter": 5, "page": 3, "title": "2. Logical Node Catalog", "preview": "FIG-05-03. Logical Node Catalog text LTN-PD-01 UI Delivery LTN-PD-02 Authentication LTN-PD-03 Application Runtime LTN-PD-04 Data Service LTN-PD-05 Integration [CONDITIONAL] LTN-PD-06 Operati…", "column": 1, "html": "<h2>2. Logical Node Catalog<\/h2>\n<h3>FIG-05-03. Logical Node Catalog<\/h3>\n<pre class=\"text-architecture\">LTN-PD-01 UI Delivery\nLTN-PD-02 Authentication\nLTN-PD-03 Application Runtime\nLTN-PD-04 Data Service\nLTN-PD-05 Integration [CONDITIONAL]\nLTN-PD-06 Operations [OPEN]<\/pre>\n<p>Logical Node는 실행책임과 Failure Domain을 표현하는 논리 단위입니다.<\/p>\n<p>PDMG Current Evidence가 강한 UI/Auth/App/Data Node와 달리 Integration/Operations는 Current 범위가 완전히 확인되지 않았으므로 조건부/OPEN으로 둡니다.<\/p>\n<p>Unknown을 Target으로 채우지 않는 것이 중요합니다.<\/p>\n<hr>", "search": "2. logical node catalog fig-05-03. logical node catalog text ltn-pd-01 ui delivery ltn-pd-02 authentication ltn-pd-03 application runtime ltn-pd-04 data service ltn-pd-05 integration [conditional] ltn-pd-06 operations [open] logical node는 실행책임과 failure domain을 표현하는 논리 단위입니다. pdmg current evidence가 강한 ui/auth/app/data node와 달리 integration/operations는 current 범위가 완전히 확인되지 않았으므로 조건부/open으로 둡니다. unknown을 target으로 채우지 않는 것이 중요합니다. ---"}, {"id": "topic-5-4", "chapter": 5, "page": 4, "title": "3. Application Runtime Node 내부", "preview": "FIG-05-04. Application Runtime Node 내부 text Application Runtime ├─ Framework Runtime │ ├─ Filter / Context │ ├─ Security │ ├─ TCF │ ├─ Worker / Timeout │ └─ Transaction / Error", "column": 2, "html": "<h2>3. Application Runtime Node 내부<\/h2>\n<h3>FIG-05-04. Application Runtime Node 내부<\/h3>\n<pre class=\"text-architecture\">Application Runtime\n├─ Framework Runtime\n│  ├─ Filter / Context\n│  ├─ Security\n│  ├─ TCF\n│  ├─ Worker / Timeout\n│  └─ Transaction / Error\n└─ Business Runtime\n   ├─ Handler / Controller\n   ├─ Facade\n   ├─ Service\n   └─ DAO<\/pre>\n<p>Application Runtime Node는 다시 Framework와 Business로 나뉩니다.<\/p>\n<p>Framework는 실행방법을, Business는 업무내용을 책임집니다. 이 분리를 지키면 TCF ON/OFF가 바뀌어도 Business Core를 동일하게 유지할 수 있습니다.<\/p>\n<p>이 구조가 8장 Mechanism의 논리적 기반입니다.<\/p>\n<hr>", "search": "3. application runtime node 내부 fig-05-04. application runtime node 내부 text application runtime ├─ framework runtime │ ├─ filter / context │ ├─ security │ ├─ tcf │ ├─ worker / timeout │ └─ transaction / error └─ business runtime ├─ handler / controller ├─ facade ├─ service └─ dao application runtime node는 다시 framework와 business로 나뉩니다. framework는 실행방법을, business는 업무내용을 책임집니다. 이 분리를 지키면 tcf on/off가 바뀌어도 business core를 동일하게 유지할 수 있습니다. 이 구조가 8장 mechanism의 논리적 기반입니다. ---"}, {"id": "topic-5-5", "chapter": 5, "page": 5, "title": "4. State Model", "preview": "FIG-05-05. State Model text UI Delivery mostly stateless Authentication key / refresh state Application Runtime request/context/TX state Data Service persistent state Scale 전략을 정하려면 먼저 State…", "column": 1, "html": "<h2>4. State Model<\/h2>\n<h3>FIG-05-05. State Model<\/h3>\n<pre class=\"text-architecture\">UI Delivery       mostly stateless\nAuthentication      key / refresh state\nApplication Runtime request/context/TX state\nData Service        persistent state<\/pre>\n<p>Scale 전략을 정하려면 먼저 State를 알아야 합니다.<\/p>\n<p>Stateless에 가까운 Node는 수평확장이 쉽지만, Session·Key·Transaction State를 가진 Node는 동기화와 Failover 전략이 필요합니다.<\/p>\n<p>Logical 장에서 State를 먼저 정의해야 Physical HA가 설계됩니다.<\/p>\n<hr>", "search": "4. state model fig-05-05. state model text ui delivery mostly stateless authentication key / refresh state application runtime request/context/tx state data service persistent state scale 전략을 정하려면 먼저 state를 알아야 합니다. stateless에 가까운 node는 수평확장이 쉽지만, session·key·transaction state를 가진 node는 동기화와 failover 전략이 필요합니다. logical 장에서 state를 먼저 정의해야 physical ha가 설계됩니다. ---"}, {"id": "topic-5-6", "chapter": 5, "page": 6, "title": "5. Scale Unit", "preview": "FIG-05-06. Scale Unit text UI → delivery instance Auth → auth instance App → JVM/runtime instance DB → DB service/node 모든 Node가 같은 단위로 Scale하는 것은 아닙니다.", "column": 2, "html": "<h2>5. Scale Unit<\/h2>\n<h3>FIG-05-06. Scale Unit<\/h3>\n<pre class=\"text-architecture\">UI  → delivery instance\nAuth → auth instance\nApp  → JVM/runtime instance\nDB   → DB service/node<\/pre>\n<p>모든 Node가 같은 단위로 Scale하는 것은 아닙니다.<\/p>\n<p>Application Runtime은 JVM Instance가 Scale Unit이 될 수 있고, DB는 DB Service/Node 단위로 봐야 합니다.<\/p>\n<p>이 차이를 무시하면 Thread 수와 Server 수를 같은 Capacity 문제로 보게 됩니다.<\/p>\n<hr>", "search": "5. scale unit fig-05-06. scale unit text ui → delivery instance auth → auth instance app → jvm/runtime instance db → db service/node 모든 node가 같은 단위로 scale하는 것은 아닙니다. application runtime은 jvm instance가 scale unit이 될 수 있고, db는 db service/node 단위로 봐야 합니다. 이 차이를 무시하면 thread 수와 server 수를 같은 capacity 문제로 보게 됩니다. ---"}, {"id": "topic-5-7", "chapter": 5, "page": 7, "title": "6. Failure Domain", "preview": "FIG-05-07. Failure Domain text UI Failure → access impact Auth Failure → login/token impact App Failure → transaction impact DB Failure → data impact Failure Domain은 장애가 어디까지 번지는지를 정의합니다.", "column": 2, "html": "<h2>6. Failure Domain<\/h2>\n<h3>FIG-05-07. Failure Domain<\/h3>\n<pre class=\"text-architecture\">UI Failure   → access impact\nAuth Failure → login/token impact\nApp Failure  → transaction impact\nDB Failure   → data impact<\/pre>\n<p>Failure Domain은 장애가 어디까지 번지는지를 정의합니다.<\/p>\n<p>Node를 나누는 이유는 단순한 모듈화가 아니라 장애격리입니다. Authentication 장애와 Business Runtime 장애가 동일한 Failure Domain일 필요는 없습니다.<\/p>\n<p>Physical 장에서 이 Domain을 실제 JVM/VM에 매핑합니다.<\/p>\n<hr>", "search": "6. failure domain fig-05-07. failure domain text ui failure → access impact auth failure → login/token impact app failure → transaction impact db failure → data impact failure domain은 장애가 어디까지 번지는지를 정의합니다. node를 나누는 이유는 단순한 모듈화가 아니라 장애격리입니다. authentication 장애와 business runtime 장애가 동일한 failure domain일 필요는 없습니다. physical 장에서 이 domain을 실제 jvm/vm에 매핑합니다. ---"}, {"id": "topic-5-8", "chapter": 5, "page": 8, "title": "7. Security Boundary", "preview": "FIG-05-08. Security Boundary text Untrusted ↓ Authentication ↓ Application Runtime ↓ Business Authorization", "column": 1, "html": "<h2>7. Security Boundary<\/h2>\n<h3>FIG-05-08. Security Boundary<\/h3>\n<pre class=\"text-architecture\">Untrusted\n ↓\nAuthentication\n ↓\nApplication Runtime\n ↓\nBusiness Authorization\n ↓\nData<\/pre>\n<p>Logical Security는 방화벽보다 먼저 Trust 흐름을 정의합니다.<\/p>\n<p>사용자 입력은 Untrusted에서 시작하고, Authentication을 통해 Principal을 만들고, Business Authorization과 Data Authorization을 별도로 적용해야 합니다.<\/p>\n<p>이 논리경계를 실제 Security Filter/JWT/DB 권한으로 구현하는 것은 이후 Mechanism/Runtime 장의 책임입니다.<\/p>\n<hr>", "search": "7. security boundary fig-05-08. security boundary text untrusted ↓ authentication ↓ application runtime ↓ business authorization ↓ data logical security는 방화벽보다 먼저 trust 흐름을 정의합니다. 사용자 입력은 untrusted에서 시작하고, authentication을 통해 principal을 만들고, business authorization과 data authorization을 별도로 적용해야 합니다. 이 논리경계를 실제 security filter/jwt/db 권한으로 구현하는 것은 이후 mechanism/runtime 장의 책임입니다. ---"}, {"id": "topic-5-9", "chapter": 5, "page": 9, "t
