itle": "8. Logical→Physical Handoff", "preview": "FIG-05-09. Logical→Physical Handoff text Logical Node ↓ State / Scale / Failure ↓ Availability Requirement ↓ VM / JVM / WAR Mapping", "column": 2, "html": "<h2>8. Logical→Physical Handoff<\/h2>\n<h3>FIG-05-09. Logical→Physical Handoff<\/h3>\n<pre class=\"text-architecture\">Logical Node\n ↓\nState / Scale / Failure\n ↓\nAvailability Requirement\n ↓\nVM / JVM / WAR Mapping<\/pre>\n<p>논리 아키텍처의 마지막 질문은 '이 Node를 실제 어디에 배치할 것인가'입니다.<\/p>\n<p>Physical 장은 Logical Node의 속성을 받아 실제 VM/JVM/WAR를 결정합니다.<\/p>\n<p>즉 Logical이 없다면 Physical은 서버 배치표가 되고, Logical이 있으면 Physical은 설계의 구현이 됩니다.<\/p>\n<hr>", "search": "8. logical→physical handoff fig-05-09. logical→physical handoff text logical node ↓ state / scale / failure ↓ availability requirement ↓ vm / jvm / war mapping 논리 아키텍처의 마지막 질문은 '이 node를 실제 어디에 배치할 것인가'입니다. physical 장은 logical node의 속성을 받아 실제 vm/jvm/war를 결정합니다. 즉 logical이 없다면 physical은 서버 배치표가 되고, logical이 있으면 physical은 설계의 구현이 됩니다. ---"}, {"id": "topic-5-10", "chapter": 5, "page": 10, "title": "정상패턴과 금지패턴", "preview": "FIG-05-10. Normal Pattern text Application→Capability→Logical Node→Physical 정상패턴은 Application 책임을 Logical Node로 변환한 뒤 State·Scale·Failure 특성을 정의하고 Physical 설계로 넘기는 것입니다. FIG-05-11. Forbidden…", "column": 1, "html": "<h2>정상패턴과 금지패턴<\/h2>\n<h3>FIG-05-10. Normal Pattern<\/h3>\n<pre class=\"text-architecture\">Application→Capability→Logical Node→Physical<\/pre>\n<p>정상패턴은 Application 책임을 Logical Node로 변환한 뒤 State·Scale·Failure 특성을 정의하고 Physical 설계로 넘기는 것입니다.<\/p>\n<h3>FIG-05-11. Forbidden Pattern<\/h3>\n<pre class=\"text-architecture\">Logical Node=Product / Module=Server<\/pre>\n<p>Logical Node를 제품명이나 Build Module과 동일시하면 State와 Failure Domain을 표현할 수 없으므로 금지합니다.<\/p>\n<hr>", "search": "정상패턴과 금지패턴 fig-05-10. normal pattern text application→capability→logical node→physical 정상패턴은 application 책임을 logical node로 변환한 뒤 state·scale·failure 특성을 정의하고 physical 설계로 넘기는 것입니다. fig-05-11. forbidden pattern text logical node=product / module=server logical node를 제품명이나 build module과 동일시하면 state와 failure domain을 표현할 수 없으므로 금지합니다. ---"}, {"id": "topic-5-11", "chapter": 5, "page": 11, "title": "Architecture Decision", "preview": "FIG-05-12. 주안과 대안 text [주안] Logical Node 먼저 정의 VS [대안] 제품/서버부터 정의", "column": 1, "html": "<h2>Architecture Decision<\/h2>\n<h3>FIG-05-12. 주안과 대안<\/h3>\n<pre class=\"text-architecture\">[주안]\nLogical Node 먼저 정의\n\n        VS\n\n[대안]\n제품/서버부터 정의<\/pre>\n<p>Logical Node를 제품보다 먼저 정의합니다. State·Scale·Failure·Security 속성을 기술한 뒤 제품과 Physical Resource를 선택해야 기술변경에도 Architecture Intent가 유지됩니다.<\/p>\n<p>제품/서버부터 정의하면 현재 기술에 설계가 고정되고 Capability와 Failure Domain이 제품명 뒤에 숨게 됩니다.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>평가축<\/th><th>주안<\/th><th>대안<\/th><\/tr><\/thead><tbody><tr><td>책임/경계<\/td><td>명확<\/td><td>추가 보완 필요<\/td><\/tr><tr><td>Current PDMG 정합<\/td><td>높음<\/td><td>변경범위 가능<\/td><\/tr><tr><td>운영/장애분석<\/td><td>Trace 용이<\/td><td>복잡도 증가 가능<\/td><\/tr><tr><td>승인조건<\/td><td>기본 Rule/Test<\/td><td>별도 ADR + Evidence<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>", "search": "architecture decision fig-05-12. 주안과 대안 text [주안] logical node 먼저 정의 vs [대안] 제품/서버부터 정의 logical node를 제품보다 먼저 정의합니다. state·scale·failure·security 속성을 기술한 뒤 제품과 physical resource를 선택해야 기술변경에도 architecture intent가 유지됩니다. 제품/서버부터 정의하면 현재 기술에 설계가 고정되고 capability와 failure domain이 제품명 뒤에 숨게 됩니다. | 평가축 | 주안 | 대안 | |---|---|---| | 책임/경계 | 명확 | 추가 보완 필요 | | current pdmg 정합 | 높음 | 변경범위 가능 | | 운영/장애분석 | trace 용이 | 복잡도 증가 가능 | | 승인조건 | 기본 rule/test | 별도 adr + evidence | ---"}, {"id": "topic-5-12", "chapter": 5, "page": 12, "title": "Evidence / Conformance — 이 장의 Architecture를 무엇으로 증명하는가", "preview": "Evidence Architecture text 논리 아키텍처 Architecture Rule ↓ Source Evidence ↓ Config Evidence ↓ Runtime / Deployment Evidence", "column": 2, "html": "<h2>Evidence / Conformance — 이 장의 Architecture를 무엇으로 증명하는가<\/h2>\n<h3>Evidence Architecture<\/h3>\n<pre class=\"text-architecture\">논리 아키텍처 Architecture Rule\n        ↓\nSource Evidence\n        ↓\nConfig Evidence\n        ↓\nRuntime / Deployment Evidence\n        ↓\nConformance Test\n        ↓\nPASS / GAP / ADR<\/pre>\n<h4>Source Evidence<\/h4>\n<ul><li><code>[SOURCE]<\/code> Application/Module 상세정의<\/li><li><code>[SOURCE]<\/code> Technical Architecture Definition<\/li><li><code>[SOURCE]<\/code> PDMG Logical 상세정의<\/li><\/ul>\n<h4>Config Evidence<\/h4>\n<ul><li><code>[CONFIG]<\/code> Runtime State/Scale/Failure 속성은 Config/Deployment와 연결 필요<\/li><\/ul>\n<h4>Runtime / Deployment Evidence<\/h4>\n<ul><li><code>[RUNTIME]<\/code> UI/Auth/Application/Data Logical Node 분리<\/li><\/ul>\n<h4>Architecture Decision<\/h4>\n<ul><li><code>[DECISION]<\/code> Logical Node를 Product보다 먼저 정의<\/li><\/ul>\n<h4>Related ADR<\/h4>\n<ul><li><code>ADR-004 Common Facade<\/code><\/li><li><code>ADR-028 JVM Isolation<\/code><\/li><li><code>ADR-029 Capacity Budget<\/code><\/li><\/ul>\n<h4>Current GAP / OPEN<\/h4>\n<ul><li><code>[GAP/OPEN]<\/code> Integration Node Current Scope<\/li><li><code>[GAP/OPEN]<\/code> Operations Node Current Scope<\/li><li><code>[GAP/OPEN]<\/code> State/Scale Evidence<\/li><li><code>[GAP/OPEN]<\/code> Logical→Physical Mapping<\/li><\/ul>\n<h3>이 장의 판정<\/h3>\n<pre class=\"text-architecture\">Architecture Definition\n        ↓\nPASS\n\nCurrent PDMG Conformance\n        ↓\nCONDITIONAL / PARTIAL\n\nRuntime Evidence Coverage\n        ↓\nMEDIUM\n\nArchitecture Definition PASS\n        ≠\nCurrent Implementation PASS<\/pre>\n<h4>PASS 전환조건<\/h4>\n<ul><li><code>Logical Node→Physical Mapping<\/code><\/li><li><code>Integration/Operations Node Evidence<\/code><\/li><li><code>State/Scale 검증<\/code><\/li><\/ul>\n<p>위 조건은 문서 완성도가 아니라 <strong>Current Implementation Conformance를 PASS로 전환하기 위한 Exit Criteria<\/strong>다. 해당 Evidence가 확보되기 전에는 <code>[GAP]<\/code>, <code>[OPEN]<\/code>, <code>[UNKNOWN]<\/code> 상태를 유지한다.<\/p>\n<hr>", "search": "evidence / conformance — 이 장의 architecture를 무엇으로 증명하는가 evidence architecture text 논리 아키텍처 architecture rule ↓ source evidence ↓ config evidence ↓ runtime / deployment evidence ↓ conformance test ↓ pass / gap / adr source evidence - [source] application/module 상세정의 - [source] technical architecture definition - [source] pdmg logical 상세정의 config evidence - [config] runtime state/scale/failure 속성은 config/deployment와 연결 필요 runtime / deployment evidence - [runtime] ui/auth/application/data logical node 분리 architecture decision - [decision] logical node를 product보다 먼저 정의 related adr - adr-004 common facade - adr-028 jvm isolation - adr-029 capacity budget current gap / open - [gap/open] integration node current scope - [gap/open] operations node current scope - [gap/open] state/scale evidence - [gap/open] logical→physical mapping 이 장의 판정 text architecture definition ↓ pass current pdmg conformance ↓ conditional / partial runtime evidence coverage ↓ medium architecture definition pass ≠ current implementation pass pass 전환조건 - logical node→physical mapping - integration/operations node evidence - state/scale 검증 위 조건은 문서 완성도가 아니라 current implementation conformance를 pass로 전환하기 위한 exit criteria다. 해당 evidence가 확보되기 전에는 [gap], [open], [unknown] 상태를 유지한다. ---"}, {"id": "topic-5-13", "chapter": 5, "page": 13, "title": "Chapter Closing Script", "preview": "FIG-05-16. 다음 장 Handoff text 논리 아키텍처 ↓ 기술을 고르기 전에 무엇을 분리하고 허용할지 정한다 ↓ 남은 질문 \"속도와 안정성을 실제 Center·VM·JVM·DB 구조로 구현한다\" ↓", "column": 1, "html": "<h2>Chapter Closing Script<\/h2>\n<h3>FIG-05-16. 다음 장 Handoff<\/h3>\n<pre class=\"text-architecture\">논리 아키텍처\n ↓\n기술을 고르기 전에 무엇을 분리하고 허용할지 정한다\n ↓\n남은 질문\n&quot;속도와 안정성을 실제 Center·VM·JVM·DB 구조로 구현한다&quot;\n ↓\n물리 아키텍처<\/pre>\n<p>논리적으로 무엇을 분리할지 정했으므로 다음 질문은 실제 어디에서 실행할 것인가입니다. 6장에서는 Logical Node를 Center·VM·JVM·WAR·DB로 투영합니다.<\/p>", "search": "chapter closing script fig-05-16. 다음 장 handoff text 논리 아키텍처 ↓ 기술을 고르기 전에 무엇을 분리하고 허용할지 정한다 ↓ 남은 질문 \"속도와 안정성을 실제 center·vm·jvm·db 구조로 구현한다\" ↓ 물리 아키텍처 논리적으로 무엇을 분리할지 정했으므로 다음 질문은 실제 어디에서 실행할 것인가입니다. 6장에서는 logical node를 center·vm·jvm·war·db로 투영합니다."}, {"id": "topic-6-1", "chapter": 6, "page": 1, "title": "0. Opening Script", "preview": "논리적으로 무엇을 분리할지 정했다면 이제 실제 어디에서 실행할지 결정합니다. 물리 아키텍처의 핵심은 서버 수가 아닙니다. Logical Node를 어떤 Center, VM, JVM, WAR에 배치하고, Network와 DB를 어디서 끊어 장애를 격리할 것인가가 핵심입니다. FIG-06-01. 장 전체 Architecture text Use…", "column": 2, "html": "<h2>0. Opening Script<\/h2>\n<p>논리적으로 무엇을 분리할지 정했다면 이제 실제 어디에서 실행할지 결정합니다.<\/p>\n<p>물리 아키텍처의 핵심은 서버 수가 아닙니다. <strong>Logical Node를 어떤 Center, VM, JVM, WAR에 배치하고, Network와 DB를 어디서 끊어 장애를 격리할 것인가<\/strong>가 핵심입니다.<\/p>\n<h3>FIG-06-01. 장 전체 Architecture<\/h3>\n<pre class=\"text-architecture\">User\n ↓\nGSLB\n ↓\nL4\n ↓\nWEB / Apache\n ↓\nWAS / Tomcat JVM\n ↓\nPDMG WAR\n ↓\nHikari / MyBatis / JDBC\n ↓\nRDW / DB<\/pre>\n<p>물리 아키텍처에서는 Logical Node를 실제 Center·VM·JVM·WAR·DB로 내립니다. 여기서 가장 중요한 원칙은 <strong>Server, VM, JVM, WAR가 서로 다른 단위<\/strong>라는 점입니다. 이 구분이 명확해야 배포, 용량, 장애격리, DR을 같은 모델에서 설명할 수 있습니다.<\/p>\n<hr>", "search": "0. opening script 논리적으로 무엇을 분리할지 정했다면 이제 실제 어디에서 실행할지 결정합니다. 물리 아키텍처의 핵심은 서버 수가 아닙니다. logical node를 어떤 center, vm, jvm, war에 배치하고, network와 db를 어디서 끊어 장애를 격리할 것인가가 핵심입니다. fig-06-01. 장 전체 architecture text user ↓ gslb ↓ l4 ↓ web / apache ↓ was / tomcat jvm ↓ pdmg war ↓ hikari / mybatis / jdbc ↓ rdw / db 물리 아키텍처에서는 logical node를 실제 center·vm·jvm·war·db로 내립니다. 여기서 가장 중요한 원칙은 server, vm, jvm, war가 서로 다른 단위라는 점입니다. 이 구분이 명확해야 배포, 용량, 장애격리, dr을 같은 모델에서 설명할 수 있습니다. ---"}, {"id": "topic-6-2", "chapter": 6, "page": 2, "title": "1. Logical→Physical Mapping", "preview": "FIG-06-02. Logical→Physical Mapping text Logical Node ↓ Environment ↓ Center ↓ Host / VM", "column": 2, "html": "<h2>1. Logical→Physical Mapping<\/h2>\n<h3>FIG-06-02. Logical→Physical Mapping<\/h3>\n<pre class=\"text-architecture\">Logical Node\n ↓\nEnvironment\n ↓\nCenter\n ↓\nHost / VM\n ↓\nJVM\n ↓\nWAR\n ↓\nPort / DB / Storage<\/pre>\n<p>물리 설계는 Logical Node의 구현입니다. Environment와 Center를 구분하고 그 아래 Compute/Runtime/Artifact를 배치합니다.<\/p>\n<p>Server, VM, JVM, WAR는 서로 다른 Failure/Scale 단위입니다.<\/p>\n<p>이 구분이 있어야 Capacity와 HA를 정확히 설계할 수 있습니다.<\/p>\n<hr>", "search": "1. logical→physical mapping fig-06-02. logical→physical mapping text logical node ↓ environment ↓ center ↓ host / vm ↓ jvm ↓ war ↓ port / db / storage 물리 설계는 logical node의 구현입니다. environment와 center를 구분하고 그 아래 compute/runtime/artifact를 배치합니다. server, vm, jvm, war는 서로 다른 failure/scale 단위입니다. 이 구분이 있어야 capacity와 ha를 정확히 설계할 수 있습니다. ---"}, {"id": "topic-6-3", "chapter": 6, "page": 3, "title": "2. GSLB/L4/WEB/WAS 경로", "preview": "FIG-06-03. GSLB/L4/WEB/WAS 경로 text Client ↓ GSLB ↓ L4 ↓ Apache WEB", "column": 1, "html": "<h2>2. GSLB/L4/WEB/WAS 경로<\/h2>\n<h3>FIG-06-03. GSLB/L4/WEB/WAS 경로<\/h3>\n<pre class=\"text-architecture\">Client\n ↓\nGSLB\n ↓\nL4\n ↓\nApache WEB\n ↓\nTomcat WAS\n ↓\nApplication<\/pre>\n<p>사용자 요청은 여러 계층을 통과합니다. 각 계층은 다른 책임을 가집니다.<\/p>\n<p>GSLB는 광역/도메인 수준, L4는 서비스 분산, WEB은 Reverse Proxy/정적처리, WAS는 Application Runtime을 담당합니다.<\/p>\n<p>제품명보다 이 책임분리가 중요합니다.<\/p>\n<hr>", "search": "2. gslb/l4/web/was 경로 fig-06-03. gslb/l4/web/was 경로 text client ↓ gslb ↓ l4 ↓ apache web ↓ tomcat was ↓ application 사용자 요청은 여러 계층을 통과합니다. 각 계층은 다른 책임을 가집니다. gslb는 광역/도메인 수준, l4는 서비스 분산, web은 reverse proxy/정적처리, was는 application runtime을 담당합니다. 제품명보다 이 책임분리가 중요합니다. ---"}, {"id": "topic-6-4", "chapter": 6, "page": 4, "title": "3. VM/JVM/WAR 분리", "preview": "FIG-06-04. VM/JVM/WAR 분리 text Physical Server ↓ VM ↓ OS ↓ JVM", "column": 2, "html": "<h2>3. VM/JVM/WAR 분리<\/h2>\n<h3>FIG-06-04. VM/JVM/WAR 분리<\/h3>\n<pre class=\"text-architecture\">Physical Server\n ↓\nVM\n ↓\nOS\n ↓\nJVM\n ↓\nWAR<\/pre>\n<p>이 그림은 물리 장에서 가장 중요한 구분입니다.<\/p>\n<p>WAS Server라는 한 단어 안에 VM, JVM, WAR가 섞이면 장애영향과 배포단위를 설명하기 어렵습니다.<\/p>\n<p>JVM 장애는 그 JVM 안의 WAR에 영향을 주지만 같은 VM의 다른 JVM까지 반드시 죽는 것은 아닙니다.<\/p>\n<hr>", "search": "3. vm/jvm/war 분리 fig-06-04. vm/jvm/war 분리 text physical server ↓ vm ↓ os ↓ jvm ↓ war 이 그림은 물리 장에서 가장 중요한 구분입니다. was server라는 한 단어 안에 vm, jvm, war가 섞이면 장애영향과 배포단위를 설명하기 어렵습니다. jvm 장애는 그 jvm 안의 war에 영향을 주지만 같은 vm의 다른 jvm까지 반드시 죽는 것은 아닙니다. ---"}, {"id": "topic-6-5", "chapter": 6, "page": 5, "title": "4. JVM/WAR Isolation", "preview": "FIG-06-05. JVM/WAR Isolation text WAS VM ├─ JVM Group A │ └─ WAR A... └─ JVM Group B └─ WAR B...", "column": 2, "html": "<h2>4. JVM/WAR Isolation<\/h2>\n<h3>FIG-06-05. JVM/WAR Isolation<\/h3>\n<pre class=\"text-architecture\">WAS VM\n├─ JVM Group A\n│  └─ WAR A...\n└─ JVM Group B\n   └─ WAR B...<\/pre>\n<p>업무그룹을 JVM으로 분리하면 Resource Contention과 Failure Domain을 줄일 수 있습니다.<\/p>\n<p>다만 JVM 수가 늘면 운영복잡도와 Memory Overhead가 증가합니다.<\/p>\n<p>따라서 Isolation은 Candidate가 아니라 부하/장애시험으로 확정해야 합니다.<\/p>\n<hr>", "search": "4. jvm/war isolation fig-06-05. jvm/war isolation text was vm ├─ jvm group a │ └─ war a... └─ jvm group b └─ war b... 업무그룹을 jvm으로 분리하면 resource contention과 failure domain을 줄일 수 있습니다. 다만 jvm 수가 늘면 운영복잡도와 memory overhead가 증가합니다. 따라서 isolation은 candidate가 아니라 부하/장애시험으로 확정해야 합니다. ---"}, {"id": "topic-6-6", "chapter": 6, "page": 6, "title": "5. Data Physical Path", "preview": "FIG-06-06. Data Physical Path text JVM ↓ Hikari ↓ JDBC ↓ DB Service", "column": 2, "html": "<h2>5. Data Physical Path<\/h2>\n<h3>FIG-06-06. Data Physical Path<\/h3>\n<pre class=\"text-architecture\">JVM\n ↓\nHikari\n ↓\nJDBC\n ↓\nDB Service\n ↓\nDB Node / Storage<\/pre>\n<p>Application에서 DB까지도 여러 물리경계가 있습니다.<\/p>\n<p>Connection Pool은 Application Resource이고, DB Session은 Database Resource입니다. 둘을 같은 Capacity 수치로 보면 안 됩니다.<\/p>\n<p>DB HA/Storage 구조는 별도 Evidence가 필요합니다.<\/p>\n<hr>", "search": "5. data physical path fig-06-06. data physical path text jvm ↓ hikari ↓ jdbc ↓ db service ↓ db node / storage application에서 db까지도 여러 물리경계가 있습니다. connection pool은 application resource이고, db session은 database resource입니다. 둘을 같은 capacity 수치로 보면 안 됩니다. db ha/storage 구조는 별도 evidence가 필요합니다. ---"}, {"id": "topic-6-7", "chapter": 6, "page": 7, "title": "6. Network/Firewall/Port", "preview": "FIG-06-07. Network/Firewall/Port text GSLB/L4 ↓ WEB Port ↓ WAS Connector ↓ DB Service", "column": 1, "html": "<h2>6. Network/Firewall/Port<\/h2>\n<h3>FIG-06-07. Network/Firewall/Port<\/h3>\n<pre class=\"text-architecture\">GSLB/L4\n ↓\nWEB Port\n ↓\nWAS Connector\n ↓\nDB Service\n ↓\nManagement\n\nFirewall Rule ↔ Config ↔ Inventory<\/pre>\n<p>Physical Architecture는 Network Diagram과 Config가 일치해야 합니다.<\/p>\n<p>문서에 Port를 적는 것만으로 끝나는 것이 아니라 LB, Firewall, Connector, Application Config가 같은 값을 가져야 합니다.<\/p>\n<p>정확한 Port/Hostname은 실제 Inventory 없이 창작하지 않습니다.<\/p>\n<hr>", "search": "6. network/firewall/port fig-06-07. network/firewall/port text gslb/l4 ↓ web port ↓ was connector ↓ db service ↓ management firewall rule ↔ config ↔ inventory physical architecture는 network diagram과 config가 일치해야 합니다. 문서에 port를 적는 것만으로 끝나는 것이 아니라 lb, firewall, connector, application config가 같은 값을 가져야 합니다. 정확한 port/hostname은 실제 inventory 없이 창작하지 않습니다. ---"}, {"id": "topic-6-8", "chapter": 6, "page": 8, "title": "7. Capacity Candidate", "preview": "FIG-06-08. Capacity Candidate text A 32C/256G ×4 B 16C/128G ×8 C 16C/128G ×4 ×2 groups [CANDIDATE]", "column": 2, "html": "<h2>7. Capacity Candidate<\/h2>\n<h3>FIG-06-08. Capacity Candidate<\/h3>\n<pre class=\"text-architecture\">A 32C/256G ×4\nB 16C/128G ×8\nC 16C/128G ×4 ×2 groups\n\n[CANDIDATE]<\/pre>\n<p>현재 자료에는 여러 Capacity Candidate가 있습니다. 이것을 Production Fact로 쓰면 안 됩니다.<\/p>\n<p>Candidate는 부하모델과 비용, N+1 잔존용량, GC/DB 영향까지 시험한 뒤 승인되어야 합니다.<\/p>\n<p>따라서 문서에는 Candidate 상태를 명시합니다.<\/p>\n<hr>", "search": "7. capacity candidate fig-06-08. capacity candidate text a 32c/256g ×4 b 16c/128g ×8 c 16c/128g ×4 ×2 groups [candidate] 현재 자료에는 여러 capacity candidate가 있습니다. 이것을 production fact로 쓰면 안 됩니다. candidate는 부하모델과 비용, n+1 잔존용량, gc/db 영향까지 시험한 뒤 승인되어야 합니다. 따라서 문서에는 candidate 상태를 명시합니다. ---"}, {"id": "topic-6-9", "chapter": 6, "page": 9, "title": "8. Physical Traceability", "preview": "FIG-06-09. Physical Traceability text sourceCommit ↓ artifactHash ↓ deploymentId ↓ WAR", "column": 2, "html": "<h2>8. Physical Traceability<\/h2>\n<h3>FIG-06-09. Physical Traceability<\/h3>\n<pre class=\"text-architecture\">sourceCommit\n ↓\nartifactHash\n ↓\ndeploymentId\n ↓\nWAR\n ↓\nJVM\n ↓\nVM\n ↓\nHost / Center<\/pre>\n<p>물리 아키텍처를 운영과 연결하려면 Deployment Trace가 필요합니다.<\/p>\n<p>'어느 서버에 배포됐다'가 아니라 SourceCommit과 ArtifactHash까지 이어져야 정확한 장애분석과 Rollback이 가능합니다.<\/p>\n<p>현재 이 전수 Mapping이 주요 GAP입니다.<\/p>\n<hr>", "search": "8. physical traceability fig-06-09. physical traceability text sourcecommit ↓ artifacthash ↓ deploymentid ↓ war ↓ jvm ↓ vm ↓ host / center 물리 아키텍처를 운영과 연결하려면 deployment trace가 필요합니다. '어느 서버에 배포됐다'가 아니라 sourcecommit과 artifacthash까지 이어져야 정확한 장애분석과 rollback이 가능합니다. 현재 이 전수 mapping이 주요 gap입니다. ---"}, {"id": "topic-6-10", "chapter": 6, "page": 10, "title": "정상패턴과 금지패턴", "preview": "FIG-06-10. Normal Pattern text Logical→VM/JVM/WAR→DB→Evidence 정상패턴은 Logical Node를 Center→VM→JVM→WAR로 단계적으로 투영하고 배포 Artifact와 실제 Runtime을 추적하는 것입니다. FIG-06-11. Forbidden Pattern", "column": 3, "html": "<h2>정상패턴과 금지패턴<\/h2>\n<h3>FIG-06-10. Normal Pattern<\/h3>\n<pre class=\"text-architecture\">Logical→VM/JVM/WAR→DB→Evidence<\/pre>\n<p>정상패턴은 Logical Node를 Center→VM→JVM→WAR로 단계적으로 투영하고 배포 Artifact와 실제 Runtime을 추적하는 것입니다.<\/p>\n<h3>FIG-06-11. Forbidden Pattern<\/h3>\n<pre class=\"text-architecture\">Server=JVM=WAR / Candidate=Fact<\/pre>\n<p>Server=VM=JVM=WAR처럼 물리단위를 한 단계로 축약하거나 Candidate Capacity를 Production Fact로 표기하는 것을 금지합니다.<\/p>\n<hr>", "search": "정상패턴과 금지패턴 fig-06-10. normal pattern text logical→vm/jvm/war→db→evidence 정상패턴은 logical node를 center→vm→jvm→war로 단계적으로 투영하고 배포 artifact와 실제 runtime을 추적하는 것입니다. fig-06-11. forbidden pattern text server=jvm=war / candidate=fact server=vm=jvm=war처럼 물리단위를 한 단계로 축약하거나 candidate capacity를 production fact로 표기하는 것을 금지합니다. ---"}, {"id": "topic-6-11", "chapter": 6, "page": 11, "title": "Architecture Decision", "preview": "FIG-06-12. 주안과 대안 text [주안] 중형 VM Scale-out + JVM/WAR Isolation VS [대안] 대형 VM Scale-up 중심", "column": 2, "html": "<h2>Architecture Decision<\/h2>\n<h3>FIG-06-12. 주안과 대안<\/h3>\n<pre class=\"text-architecture\">[주안]\n중형 VM Scale-out + JVM/WAR Isolation\n\n        VS\n\n[대안]\n대형 VM Scale-up 중심<\/pre>\n<p>Physical은 Working Baseline인 L4→Apache→Tomcat 흐름을 중심으로 하되 VM/JVM/WAR를 분리해 Scale-out과 Isolation을 설계합니다.<\/p>\n<p>대형 VM Scale-up은 운영단순성이 장점이지만 Failure Domain과 GC/Resource Contention이 커질 수 있어 부하시험 없이 기본안으로 확정하지 않습니다.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>평가축<\/th><th>주안<\/th><th>대안<\/th><\/tr><\/thead><tbody><tr><td>책임/경계<\/td><td>명확<\/td><td>추가 보완 필요<\/td><\/tr><tr><td>Current PDMG 정합<\/td><td>높음<\/td><td>변경범위 가능<\/td><\/tr><tr><td>운영/장애분석<\/td><td>Trace 용이<\/td><td>복잡도 증가 가능<\/td><\/tr><tr><td>승인조건<\/td><td>기본 Rule/Test<\/td><td>별도 ADR + Evidence<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>", "search": "architecture decision fig-06-12. 주안과 대안 text [주안] 중형 vm scale-out + jvm/war isolation vs [대안] 대형 vm scale-up 중심 physical은 working baseline인 l4→apache→tomcat 흐름을 중심으로 하되 vm/jvm/war를 분리해 scale-out과 isolation을 설계합니다. 대형 vm scale-up은 운영단순성이 장점이지만 failure domain과 gc/resource contention이 커질 수 있어 부하시험 없이 기본안으로 확정하지 않습니다. | 평가축 | 주안 | 대안 | |---|---|---| | 책임/경계 | 명확 | 추가 보완 필요 | | current pdmg 정합 | 높음 | 변경범위 가능 | | 운영/장애분석 | trace 용이 | 복잡도 증가 가능 | | 승인조건 | 기본 rule/test | 별도 adr + evidence | ---"}, {"id": "topic-6-12", "chapter": 6, "page": 12, "title": "Evidence / Conformance — 이 장의 Architecture를 무엇으로 증명하는가", "preview": "Evidence Architecture text 물리 아키텍처 Architecture Rule ↓ Source Evidence ↓ Config Evidence ↓ Runtime / Deployment Evidence", "column": 3, "html": "<h2>Evidence / Conformance — 이 장의 Architecture를 무엇으로 증명하는가<\/h2>\n<h3>Evidence Architecture<\/h3>\n<pre class=\"text-architecture\">물리 아키텍처 Architecture Rule\n        ↓\nSource Evidence\n        ↓\nConfig Evidence\n        ↓\nRuntime / Deployment Evidence\n        ↓\nConformance Test\n        ↓\nPASS / GAP / ADR<\/pre>\n<h4>Source Evidence<\/h4>\n<ul><li><code>[SOURCE]<\/code> Physical/Infrastructure 상세정의<\/li><li><code>[SOURCE]<\/code> Capacity/HA/DR 상세정의<\/li><\/ul>\n<h4>Config Evidence<\/h4>\n<ul><li><code>[CONFIG]<\/code> GSLB/L4/Apache/Tomcat/JDBC working baseline<\/li><li><code>[CONFIG]<\/code> Host/Port/Version은 Inventory Evidence 필요<\/li><\/ul>\n<h4>Runtime / Deployment Evidence<\/h4>\n<ul><li><code>[RUNTIME]<\/code> GSLB→L4→Apache→Tomcat/JVM→WAR→DB<\/li><\/ul>\n<h4>Architecture Decision<\/h4>\n<ul><li><code>[DECISION]<\/code> Server ≠ VM ≠ JVM ≠ WAR<\/li><li><code>[DECISION]<\/code> Scale-out + JVM/WAR Isolation 후보<\/li><\/ul>\n<h4>Related ADR<\/h4>\n<ul><li><code>ADR-026 VM Scale-out Candidate<\/code><\/li><li><code>ADR-027 L4→Apache→Tomcat<\/code><\/li><li><code>ADR-028 JVM Isolation<\/code><\/li><li><code>ADR-034 Immutable Artifact<\/code><\/li><\/ul>\n<h4>Current GAP / OPEN<\/h4>\n<ul><li><code>[GAP/OPEN]<\/code> Artifact→Host/JVM/WAR<\/li><li><code>[GAP/OPEN]<\/code> 실제 Host/Port/Version<\/li><li><code>[GAP/OPEN]<\/code> Placement 승인<\/li><li><code>[GAP/OPEN]<\/code> Restore Evidence<\/li><\/ul>\n<h3>이 장의 판정<\/h3>\n<pre class=\"text-architecture\">Architecture Definition\n        ↓\nPASS\n\nCurrent PDMG Conformance\n        ↓\nPARTIAL / OPEN\n\nRuntime Evidence Coverage\n        ↓\nMEDIUM\n\nArchitecture Definition PASS\n        ≠\nCurrent Implementation PASS<\/pre>\n<h4>PASS 전환조건<\/h4>\n<ul><li><code>CMDB/Host/JVM/WAR Inventory<\/code><\/li><li><code>Artifact Deployment Trace<\/code><\/li><li><code>Capacity/Failure Test<\/code><\/li><\/ul>\n<p>위 조건은 문서 완성도가 아니라 <strong>Current Implementation Conformance를 PASS로 전환하기 위한 Exit Criteria<\/strong>다. 해당 Evidence가 확보되기 전에는 <code>[GAP]<\/code>, <code>[OPEN]<\/code>, <code>[UNKNOWN]<\/code> 상태를 유지한다.<\/p>\n<hr>", "search": "evidence / conformance — 이 장의 architecture를 무엇으로 증명하는가 evidence architecture text 물리 아키텍처 architecture rule ↓ source evidence ↓ config evidence ↓ runtime / deployment evidence ↓ conformance test ↓ pass / gap / adr source evidence - [source] physical/infrastructure 상세정의 - [source] capacity/ha/dr 상세정의 config evidence - [config] gslb/l4/apache/tomcat/jdbc working baseline - [config] host/port/version은 inventory evidence 필요 runtime / deployment evidence - [runtime] gslb→l4→apache→tomcat/jvm→war→db architecture decision - [decision] server ≠ vm ≠ jvm ≠ war - [decision] scale-out + jvm/war isolation 후보 related adr - adr-026 vm scale-out candidate - adr-027 l4→apache→tomcat - adr-028 jvm isolation - adr-034 immutable artifact current gap / open - [gap/open] artifact→host/jvm/war - [gap/open] 실제 host/port/version - [gap/open] placement 승인 - [gap/open] restore evidence 이 장의 판정 text architecture definition ↓ pass current pdmg conformance ↓ partial / open runtime evidence coverage ↓ medium architecture definition pass ≠ current implementation pass pass 전환조건 - cmdb/host/jvm/war inventory - artifact deployment trace - capacity/failure test 위 조건은 문서 완성도가 아니라 current implementation conformance를 pass로 전환하기 위한 exit criteria다. 해당 evidence가 확보되기 전에는 [gap], [open], [unknown] 상태를 유지한다. ---"}, {"id": "topic-6-13", "chapter": 6, "page": 13, "title": "Chapter Closing Script", "preview": "FIG-06-16. 다음 장 Handoff text 물리 아키텍처 ↓ 속도와 안정성을 실제 Center·VM·JVM·DB 구조로 구현한다 ↓ 남은 질문 \"완벽해 보이는 구조보다 운영 가능한 복구구조를 선택한다\" ↓", "column": 2, "html": "<h2>Chapter Closing Script<\/h2>\n<h3>FIG-06-16. 다음 장 Handoff<\/h3>\n<pre class=\"text-architecture\">물리 아키텍처\n ↓\n속도와 안정성을 실제 Center·VM·JVM·DB 구조로 구현한다\n ↓\n남은 질문\n&quot;완벽해 보이는 구조보다 운영 가능한 복구구조를 선택한다&quot;\n ↓\nDR 센터 활용 전략<\/pre>\n<p>Physical 배치가 끝나면 장애가 발생했을 때 어떤 자원이 함께 실패하고 어떤 경로로 우회할지가 보입니다. 다음 장에서는 이 Failure Domain을 Local HA와 Center DR 전략으로 연결합니다.<\/p>", "search": "chapter closing script fig-06-16. 다음 장 handoff text 물리 아키텍처 ↓ 속도와 안정성을 실제 center·vm·jvm·db 구조로 구현한다 ↓ 남은 질문 \"완벽해 보이는 구조보다 운영 가능한 복구구조를 선택한다\" ↓ dr 센터 활용 전략 physical 배치가 끝나면 장애가 발생했을 때 어떤 자원이 함께 실패하고 어떤 경로로 우회할지가 보입니다. 다음 장에서는 이 failure domain을 local ha와 center dr 전략으로 연결합니다."}, {"id": "topic-7-1", "chapter": 7, "page": 1, "title": "0. Opening Script", "preview": "Physical 구조를 만들었으면 다음 질문은 장애와 재해입니다. DR의 목표는 '센터가 하나 더 있다'가 아닙니다. Main이 사용할 수 없을 때 Application, Config, Key, Data, Interface를 DR에서 다시 연결하고 Business Transaction이 정상적으로 수행되는 것이 목표입니다. FIG-07-0…", "column": 2, "html": "<h2>0. Opening Script<\/h2>\n<p>Physical 구조를 만들었으면 다음 질문은 장애와 재해입니다.<\/p>\n<p>DR의 목표는 '센터가 하나 더 있다'가 아닙니다. <strong>Main이 사용할 수 없을 때 Application, Config, Key, Data, Interface를 DR에서 다시 연결하고 Business Transaction이 정상적으로 수행되는 것<\/strong>이 목표입니다.<\/p>\n<h3>FIG-07-01. 장 전체 Architecture<\/h3>\n<pre class=\"text-architecture\">Main Center\n ↓ failure\nDetect\n ↓\nIsolate\n ↓\nTraffic Reroute\n ↓\nDR WEB/WAS\n ↓\nDR DB\n ↓\nBusiness Validation\n ↓\nFailback<\/pre>\n<p>DR 그림은 센터가 하나 더 있다는 사실을 보여주기 위한 것이 아닙니다. 장애를 감지하고 격리한 뒤 Traffic, Application, Config, Key, Data를 DR에서 다시 연결하고 실제 업무를 검증한 후 Failback하는 전체 복구 Chain을 보여줍니다.<\/p>\n<hr>", "search": "0. opening script physical 구조를 만들었으면 다음 질문은 장애와 재해입니다. dr의 목표는 '센터가 하나 더 있다'가 아닙니다. main이 사용할 수 없을 때 application, config, key, data, interface를 dr에서 다시 연결하고 business transaction이 정상적으로 수행되는 것이 목표입니다. fig-07-01. 장 전체 architecture text main center ↓ failure detect ↓ isolate ↓ traffic reroute ↓ dr web/was ↓ dr db ↓ business validation ↓ failback dr 그림은 센터가 하나 더 있다는 사실을 보여주기 위한 것이 아닙니다. 장애를 감지하고 격리한 뒤 traffic, application, config, key, data를 dr에서 다시 연결하고 실제 업무를 검증한 후 failback하는 전체 복구 chain을 보여줍니다. ---"}, {"id": "topic-7-2", "chapter": 7, "page": 2, "title": "1. HA와 DR 구분", "preview": "FIG-07-02. HA와 DR 구분 text Local HA = Node/Process Failure Center DR = Site Disaster", "column": 2, "html": "<h2>1. HA와 DR 구분<\/h2>\n<h3>FIG-07-02. HA와 DR 구분<\/h3>\n<pre class=\"text-architecture\">Local HA\n= Node/Process Failure\n\nCenter DR\n= Site Disaster<\/pre>\n<p>Local HA와 DR은 같은 문제가 아닙니다.<\/p>\n<p>Node Failure를 N+1로 견디는 것과 Center 전체를 전환하는 것은 범위와 운영절차가 다릅니다.<\/p>\n<p>두 문제를 분리해야 Test Scenario도 분리됩니다.<\/p>\n<hr>", "search": "1. ha와 dr 구분 fig-07-02. ha와 dr 구분 text local ha = node/process failure center dr = site disaster local ha와 dr은 같은 문제가 아닙니다. node failure를 n+1로 견디는 것과 center 전체를 전환하는 것은 범위와 운영절차가 다릅니다. 두 문제를 분리해야 test scenario도 분리됩니다. ---"}, {"id": "topic-7-3", "chapter": 7, "page": 3, "title": "2. Main Local HA", "preview": "FIG-07-03. Main Local HA text GSLB/L4 ↓ WEB N+1 ↓ WAS Active-Active/N+1 ↓ DB Local HA", "column": 2, "html": "<h2>2. Main Local HA<\/h2>\n<h3>FIG-07-03. Main Local HA<\/h3>\n<pre class=\"text-architecture\">GSLB/L4\n ↓\nWEB N+1\n ↓\nWAS Active-Active/N+1\n ↓\nDB Local HA<\/pre>\n<p>정상시에는 Local HA가 우선 방어선입니다.<\/p>\n<p>노드 하나가 죽어도 잔존 노드가 부하를 감당해야 하므로 단순 Active-Active가 아니라 N+1 Capacity를 검증해야 합니다.<\/p>\n<p>이 결과가 DR 규모 산정에도 영향을 줍니다.<\/p>\n<hr>", "search": "2. main local ha fig-07-03. main local ha text gslb/l4 ↓ web n+1 ↓ was active-active/n+1 ↓ db local ha 정상시에는 local ha가 우선 방어선입니다. 노드 하나가 죽어도 잔존 노드가 부하를 감당해야 하므로 단순 active-active가 아니라 n+1 capacity를 검증해야 합니다. 이 결과가 dr 규모 산정에도 영향을 줍니다. ---"}, {"id": "topic-7-4", "chapter": 7, "page": 4, "title": "3. 센터 장애 전환", "preview": "FIG-07-04. 센터 장애 전환 text Main Failure ↓ Detect ↓ Isolate ↓ Route Switch", "column": 2, "html": "<h2>3. 센터 장애 전환<\/h2>\n<h3>FIG-07-04. 센터 장애 전환<\/h3>\n<pre class=\"text-architecture\">Main Failure\n ↓\nDetect\n ↓\nIsolate\n ↓\nRoute Switch\n ↓\nDR Runtime\n ↓\nBusiness Check<\/pre>\n<p>DR에서 가장 중요한 것은 자동전환 여부보다 <strong>전환조건과 검증<\/strong>입니다.<\/p>\n<p>잘못된 감지로 전환되면 더 큰 장애가 될 수 있으므로 Detect/Isolate가 먼저입니다.<\/p>\n<p>그 다음 Traffic과 Application/Data가 같은 시점에 일관되게 전환되어야 합니다.<\/p>\n<hr>", "search": "3. 센터 장애 전환 fig-07-04. 센터 장애 전환 text main failure ↓ detect ↓ isolate ↓ route switch ↓ dr runtime ↓ business check dr에서 가장 중요한 것은 자동전환 여부보다 전환조건과 검증입니다. 잘못된 감지로 전환되면 더 큰 장애가 될 수 있으므로 detect/isolate가 먼저입니다. 그 다음 traffic과 application/data가 같은 시점에 일관되게 전환되어야 합니다. ---"}, {"id": "topic-7-5", "chapter": 7, "page": 5, "title": "4. Application/Config/Key 복구", "preview": "FIG-07-05. Application/Config/Key 복구 text Artifact Config Secret / JWT Key Interface Config Scheduler Monitoring ↓", "column": 1, "html": "<h2>4. Application/Config/Key 복구<\/h2>\n<h3>FIG-07-05. Application/Config/Key 복구<\/h3>\n<pre class=\"text-architecture\">Artifact\nConfig\nSecret / JWT Key\nInterface Config\nScheduler\nMonitoring\n ↓\nDR Ready<\/pre>\n<p>DR은 WAR 파일만 복제한다고 준비되는 것이 아닙니다.<\/p>\n<p>Environment Config, Secret, JWT Key, Interface Endpoint, Monitoring까지 같은 Baseline을 가져야 합니다.<\/p>\n<p>특히 Key 불일치는 인증장애로 직결되므로 DR 데이터로 취급해야 합니다.<\/p>\n<hr>", "search": "4. application/config/key 복구 fig-07-05. application/config/key 복구 text artifact config secret / jwt key interface config scheduler monitoring ↓ dr ready dr은 war 파일만 복제한다고 준비되는 것이 아닙니다. environment config, secret, jwt key, interface endpoint, monitoring까지 같은 baseline을 가져야 합니다. 특히 key 불일치는 인증장애로 직결되므로 dr 데이터로 취급해야 합니다. ---"}, {"id": "topic-7-6", "chapter": 7, "page": 6, "title": "5. DB Consistency", "preview": "FIG-07-06. DB Consistency text Application Active-Active ≠ DB Write Active-Active DB ↓ Replication / Recovery", "column": 1, "html": "<h2>5. DB Consistency<\/h2>\n<h3>FIG-07-06. DB Consistency<\/h3>\n<pre class=\"text-architecture\">Application Active-Active\n        ≠\nDB Write Active-Active\n\nDB\n ↓\nReplication / Recovery\n ↓\nConsistency Check<\/pre>\n<p>Application 가용성과 DB 쓰기 정합성은 다른 결정입니다.<\/p>\n<p>DB 양방향 Active-Active는 충돌/순서/정합성 문제가 있으므로 단순히 RTO를 줄인다는 이유로 채택할 수 없습니다.<\/p>\n<p>금융계에서는 검증되지 않은 Write Active-Active보다 정합성을 우선합니다.<\/p>\n<hr>", "search": "5. db consistency fig-07-06. db consistency text application active-active ≠ db write active-active db ↓ replication / recovery ↓ consistency check application 가용성과 db 쓰기 정합성은 다른 결정입니다. db 양방향 active-active는 충돌/순서/정합성 문제가 있으므로 단순히 rto를 줄인다는 이유로 채택할 수 없습니다. 금융계에서는 검증되지 않은 write active-active보다 정합성을 우선합니다. ---"}, {"id": "topic-7-7", "chapter": 7, "page": 7, "title": "6. RTO/RPO", "preview": "FIG-07-07. RTO/RPO text Business Criticality ↓ RTO / RPO ↓ DR Tier ↓ Technology / Procedure", "column": 2, "html": "<h2>6. RTO/RPO<\/h2>\n<h3>FIG-07-07. RTO/RPO<\/h3>\n<pre class=\"text-architecture\">Business Criticality\n ↓\nRTO / RPO\n ↓\nDR Tier\n ↓\nTechnology / Procedure\n ↓\nTest Evidence<\/pre>\n<p>RTO/RPO는 Architecture가 임의로 정하는 숫자가 아닙니다.<\/p>\n<p>업무 중요도와 허용손실을 기준으로 결정하고, 그 값을 만족시키기 위해 Technology와 Operation Procedure를 선택해야 합니다.<\/p>\n<p>현재 정확한 값은 OPEN으로 유지합니다.<\/p>\n<hr>", "search": "6. rto/rpo fig-07-07. rto/rpo text business criticality ↓ rto / rpo ↓ dr tier ↓ technology / procedure ↓ test evidence rto/rpo는 architecture가 임의로 정하는 숫자가 아닙니다. 업무 중요도와 허용손실을 기준으로 결정하고, 그 값을 만족시키기 위해 technology와 operation procedure를 선택해야 합니다. 현재 정확한 값은 open으로 유지합니다. ---"}, {"id": "topic-7-8", "chapter": 7, "page": 8, "title": "7. Failover와 Failback", "preview": "FIG-07-08. Failover와 Failback text Main → DR Failover ↓ Operate on DR ↓ Main Recover ↓", "column": 2, "html": "<h2>7. Failover와 Failback<\/h2>\n<h3>FIG-07-08. Failover와 Failback<\/h3>\n<pre class=\"text-architecture\">Main → DR\n Failover\n    ↓\nOperate on DR\n    ↓\nMain Recover\n    ↓\nRe-sync\n    ↓\nFailback<\/pre>\n<p>많은 DR 설계가 Failover까지만 생각합니다. 하지만 실제 운영에서는 원센터 복구 후 Failback이 더 어렵습니다.<\/p>\n<p>Data/Config가 다시 동기화되고, Business Cutover 시점이 명확해야 합니다.<\/p>\n<p>Failback까지 Test해야 DR 설계가 닫힙니다.<\/p>\n<hr>", "search": "7. failover와 failback fig-07-08. failover와 failback text main → dr failover ↓ operate on dr ↓ main recover ↓ re-sync ↓ failback 많은 dr 설계가 failover까지만 생각합니다. 하지만 실제 운영에서는 원센터 복구 후 failback이 더 어렵습니다. data/config가 다시 동기화되고, business cutover 시점이 명확해야 합니다. failback까지 test해야 dr 설계가 닫힙니다. ---"}, {"id": "topic-7-9", "chapter": 7, "page": 9, "title": "8. DR PASS의 의미", "preview": "FIG-07-09. DR PASS의 의미 text Backup Success ≠ DR PASS DR PASS = Network + App/Config/Key", "column": 2, "html": "<h2>8. DR PASS의 의미<\/h2>\n<h3>FIG-07-09. DR PASS의 의미<\/h3>\n<pre class=\"text-architecture\">Backup Success\n   ≠\nDR PASS\n\nDR PASS\n= Network\n+ App/Config/Key\n+ Data\n+ Interface\n+ Monitoring\n+ Business Validation<\/pre>\n<p>DR PASS는 Backup Job 성공이 아닙니다.<\/p>\n<p>사용자가 실제 업무를 수행하고 결과가 정합하게 저장되는지까지 확인해야 합니다.<\/p>\n<p>따라서 최종 Evidence는 Business Validation입니다.<\/p>\n<hr>", "search": "8. dr pass의 의미 fig-07-09. dr pass의 의미 text backup success ≠ dr pass dr pass = network + app/config/key + data + interface + monitoring + business validation dr pass는 backup job 성공이 아닙니다. 사용자가 실제 업무를 수행하고 결과가 정합하게 저장되는지까지 확인해야 합니다. 따라서 최종 evidence는 business validation입니다. ---"}, {"id": "topic-7-10", "chapter": 7, "page": 10, "title": "정상패턴과 금지패턴", "preview": "FIG-07-10. Normal Pattern text Detect→Isolate→Reroute→Recover→Validate→Failback 정상패턴은 Local HA로 일반 장애를 흡수하고, Center 장애 시 Detect→Isolate→Reroute→Recover→Validate→Failback을 수행하는 것입니다. FIG-07-1…", "column": 3, "html": "<h2>정상패턴과 금지패턴<\/h2>\n<h3>FIG-07-10. Normal Pattern<\/h3>\n<pre class=\"text-architecture\">Detect→Isolate→Reroute→Recover→Validate→Failback<\/pre>\n<p>정상패턴은 Local HA로 일반 장애를 흡수하고, Center 장애 시 Detect→Isolate→Reroute→Recover→Validate→Failback을 수행하는 것입니다.<\/p>\n<h3>FIG-07-11. Forbidden Pattern<\/h3>\n<pre class=\"text-architecture\">Backup=DR / Failback 미검증<\/pre>\n<p>Backup 성공을 DR PASS로 간주하거나 Failback을 검증하지 않은 채 DR 완료로 판단하는 것을 금지합니다.<\/p>\n<hr>", "search": "정상패턴과 금지패턴 fig-07-10. normal pattern text detect→isolate→reroute→recover→validate→failback 정상패턴은 local ha로 일반 장애를 흡수하고, center 장애 시 detect→isolate→reroute→recover→validate→failback을 수행하는 것입니다. fig-07-11. forbidden pattern text backup=dr / failback 미검증 backup 성공을 dr pass로 간주하거나 failback을 검증하지 않은 채 dr 완료로 판단하는 것을 금지합니다. ---"}, {"id": "topic-7-11", "chapter": 7, "page": 11, "title": "Architecture Decision", "preview": "FIG-07-12. 주안과 대안 text [주안] AP Active-Active/N+1 + DB 정합성 우선 DR VS [대안] DB 양방향 Active-Active", "column": 1, "html": "<h2>Architecture Decision<\/h2>\n<h3>FIG-07-12. 주안과 대안<\/h3>\n<pre class=\"text-architecture\">[주안]\nAP Active-Active/N+1 + DB 정합성 우선 DR\n\n        VS\n\n[대안]\nDB 양방향 Active-Active<\/pre>\n<p>Application은 Stateless Active-Active/N+1을 지향하되 DB는 정합성을 우선한 별도 DR Decision으로 관리합니다.<\/p>\n<p>DB 양방향 Write Active-Active는 빠른 전환의 장점보다 충돌·순서·정합성 운영위험이 크므로 명시적 PoC와 승인 없이는 채택하지 않습니다.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>평가축<\/th><th>주안<\/th><th>대안<\/th><\/tr><\/thead><tbody><tr><td>책임/경계<\/td><td>명확<\/td><td>추가 보완 필요<\/td><\/tr><tr><td>Current PDMG 정합<\/td><td>높음<\/td><td>변경범위 가능<\/td><\/tr><tr><td>운영/장애분석<\/td><td>Trace 용이<\/td><td>복잡도 증가 가능<\/td><\/tr><tr><td>승인조건<\/td><td>기본 Rule/Test<\/td><td>별도 ADR + Evidence<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>", "search": "architecture decision fig-07-12. 주안과 대안 text [주안] ap active-active/n+1 + db 정합성 우선 dr vs [대안] db 양방향 active-active application은 stateless active-active/n+1을 지향하되 db는 정합성을 우선한 별도 dr decision으로 관리합니다. db 양방향 write active-active는 빠른 전환의 장점보다 충돌·순서·정합성 운영위험이 크므로 명시적 poc와 승인 없이는 채택하지 않습니다. | 평가축 | 주안 | 대안 | |---|---|---| | 책임/경계 | 명확 | 추가 보완 필요 | | current pdmg 정합 | 높음 | 변경범위 가능 | | 운영/장애분석 | trace 용이 | 복잡도 증가 가능 | | 승인조건 | 기본 rule/test | 별도 adr + evidence | ---"}, {"id": "topic-7-12", "chapter": 7, "page": 12, "title": "Evidence / Conformance — 이 장의 Architecture를 무엇으로 증명하는가", "preview": "Evidence Architecture text DR 센터 활용 전략 Architecture Rule ↓ Source Evidence ↓ Config Evidence ↓ Runtime / Deployment Evidence", "column": 3, "html": "<h2>Evidence / Conformance — 이 장의 Architecture를 무엇으로 증명하는가<\/h2>\n<h3>Evidence Architecture<\/h3>\n<pre class=\"text-architecture\">DR 센터 활용 전략 Architecture Rule\n        ↓\nSource Evidence\n        ↓\nConfig Evidence\n        ↓\nRuntime / Deployment Evidence\n        ↓\nConformance Test\n        ↓\nPASS / GAP / ADR<\/pre>\n<h4>Source Evidence<\/h4>\n<ul><li><code>[SOURCE]<\/code> Physical/HA/DR 정의<\/li><li><code>[SOURCE]<\/code> Security Key/Config 동기화 요구<\/li><\/ul>\n<h4>Config Evidence<\/h4>\n<ul><li><code>[CONFIG]<\/code> DR Config/Secret/Key/Endpoint 동기화 필요<\/li><\/ul>\n<h4>Runtime / Deployment Evidence<\/h4>\n<ul><li><code>[RUNTIME]<\/code> Detect→Isolate→Reroute→Recover→Business Validate→Failback<\/li><\/ul>\n<h4>Architecture Decision<\/h4>\n<ul><li><code>[DECISION]<\/code> Application Active-Active와 DB Write Active-Active 분리<\/li><li><code>[DECISION]<\/code> DB 정합성 우선<\/li><\/ul>\n<h4>Related ADR<\/h4>\n<ul><li><code>ADR-030 Stateless Active-Active+N+1<\/code><\/li><li><code>ADR-031 Warm/Hot DR<\/code><\/li><li><code>ADR-032 DB HA/DR<\/code><\/li><li><code>ADR-038 Restore Drill<\/code><\/li><\/ul>\n<h4>Current GAP / OPEN<\/h4>\n<ul><li><code>[GAP/OPEN]<\/code> RTO/RPO<\/li><li><code>[GAP/OPEN]<\/code> DB DR 상세<\/li><li><code>[GAP/OPEN]<\/code> Config/Key Sync Evidence<\/li><li><code>[GAP/OPEN]<\/code> Failback Evidence<\/li><\/ul>\n<h3>이 장의 판정<\/h3>\n<pre class=\"text-architecture\">Architecture Definition\n        ↓\nPASS\n\nCurrent PDMG Conformance\n        ↓\nOPEN / CONDITIONAL\n\nRuntime Evidence Coverage\n        ↓\nLOW-MEDIUM\n\nArchitecture Definition PASS\n        ≠\nCurrent Implementation PASS<\/pre>\n<h4>PASS 전환조건<\/h4>\n<ul><li><code>RTO/RPO 승인<\/code><\/li><li><code>Restore Test<\/code><\/li><li><code>Failover/Failback Business Validation<\/code><\/li><li><code>Key/Config DR Sync<\/code><\/li><\/ul>\n<p>위 조건은 문서 완성도가 아니라 <strong>Current Implementation Conformance를 PASS로 전환하기 위한 Exit Criteria<\/strong>다. 해당 Evidence가 확보되기 전에는 <code>[GAP]<\/code>, <code>[OPEN]<\/code>, <code>[UNKNOWN]<\/code> 상태를 유지한다.<\/p>\n<hr>", "search": "evidence / conformance — 이 장의 architecture를 무엇으로 증명하는가 evidence architecture text dr 센터 활용 전략 architecture rule ↓ source evidence ↓ config evidence ↓ runtime / deployment evidence ↓ conformance test ↓ pass / gap / adr source evidence - [source] physical/ha/dr 정의 - [source] security key/config 동기화 요구 config evidence - [config] dr config/secret/key/endpoint 동기화 필요 runtime / deployment evidence - [runtime] detect→isolate→reroute→recover→business validate→failback architecture decision - [decision] application active-active와 db write active-active 분리 - [decision] db 정합성 우선 related adr - adr-030 stateless active-active+n+1 - adr-031 warm/hot dr - adr-032 db ha/dr - adr-038 restore drill current gap / open - [gap/open] rto/rpo - [gap/open] db dr 상세 - [gap/open] config/key sync evidence - [gap/open] failback evidence 이 장의 판정 text architecture definition ↓ pass current pdmg conformance ↓ open / conditional runtime evidence coverage ↓ low-medium architecture definition pass ≠ current implementation pass pass 전환조건 - rto/rpo 승인 - restore test - failover/failback business validation - key/config dr sync 위 조건은 문서 완성도가 아니라 current implementation conformance를 pass로 전환하기 위한 exit criteria다. 해당 evidence가 확보되기 전에는 [gap], [open], [unknown] 상태를 유지한다. ---"}, {"id": "topic-7-13", "chapter": 7, "page": 13, "title": "Chapter Closing Script", "preview": "FIG-07-16. 다음 장 Handoff text DR 센터 활용 전략 ↓ 완벽해 보이는 구조보다 운영 가능한 복구구조를 선택한다 ↓ 남은 질문 \"시스템은 서버가 아니라 표준과 실행규칙으로 움직인다\" ↓", "column": 2, "html": "<h2>Chapter Closing Script<\/h2>\n<h3>FIG-07-16. 다음 장 Handoff<\/h3>\n<pre class=\"text-architecture\">DR 센터 활용 전략\n ↓\n완벽해 보이는 구조보다 운영 가능한 복구구조를 선택한다\n ↓\n남은 질문\n&quot;시스템은 서버가 아니라 표준과 실행규칙으로 움직인다&quot;\n ↓\n메커니즘<\/pre>\n<p>DR까지 정리하면 공간과 복구전략은 준비됩니다. 이제 정상상태에서 거래가 매번 같은 방식으로 움직이도록 만드는 공통 실행규칙이 필요합니다. 그 규칙이 8장의 Mechanism입니다.<\/p>", "search": "chapter closing script fig-07-16. 다음 장 handoff text dr 센터 활용 전략 ↓ 완벽해 보이는 구조보다 운영 가능한 복구구조를 선택한다 ↓ 남은 질문 \"시스템은 서버가 아니라 표준과 실행규칙으로 움직인다\" ↓ 메커니즘 dr까지 정리하면 공간과 복구전략은 준비됩니다. 이제 정상상태에서 거래가 매번 같은 방식으로 움직이도록 만드는 공통 실행규칙이 필요합니다. 그 규칙이 8장의 mechanism입니다."}, {"id": "topic-8-1", "chapter": 8, "page": 1, "title": "0. Opening Script", "preview": "이 장은 PDMG 기술 아키텍처의 중심입니다. 앞 장까지는 공간과 배치를 봤습니다. 이제 같은 서버 위에서 거래가 어떤 표준 규칙으로 시작되고, 신뢰를 확인하고, ServiceId를 해석하고, Worker와 Transaction을 만들고, Error와 Log를 남기는지를 봅니다. 이 그림의 핵심은 Component 수가 아니라 실행정책의 …", "column": 2, "html": "<h2>0. Opening Script<\/h2>\n<p>이 장은 PDMG 기술 아키텍처의 중심입니다.<\/p>\n<p>앞 장까지는 공간과 배치를 봤습니다. 이제 같은 서버 위에서 거래가 <strong>어떤 표준 규칙으로 시작되고, 신뢰를 확인하고, ServiceId를 해석하고, Worker와 Transaction을 만들고, Error와 Log를 남기는지<\/strong>를 봅니다.<\/p>\n<p>이 그림의 핵심은 Component 수가 아니라 <strong>실행정책의 소유권<\/strong>입니다.<\/p>\n<h3>FIG-08-01. 장 전체 Architecture<\/h3>\n<pre class=\"text-architecture\">HTTP\n ↓\nDefaultFilter\n ↓\nSecurityFilterChain\n ↓\nDispatcherServlet\n ↓\nInterceptor\n ↓\nOnlineTransactionController\n ↓\nTcfFacade\n ↓\nOnlineTimeoutExecutor\n ↓\nTransactionDispatcher\n ↓\nHandler\n ↓\nFacade / Service\n ↓\nDAO / DB\n ↓\nResponse / Error / Evidence<\/pre>\n<p>Mechanism은 PDMG 기술 Architecture의 실행규칙입니다. 요청은 Controller보다 먼저 Filter와 Security를 지나고, ServiceId를 해석한 뒤 Worker와 Transaction 안에서 Business를 실행합니다. 따라서 이 장의 핵심은 Component 수가 아니라 <strong>실행정책을 누가 소유하는가<\/strong>입니다.<\/p>\n<hr>", "search": "0. opening script 이 장은 pdmg 기술 아키텍처의 중심입니다. 앞 장까지는 공간과 배치를 봤습니다. 이제 같은 서버 위에서 거래가 어떤 표준 규칙으로 시작되고, 신뢰를 확인하고, serviceid를 해석하고, worker와 transaction을 만들고, error와 log를 남기는지를 봅니다. 이 그림의 핵심은 component 수가 아니라 실행정책의 소유권입니다. fig-08-01. 장 전체 architecture text http ↓ defaultfilter ↓ securityfilterchain ↓ dispatcherservlet ↓ interceptor ↓ onlinetransactioncontroller ↓ tcffacade ↓ onlinetimeoutexecutor ↓ transactiondispatcher ↓ handler ↓ facade / service ↓ dao / db ↓ response / error / evidence mechanism은 pdmg 기술 architecture의 실행규칙입니다. 요청은 controller보다 먼저 filter와 security를 지나고, serviceid를 해석한 뒤 worker와 transaction 안에서 business를 실행합니다. 따라서 이 장의 핵심은 component 수가 아니라 실행정책을 누가 소유하는가입니다. ---"}, {"id": "topic-8-2", "chapter": 8, "page": 2, "title": "1. Framework와 Business의 역할", "preview": "FIG-08-02. Framework와 Business의 역할 text Framework = HOW safely execute Business = WHAT to execute Framework Contract", "column": 2, "html": "<h2>1. Framework와 Business의 역할<\/h2>\n<h3>FIG-08-02. Framework와 Business의 역할<\/h3>\n<pre class=\"text-architecture\">Framework\n= HOW safely execute\n\nBusiness\n= WHAT to execute\n\nFramework Contract\n ↓\nHandler / Facade / Service<\/pre>\n<p>먼저 책임을 나눕니다. Framework는 Context, Security, Timeout, Transaction, Error, Logging 같은 실행정책을 소유합니다.<\/p>\n<p>Business는 어떤 업무를 수행할지 결정합니다. Framework가 특정 업무 SQL을 알기 시작하면 공통정책과 업무코드가 강결합됩니다.<\/p>\n<p>이 분리가 Mechanism 장의 가장 중요한 원칙입니다.<\/p>\n<hr>", "search": "1. framework와 business의 역할 fig-08-02. framework와 business의 역할 text framework = how safely execute business = what to execute framework contract ↓ handler / facade / service 먼저 책임을 나눕니다. framework는 context, security, timeout, transaction, error, logging 같은 실행정책을 소유합니다. business는 어떤 업무를 수행할지 결정합니다. framework가 특정 업무 sql을 알기 시작하면 공통정책과 업무코드가 강결합됩니다. 이 분리가 mechanism 장의 가장 중요한 원칙입니다. ---"}, {"id": "topic-8-3", "chapter": 8, "page": 3, "title": "2. DefaultFilter — 거래 Context 시작", "preview": "FIG-08-03. DefaultFilter — 거래 Context 시작 text HTTP ↓ DefaultFilter ├─ Body Cache ├─ GUID/Header ├─ ServiceContext └─ MDC", "column": 2, "html": "<h2>2. DefaultFilter — 거래 Context 시작<\/h2>\n<h3>FIG-08-03. DefaultFilter — 거래 Context 시작<\/h3>\n<pre class=\"text-architecture\">HTTP\n ↓\nDefaultFilter\n ├─ Body Cache\n ├─ GUID/Header\n ├─ ServiceContext\n └─ MDC\n ↓\nFilterChain\n ↓\nfinally clear<\/pre>\n<p>거래는 Controller에서 시작되는 것이 아닙니다. Filter에서 이미 Context가 만들어지고 GUID/MDC가 준비됩니다.<\/p>\n<p>이 지점이 중요한 이유는 Filter가 Security와 MVC보다 먼저 실행되기 때문입니다. 여기서 만든 Context가 이후 Runtime 전체로 전달됩니다.<\/p>\n<p>마지막 <code>finally<\/code>에서 ThreadLocal을 반드시 제거해야 Cross-request contamination을 막을 수 있습니다.<\/p>\n<hr>", "search": "2. defaultfilter — 거래 context 시작 fig-08-03. defaultfilter — 거래 context 시작 text http ↓ defaultfilter ├─ body cache ├─ guid/header ├─ servicecontext └─ mdc ↓ filterchain ↓ finally clear 거래는 controller에서 시작되는 것이 아닙니다. filter에서 이미 context가 만들어지고 guid/mdc가 준비됩니다. 이 지점이 중요한 이유는 filter가 security와 mvc보다 먼저 실행되기 때문입니다. 여기서 만든 context가 이후 runtime 전체로 전달됩니다. 마지막 finally에서 threadlocal을 반드시 제거해야 cross-request contamination을 막을 수 있습니다. ---"}, {"id": "topic-8-4", "chapter": 8, "page": 4, "title": "3. SecurityFilterChain — Trust Gate", "preview": "FIG-08-04. SecurityFilterChain — Trust Gate text DefaultFilter ↓ SecurityFilterChain ↓ JWT Verify ↓ Trusted Principal", "column": 2, "html": "<h2>3. SecurityFilterChain — Trust Gate<\/h2>\n<h3>FIG-08-04. SecurityFilterChain — Trust Gate<\/h3>\n<pre class=\"text-architecture\">DefaultFilter\n ↓\nSecurityFilterChain\n ↓\nJWT Verify\n ↓\nTrusted Principal\n ↓\nDispatcherServlet<\/pre>\n<p>Security는 MVC 이전의 Trust Gate입니다.<\/p>\n<p>여기서 Token이 검증되어야 이후 Controller가 신뢰된 Principal을 사용할 수 있습니다. 다만 현재 <code>pdmg-jwt<\/code>의 RS256 Issue와 Framework HMAC Verify Path는 정합성 GAP가 있습니다.<\/p>\n<p>또한 Principal이 <code>hdr_nhnis<\/code>의 사용자정보와 자동으로 동일하다고 가정하지 않습니다.<\/p>\n<hr>", "search": "3. securityfilterchain — trust gate fig-08-04. securityfilterchain — trust gate text defaultfilter ↓ securityfilterchain ↓ jwt verify ↓ trusted principal ↓ dispatcherservlet security는 mvc 이전의 trust gate입니다. 여기서 token이 검증되어야 이후 controller가 신뢰된 principal을 사용할 수 있습니다. 다만 현재 pdmg-jwt의 rs256 issue와 framework hmac verify path는 정합성 gap가 있습니다. 또한 principal이 hdrnhnis의 사용자정보와 자동으로 동일하다고 가정하지 않습니다. ---"}, {"id": "topic-8-5", "chapter": 8, "page": 5, "title": "4. ServiceId Resolution과 TCF", "preview": "FIG-08-05. ServiceId Resolution과 TCF text Context Header ↓ Request Header ↓ Path Variable ↓ ServiceId", "column": 2, "html": "<h2>4. ServiceId Resolution과 TCF<\/h2>\n<h3>FIG-08-05. ServiceId Resolution과 TCF<\/h3>\n<pre class=\"text-architecture\">Context Header\n ↓\nRequest Header\n ↓\nPath Variable\n ↓\nServiceId\n ↓\nTcfFacade\n ↓\nTransactionDispatcher<\/pre>\n<p>PDMG의 Runtime Routing Key는 ServiceId입니다.<\/p>\n<p>현재 Controller는 여러 Source에서 ServiceId를 얻을 수 있으므로, 값이 다를 때 어떻게 처리할지 명시적인 방어가 필요합니다. 단순 precedence만 있고 mismatch rejection이 없다면 잘못된 거래로 라우팅될 위험이 있습니다.<\/p>\n<p>따라서 ServiceId 일치검증은 PROPOSED Defense로 관리합니다.<\/p>\n<hr>", "search": "4. serviceid resolution과 tcf fig-08-05. serviceid resolution과 tcf text context header ↓ request header ↓ path variable ↓ serviceid ↓ tcffacade ↓ transactiondispatcher pdmg의 runtime routing key는 serviceid입니다. 현재 controller는 여러 source에서 serviceid를 얻을 수 있으므로, 값이 다를 때 어떻게 처리할지 명시적인 방어가 필요합니다. 단순 precedence만 있고 mismatch rejection이 없다면 잘못된 거래로 라우팅될 위험이 있습니다. 따라서 serviceid 일치검증은 proposed defense로 관리합니다. ---"}, {"id": "topic-8-6", "chapter": 8, "page": 6, "title": "5. Handler Registry", "preview": "FIG-08-06. Handler Registry text Spring Handlers ↓ startup Registry ServiceId → Handler ↓ Duplicate? ├─ YES → startup fail", "column": 2, "html": "<h2>5. Handler Registry<\/h2>\n<h3>FIG-08-06. Handler Registry<\/h3>\n<pre class=\"text-architecture\">Spring Handlers\n ↓ startup\nRegistry\n ServiceId → Handler\n ↓\nDuplicate?\n ├─ YES → startup fail\n └─ NO  → runtime route<\/pre>\n<p>Handler Registry는 기동 시 만들어지는 Runtime Routing Table입니다.<\/p>\n<p>Duplicate ServiceId는 기동오류로 처리하는 것이 안전합니다. 또한 <code>serviceIds()<\/code>에 등록된 ID와 <code>handle()<\/code> 내부 branch가 서로 일치해야 합니다.<\/p>\n<p>현재 Registry 13개와 UI Transaction Catalog 차이는 Drift 후보입니다.<\/p>\n<hr>", "search": "5. handler registry fig-08-06. handler registry text spring handlers ↓ startup registry serviceid → handler ↓ duplicate? ├─ yes → startup fail └─ no → runtime route handler registry는 기동 시 만들어지는 runtime routing table입니다. duplicate serviceid는 기동오류로 처리하는 것이 안전합니다. 또한 serviceids()에 등록된 id와 handle() 내부 branch가 서로 일치해야 합니다. 현재 registry 13개와 ui transaction catalog 차이는 drift 후보입니다. ---"}, {"id": "topic-8-7", "chapter": 8, "page": 7, "title": "6. Worker / Timeout", "preview": "FIG-08-07. Worker / Timeout text Request Thread ↓ submit pdmg-online-N ↓ pool-size 20 queue 100 deadline 5000ms", "column": 2, "html": "<h2>6. Worker / Timeout<\/h2>\n<h3>FIG-08-07. Worker / Timeout<\/h3>\n<pre class=\"text-architecture\">Request Thread\n ↓ submit\npdmg-online-N\n ↓\npool-size 20\nqueue 100\ndeadline 5000ms\n ↓\nBusiness<\/pre>\n<p>Timeout Mechanism은 Request Thread와 Worker Thread를 분리합니다.<\/p>\n<p>여기서 20/100/5000은 Current Snapshot이지 Target SLA가 아닙니다. 이 수치를 Capacity 목표로 그대로 승격하면 안 됩니다.<\/p>\n<p>Worker Pool은 Tomcat Thread Pool과도, Hikari Pool과도 다른 Resource입니다.<\/p>\n<hr>", "search": "6. worker / timeout fig-08-07. worker / timeout text request thread ↓ submit pdmg-online-n ↓ pool-size 20 queue 100 deadline 5000ms ↓ business timeout mechanism은 request thread와 worker thread를 분리합니다. 여기서 20/100/5000은 current snapshot이지 target sla가 아닙니다. 이 수치를 capacity 목표로 그대로 승격하면 안 됩니다. worker pool은 tomcat thread pool과도, hikari pool과도 다른 resource입니다. ---"}, {"id": "topic-8-8", "chapter": 8, "page": 8, "title": "7. TransactionTemplate", "preview": "FIG-08-08. TransactionTemplate text Worker ↓ TransactionTemplate BEGIN ↓ Dispatcher / Handler ↓ Facade @Transactional(REQUIRED)", "column": 2, "html": "<h2>7. TransactionTemplate<\/h2>\n<h3>FIG-08-08. TransactionTemplate<\/h3>\n<pre class=\"text-architecture\">Worker\n ↓\nTransactionTemplate BEGIN\n ↓\nDispatcher / Handler\n ↓\nFacade @Transactional(REQUIRED)\n ↓\nService / DAO\n ↓\nDeadline Check\n ↓\nCOMMIT / ROLLBACK<\/pre>\n<p>실제 DB Transaction은 Worker 안의 <code>TransactionTemplate<\/code>에서 시작됩니다.<\/p>\n<p>Facade의 <code>@Transactional(REQUIRED)<\/code>는 새로운 Transaction을 만드는 것보다 외부 Transaction에 참여할 수 있습니다.<\/p>\n<p>따라서 TCF ON/OFF에서 Facade를 공통 Business Boundary로 맞추는 것이 Transaction 일관성 측면에서도 중요합니다.<\/p>\n<hr>", "search": "7. transactiontemplate fig-08-08. transactiontemplate text worker ↓ transactiontemplate begin ↓ dispatcher / handler ↓ facade @transactional(required) ↓ service / dao ↓ deadline check ↓ commit / rollback 실제 db transaction은 worker 안의 transactiontemplate에서 시작됩니다. facade의 @transactional(required)는 새로운 transaction을 만드는 것보다 외부 transaction에 참여할 수 있습니다. 따라서 tcf on/off에서 facade를 공통 business boundary로 맞추는 것이 transaction 일관성 측면에서도 중요합니다. ---"}, {"id": "topic-8-9", "chapter": 8, "page": 9, "title": "8. Error/Response/Logging", "preview": "FIG-08-09. Error/Response/Logging text Exception ↓ GlobalExceptionHandler ↓ ErrorCode / HTTP ↓ hdrnhnis + result", "column": 1, "html": "<h2>8. Error/Response/Logging<\/h2>\n<h3>FIG-08-09. Error/Response/Logging<\/h3>\n<pre class=\"text-architecture\">Exception\n ↓\nGlobalExceptionHandler\n ↓\nErrorCode / HTTP\n ↓\nhdr_nhnis + result\n ↓\nResponse Advice\n ↓\nImageLog / MDC / Evidence<\/pre>\n<p>실패도 표준 흐름을 가져야 합니다.<\/p>\n<p>Known Error는 Taxonomy와 Envelope로 변환되지만 Filter/Security 단계의 Early Error는 MVC Advice를 우회할 수 있습니다. 이 때문에 Error Contract가 완전히 일관되지는 않습니다.<\/p>\n<p>Logging은 GUID/ServiceId로 연결하되 Token/Secret/민감 DTO를 기록하지 않는 원칙이 필요합니다.<\/p>\n<hr>", "search": "8. error/response/logging fig-08-09. error/response/logging text exception ↓ globalexceptionhandler ↓ errorcode / http ↓ hdrnhnis + result ↓ response advice ↓ imagelog / mdc / evidence 실패도 표준 흐름을 가져야 합니다. known error는 taxonomy와 envelope로 변환되지만 filter/security 단계의 early error는 mvc advice를 우회할 수 있습니다. 이 때문에 error contract가 완전히 일관되지는 않습니다. logging은 guid/serviceid로 연결하되 token/secret/민감 dto를 기록하지 않는 원칙이 필요합니다. ---"}, {"id": "topic-8-10", "chapter": 8, "page": 10, "title": "정상패턴과 금지패턴", "preview": "FIG-08-10. Normal Pattern text Filter→Security→TCF→Worker/TX→Facade→Service→DAO 정상패턴은 Framework가 Context/Security/Timeout/TX를 소유하고 Handler와 Controller가 공통 Facade를 통해 같은 Business Core를 실행하는 것…", "column": 3, "html": "<h2>정상패턴과 금지패턴<\/h2>\n<h3>FIG-08-10. Normal Pattern<\/h3>\n<pre class=\"text-architecture\">Filter→Security→TCF→Worker/TX→Facade→Service→DAO<\/pre>\n<p>정상패턴은 Framework가 Context/Security/Timeout/TX를 소유하고 Handler와 Controller가 공통 Facade를 통해 같은 Business Core를 실행하는 것입니다.<\/p>\n<h3>FIG-08-11. Forbidden Pattern<\/h3>\n<pre class=\"text-architecture\">Handler→DAO / TCF OFF Common Core 우회<\/pre>\n<p>Handler→DAO 직접호출, TCF OFF에서 Business Core 우회, Client Header를 Trusted Identity로 간주하는 구조는 금지/개선 대상으로 둡니다.<\/p>\n<hr>", "search": "정상패턴과 금지패턴 fig-08-10. normal pattern text filter→security→tcf→worker/tx→facade→service→dao 정상패턴은 framework가 context/security/timeout/tx를 소유하고 handler와 controller가 공통 facade를 통해 같은 business core를 실행하는 것입니다. fig-08-11. forbidden pattern text handler→dao / tcf off common core 우회 handler→dao 직접호출, tcf off에서 business core 우회, client header를 trusted identity로 간주하는 구조는 금지/개선 대상으로 둡니다. ---"}, {"id": "topic-8-11", "chapter": 8, "page": 11, "title": "Architecture Decision", "preview": "FIG-08-12. 주안과 대안 text [주안] Handler/Controller 모두 Common Facade VS [대안] TCF OFF Controller→Service Direct", "column": 3, "html": "<h2>Architecture Decision<\/h2>\n<h3>FIG-08-12. 주안과 대안<\/h3>\n<pre class=\"text-architecture\">[주안]\nHandler/Controller 모두 Common Facade\n\n        VS\n\n[대안]\nTCF OFF Controller→Service Direct<\/pre>\n<p>TCF ON Handler와 TCF OFF Controller가 모두 Common Facade를 호출하도록 Business Use Case Boundary를 통일합니다.<\/p>\n<p>OFF 경로에서 Service를 직접 호출하면 Transaction/AOP/정책 적용점이 달라져 두 Runtime의 Business 의미가 Drift할 수 있습니다.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>평가축<\/th><th>주안<\/th><th>대안<\/th><\/tr><\/thead><tbody><tr><td>책임/경계<\/td><td>명확<\/td><td>추가 보완 필요<\/td><\/tr><tr><td>Current PDMG 정합<\/td><td>높음<\/td><td>변경범위 가능<\/td><\/tr><tr><td>운영/장애분석<\/td><td>Trace 용이<\/td><td>복잡도 증가 가능<\/td><\/tr><tr><td>승인조건<\/td><td>기본 Rule/Test<\/td><td>별도 ADR + Evidence<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>", "search": "architecture decision fig-08-12. 주안과 대안 text [주안] handler/controller 모두 common facade vs [대안] tcf off controller→service direct tcf on handler와 tcf off controller가 모두 common facade를 호출하도록 business use case boundary를 통일합니다. off 경로에서 service를 직접 호출하면 transaction/aop/정책 적용점이 달라져 두 runtime의 business 의미가 drift할 수 있습니다. | 평가축 | 주안 | 대안 | |---|---|---| | 책임/경계 | 명확 | 추가 보완 필요 | | current pdmg 정합 | 높음 | 변경범위 가능 | | 운영/장애분석 | trace 용이 | 복잡도 증가 가능 | | 승인조건 | 기본 rule/test | 별도 adr + evidence | ---"}, {"id": "topic-8-12", "chapter": 8, "page": 12, "title": "Evidence / Conformance — 이 장의 Architecture를 무엇으로 증명하는가", "preview": "Evidence Architecture text 메커니즘 Architecture Rule ↓ Source Evidence ↓ Config Evidence ↓ Runtime / Deployment Evidence", "column": 2, "html": "<h2>Evidence / Conformance — 이 장의 Architecture를 무엇으로 증명하는가<\/h2>\n<h3>Evidence Architecture<\/h3>\n<pre class=\"text-architecture\">메커니즘 Architecture Rule\n        ↓\nSource Evidence\n        ↓\nConfig Evidence\n        ↓\nRuntime / Deployment Evidence\n        ↓\nConformance Test\n        ↓\nPASS / GAP / ADR<\/pre>\n<h4>Source Evidence<\/h4>\n<ul><li><code>[SOURCE]<\/code> DefaultFilter / ServiceContext / TCF / Dispatcher / Handler / GlobalExceptionHandler 분석<\/li><li><code>[SOURCE]<\/code> TCF ON/OFF Source 분석<\/li><\/ul>\n<h4>Config Evidence<\/h4>\n<ul><li><code>[CONFIG]<\/code> tcf.enabled=true<\/li><li><code>[CONFIG]<\/code> timeout.enabled=true<\/li><li><code>[CONFIG]<\/code> timeout=5000ms<\/li><li><code>[CONFIG]<\/code> pool-size=20<\/li><li><code>[CONFIG]<\/code> queue-capacity=100<\/li><li><code>[CONFIG]<\/code> legacy-web/filter enabled<\/li><\/ul>\n<h4>Runtime / Deployment Evidence<\/h4>\n<ul><li><code>[RUNTIME]<\/code> DefaultFilter→SecurityFilterChain→DispatcherServlet→Interceptor→Controller→TcfFacade→TimeoutExecutor→Worker TX→Dispatcher→Handler→Facade→Service→DAO→DB<\/li><\/ul>\n<h4>Architecture Decision<\/h4>\n<ul><li><code>[DECISION]<\/code> Framework=HOW / Business=WHAT<\/li><li><code>[DECISION]<\/code> TCF ON/OFF 공통 Facade Business Core<\/li><\/ul>\n<h4>Related ADR<\/h4>\n<ul><li><code>ADR-004 Common Facade<\/code><\/li><li><code>ADR-005 TCF Policy<\/code><\/li><li><code>ADR-009 Immutable Worker Context<\/code><\/li><li><code>ADR-017 Timeout Budget<\/code><\/li><\/ul>\n<h4>Current GAP / OPEN<\/h4>\n<ul><li><code>[GAP/OPEN]<\/code> Mutable Worker Context<\/li><li><code>[GAP/OPEN]<\/code> ServiceId mismatch defense<\/li><li><code>[GAP/OPEN]<\/code> TCF OFF Controller→Service Drift<\/li><li><code>[GAP/OPEN]<\/code> Early Error Envelope<\/li><li><code>[GAP/OPEN]<\/code> Generic Error Coverage<\/li><\/ul>\n<h3>이 장의 판정<\/h3>\n<pre class=\"text-architecture\">Architecture Definition\n        ↓\nPASS\n\nCurrent PDMG Conformance\n        ↓\nPARTIAL / GAP\n\nRuntime Evidence Coverage\n        ↓\nHIGH-MEDIUM\n\nArchitecture Definition PASS\n        ≠\nCurrent Implementation PASS<\/pre>\n<h4>PASS 전환조건<\/h4>\n<ul><li><code>JWT Verifier 정합<\/code><\/li><li><code>Immutable Worker Context<\/code><\/li><li><code>TCF OFF→Facade 정렬<\/code><\/li><li><code>ServiceId mismatch 방어<\/code><\/li><li><code>Error Envelope 정합<\/code><\/li><\/ul>\n<p>위 조건은 문서 완성도가 아니라 <strong>Current Implementation Conformance를 PASS로 전환하기 위한 Exit Criteria<\/strong>다. 해당 Evidence가 확보되기 전에는 <code>[GAP]<\/code>, <code>[OPEN]<\/code>, <code>[UNKNOWN]<\/code> 상태를 유지한다.<\/p>\n<hr>", "search": "evidence / conformance — 이 장의 architecture를 무엇으로 증명하는가 evidence architecture text 메커니즘 architecture rule ↓ source evidence ↓ config evidence ↓ runtime / deployment evidence ↓ conformance test ↓ pass / gap / adr source evidence - [source] defaultfilter / servicecontext / tcf / dispatcher / handler / globalexceptionhandler 분석 - [source] tcf on/off source 분석 config evidence - [config] tcf.enabled=true - [config] timeout.enabled=true - [config] timeout=5000ms - [config] pool-size=20 - [config] queue-capacity=100 - [config] legacy-web/filter enabled runtime / deployment evidence - [runtime] defaultfilter→securityfilterchain→dispatcherservlet→interceptor→controller→tcffacade→timeoutexecutor→worker tx→dispatcher→handler→facade→service→dao→db architecture decision - [decision] framework=how / business=what - [decision] tcf on/off 공통 facade business core related adr - adr-004 common facade - adr-005 tcf policy - adr-009 immutable worker context - adr-017 timeout budget current gap / open - [gap/open] mutable worker context - [gap/open] serviceid mismatch defense - [gap/open] tcf off controller→service drift - [gap/open] early error envelope - [gap/open] generic error coverage 이 장의 판정 text architecture definition ↓ pass current pdmg conformance ↓ partial / gap runtime evidence coverage ↓ high-medium architecture definition pass ≠ current implementation pass pass 전환조건 - jwt verifier 정합 - immutable worker context - tcf off→facade 정렬 - serviceid mismatch 방어 - error envelope 정합 위 조건은 문서 완성도가 아니라 current implementation conformance를 pass로 전환하기 위한 exit criteria다. 해당 evidence가 확보되기 전에는 [gap], [open], [unknown] 상태를 유지한다. ---"}, {"id": "topic-8-13", "chapter": 8, "page": 13, "title": "Chapter Closing Script", "preview": "FIG-08-16. 다음 장 Handoff text 메커니즘 ↓ 시스템은 서버가 아니라 표준과 실행규칙으로 움직인다 ↓ 남은 질문 \"정적인 Architecture를 거래 한 건의 시간축으로 펼쳐본다\" ↓", "column": 2, "html": "<h2>Chapter Closing Script<\/h2>\n<h3>FIG-08-16. 다음 장 Handoff<\/h3>\n<pre class=\"text-architecture\">메커니즘\n ↓\n시스템은 서버가 아니라 표준과 실행규칙으로 움직인다\n ↓\n남은 질문\n&quot;정적인 Architecture를 거래 한 건의 시간축으로 펼쳐본다&quot;\n ↓\n런타임 서비스<\/pre>\n<p>Mechanism은 실행규칙을 정의했습니다. 다음 장에서는 이 규칙을 거래 한 건의 시간축으로 펼쳐 Request Thread, Worker Thread, Transaction, DB, Timeout이 실제 어떻게 상호작용하는지 확인합니다.<\/p>", "search": "chapter closing script fig-08-16. 다음 장 handoff text 메커니즘 ↓ 시스템은 서버가 아니라 표준과 실행규칙으로 움직인다 ↓ 남은 질문 \"정적인 architecture를 거래 한 건의 시간축으로 펼쳐본다\" ↓ 런타임 서비스 mechanism은 실행규칙을 정의했습니다. 다음 장에서는 이 규칙을 거래 한 건의 시간축으로 펼쳐 request thread, worker thread, transaction, db, timeout이 실제 어떻게 상호작용하는지 확인합니다."}, {"id": "topic-9-1", "chapter": 9, "page": 1, "title": "0. Opening Script", "preview": "8장에서 실행규칙을 봤다면, 9장에서는 그 규칙이 실제 거래 한 건에서 어떤 순서로 움직이는지 봅니다. 이 장에서는 박스의 위치보다 시간이 중요합니다. Request Thread가 언제 Worker에게 일을 넘기고, Transaction이 언제 시작되고, DB가 늦어졌을 때 어떤 현상이 위로 전파되는지 시간축으로 펼칩니다. FIG-09-0…", "column": 2, "html": "<h2>0. Opening Script<\/h2>\n<p>8장에서 실행규칙을 봤다면, 9장에서는 그 규칙이 실제 거래 한 건에서 어떤 순서로 움직이는지 봅니다.<\/p>\n<p>이 장에서는 박스의 위치보다 <strong>시간<\/strong>이 중요합니다. Request Thread가 언제 Worker에게 일을 넘기고, Transaction이 언제 시작되고, DB가 늦어졌을 때 어떤 현상이 위로 전파되는지 시간축으로 펼칩니다.<\/p>\n<h3>FIG-09-01. 장 전체 Architecture<\/h3>\n<pre class=\"text-architecture\">════════ Request Thread ════════\nHTTP\n ↓\nFilter\n ↓\nSecurity\n ↓\nMVC / Controller\n ↓\nFuture.get(timeout)\n        │ submit\n        ▼\n════════ Worker Thread ═════════\nContext Install\n ↓\nTransaction BEGIN\n ↓\nDispatcher / Handler\n ↓\nFacade / Service / DAO\n ↓\nDB\n ↓\nDeadline\n ↓\nCommit / Rollback\n        │\n        ▼\nResponse / Evidence<\/pre>\n<p>Runtime에서는 8장의 정적인 Mechanism을 시간축으로 펼칩니다. 특히 <code>submit<\/code>을 기준으로 Request Thread와 Worker Thread가 갈라지고, DB Transaction은 Worker 쪽에서 시작됩니다. 이 차이를 이해해야 504, Overload, DB 지연을 정확히 해석할 수 있습니다.<\/p>\n<hr>", "search": "0. opening script 8장에서 실행규칙을 봤다면, 9장에서는 그 규칙이 실제 거래 한 건에서 어떤 순서로 움직이는지 봅니다. 이 장에서는 박스의 위치보다 시간이 중요합니다. request thread가 언제 worker에게 일을 넘기고, transaction이 언제 시작되고, db가 늦어졌을 때 어떤 현상이 위로 전파되는지 시간축으로 펼칩니다. fig-09-01. 장 전체 architecture text ════════ request thread ════════ http ↓ filter ↓ security ↓ mvc / controller ↓ future.get(timeout) │ submit ▼ ════════ worker thread ═════════ context install ↓ transaction begin ↓ dispatcher / handler ↓ facade / service / dao ↓ db ↓ deadline ↓ commit / rollback │ ▼ response / evidence runtime에서는 8장의 정적인 mechanism을 시간축으로 펼칩니다. 특히 submit을 기준으로 request thread와 worker thread가 갈라지고, db transaction은 worker 쪽에서 시작됩니다. 이 차이를 이해해야 504, overload, db 지연을 정확히 해석할 수 있습니다. ---"}, {"id": "topic-9-2", "chapter": 9, "page": 2, "title": "1. Request Thread 역할", "preview": "FIG-09-02. Request Thread 역할 text Request Thread ├─ Filter/Security/MVC ├─ Controller ├─ Worker submit ├─ Future wait └─ HTTP Response", "column": 2, "html": "<h2>1. Request Thread 역할<\/h2>\n<h3>FIG-09-02. Request Thread 역할<\/h3>\n<pre class=\"text-architecture\">Request Thread\n├─ Filter/Security/MVC\n├─ Controller\n├─ Worker submit\n├─ Future wait\n└─ HTTP Response<\/pre>\n<p>Request Thread는 HTTP와 MVC 수명을 담당합니다.<\/p>\n<p>Business Transaction 전체를 직접 수행하지 않고 Worker에게 위임하고 완료를 기다립니다. 이 분리가 Timeout의 의미를 복잡하게 만드는 동시에 Request Thread 보호장치가 됩니다.<\/p>\n<p>그래서 Request Thread의 종료와 Business 작업 종료를 같은 것으로 보면 안 됩니다.<\/p>\n<hr>", "search": "1. request thread 역할 fig-09-02. request thread 역할 text request thread ├─ filter/security/mvc ├─ controller ├─ worker submit ├─ future wait └─ http response request thread는 http와 mvc 수명을 담당합니다. business transaction 전체를 직접 수행하지 않고 worker에게 위임하고 완료를 기다립니다. 이 분리가 timeout의 의미를 복잡하게 만드는 동시에 request thread 보호장치가 됩니다. 그래서 request thread의 종료와 business 작업 종료를 같은 것으로 보면 안 됩니다. ---"}, {"id": "topic-9-3", "chapter": 9, "page": 3, "title": "2. Worker Thread 역할", "preview": "FIG-09-03. Worker Thread 역할 text pdmg-online-N ├─ Context Install ├─ Transaction BEGIN ├─ Dispatch ├─ Business ├─ DB ├─ Deadline", "column": 2, "html": "<h2>2. Worker Thread 역할<\/h2>\n<h3>FIG-09-03. Worker Thread 역할<\/h3>\n<pre class=\"text-architecture\">pdmg-online-N\n├─ Context Install\n├─ Transaction BEGIN\n├─ Dispatch\n├─ Business\n├─ DB\n├─ Deadline\n└─ Commit/Rollback<\/pre>\n<p>Worker는 Business Execution의 실제 주체입니다.<\/p>\n<p>Request Thread에서 캡처한 Context/MDC를 설치하고 Transaction을 시작한 뒤, Handler/Facade/Service/DAO를 실행합니다.<\/p>\n<p>작업이 끝나면 반드시 Worker Context를 clear해야 합니다.<\/p>\n<hr>", "search": "2. worker thread 역할 fig-09-03. worker thread 역할 text pdmg-online-n ├─ context install ├─ transaction begin ├─ dispatch ├─ business ├─ db ├─ deadline └─ commit/rollback worker는 business execution의 실제 주체입니다. request thread에서 캡처한 context/mdc를 설치하고 transaction을 시작한 뒤, handler/facade/service/dao를 실행합니다. 작업이 끝나면 반드시 worker context를 clear해야 합니다. ---"}, {"id": "topic-9-4", "chapter": 9, "page": 4, "title": "3. ServiceId Runtime Routing", "preview": "FIG-09-04. ServiceId Runtime Routing text Request ↓ ServiceId ↓ Registry ↓ Handler", "column": 1, "html": "<h2>3. ServiceId Runtime Routing<\/h2>\n<h3>FIG-09-04. ServiceId Runtime Routing<\/h3>\n<pre class=\"text-architecture\">Request\n ↓\nServiceId\n ↓\nRegistry\n ↓\nHandler\n ↓\nFacade Method\n ↓\nBusiness Use Case<\/pre>\n<p>Runtime에서 ServiceId는 단순 Header가 아니라 Routing Key입니다.<\/p>\n<p>잘못된 ServiceId는 잘못된 Handler로 연결되므로 Registry uniqueness와 Context/Header/Path 일치검증이 중요합니다.<\/p>\n<p>이 흐름은 Naming/Traceability 장과 연결됩니다.<\/p>\n<hr>", "search": "3. serviceid runtime routing fig-09-04. serviceid runtime routing text request ↓ serviceid ↓ registry ↓ handler ↓ facade method ↓ business use case runtime에서 serviceid는 단순 header가 아니라 routing key입니다. 잘못된 serviceid는 잘못된 handler로 연결되므로 registry uniqueness와 context/header/path 일치검증이 중요합니다. 이 흐름은 naming/traceability 장과 연결됩니다. ---"}, {"id": "topic-9-5", "chapter": 9, "page": 5, "title": "4. DB Runtime", "preview": "FIG-09-05. DB Runtime text Worker ↓ Transaction ↓ Hikari Connection ↓ JDBC Statement", "column": 2, "html": "<h2>4. DB Runtime<\/h2>\n<h3>FIG-09-05. DB Runtime<\/h3>\n<pre class=\"text-architecture\">Worker\n ↓\nTransaction\n ↓\nHikari Connection\n ↓\nJDBC Statement\n ↓\nDB Session\n ↓\nSQL / Wait / Result<\/pre>\n<p>DB에 도달하기까지도 여러 Resource Boundary가 있습니다.<\/p>\n<p>Worker가 있다고 Connection이 있는 것은 아니며, Connection이 있다고 DB가 즉시 응답하는 것도 아닙니다.<\/p>\n<p>성능문제는 이 체인을 따라 역으로 전파됩니다.<\/p>\n<hr>", "search": "4. db runtime fig-09-05. db runtime text worker ↓ transaction ↓ hikari connection ↓ jdbc statement ↓ db session ↓ sql / wait / result db에 도달하기까지도 여러 resource boundary가 있습니다. worker가 있다고 connection이 있는 것은 아니며, connection이 있다고 db가 즉시 응답하는 것도 아닙니다. 성능문제는 이 체인을 따라 역으로 전파됩니다. ---"}, {"id": "topic-9-6", "chapter": 9, "page": 6, "title": "5. Timeout 504", "preview": "FIG-09-06. Timeout 504 text Future.get(5000ms) ├─ complete → success └─ timeout ↓ cancel(true) ↓ HTTP 504", "column": 2, "html": "<h2>5. Timeout 504<\/h2>\n<h3>FIG-09-06. Timeout 504<\/h3>\n<pre class=\"text-architecture\">Future.get(5000ms)\n ├─ complete → success\n └─ timeout\n      ↓\n   cancel(true)\n      ↓\n   HTTP 504\n\nWorker may continue<\/pre>\n<p>504는 Client에게 보이는 결과일 뿐 내부작업의 종료증명이 아닙니다.<\/p>\n<p><code>cancel(true)<\/code>가 Interrupt를 전달해도 JDBC Driver나 DB가 즉시 취소되는지는 별도 Integration Test가 필요합니다.<\/p>\n<p>그래서 Query Timeout과 Transaction Deadline을 계층적으로 설계해야 합니다.<\/p>\n<hr>", "search": "5. timeout 504 fig-09-06. timeout 504 text future.get(5000ms) ├─ complete → success └─ timeout ↓ cancel(true) ↓ http 504 worker may continue 504는 client에게 보이는 결과일 뿐 내부작업의 종료증명이 아닙니다. cancel(true)가 interrupt를 전달해도 jdbc driver나 db가 즉시 취소되는지는 별도 integration test가 필요합니다. 그래서 query timeout과 transaction deadline을 계층적으로 설계해야 합니다. ---"}, {"id": "topic-9-7", "chapter": 9, "page": 7, "title": "6. Overload 503", "preview": "FIG-09-07. Overload 503 text Worker 20 ↓ Queue 100 ↓ Full ↓ Reject", "column": 2, "html": "<h2>6. Overload 503<\/h2>\n<h3>FIG-09-07. Overload 503<\/h3>\n<pre class=\"text-architecture\">Worker 20\n ↓\nQueue 100\n ↓\nFull\n ↓\nReject\n ↓\nOnlineOverloadException\n ↓\nHTTP 503<\/pre>\n<p>Overload는 느린 응답과 다르게 <strong>수용할 수 없는 부하를 빠르게 거절하는 정책<\/strong>입니다.<\/p>\n<p>Queue를 무한히 키우면 Timeout만 늘어납니다. 제한된 Worker/Queue와 503은 Backpressure의 일부입니다.<\/p>\n<p>Target Capacity는 부하시험으로 재산정해야 합니다.<\/p>\n<hr>", "search": "6. overload 503 fig-09-07. overload 503 text worker 20 ↓ queue 100 ↓ full ↓ reject ↓ onlineoverloadexception ↓ http 503 overload는 느린 응답과 다르게 수용할 수 없는 부하를 빠르게 거절하는 정책입니다. queue를 무한히 키우면 timeout만 늘어납니다. 제한된 worker/queue와 503은 backpressure의 일부입니다. target capacity는 부하시험으로 재산정해야 합니다. ---"}, {"id": "topic-9-8", "chapter": 9, "page": 8, "title": "7. Saturation Cascade", "preview": "FIG-09-08. Saturation Cascade text DB Slow ↓ Hikari Pending ↓ Worker Occupied ↓ Queue Increase", "column": 2, "html": "<h2>7. Saturation Cascade<\/h2>\n<h3>FIG-09-08. Saturation Cascade<\/h3>\n<pre class=\"text-architecture\">DB Slow\n ↓\nHikari Pending\n ↓\nWorker Occupied\n ↓\nQueue Increase\n ↓\nRequest Wait\n ↓\n504 / 503<\/pre>\n<p>이 그림이 Runtime 장의 핵심 Failure Story입니다.<\/p>\n<p>DB가 느리면 DB만 느린 것이 아니라 Connection, Worker, Queue, Request Thread로 영향이 올라옵니다.<\/p>\n<p>따라서 Capacity는 Tomcat <code>maxThreads<\/code> 하나로 결정할 수 없습니다.<\/p>\n<hr>", "search": "7. saturation cascade fig-09-08. saturation cascade text db slow ↓ hikari pending ↓ worker occupied ↓ queue increase ↓ request wait ↓ 504 / 503 이 그림이 runtime 장의 핵심 failure story입니다. db가 느리면 db만 느린 것이 아니라 connection, worker, queue, request thread로 영향이 올라옵니다. 따라서 capacity는 tomcat maxthreads 하나로 결정할 수 없습니다. ---"}, {"id": "topic-9-9", "chapter": 9, "page": 9, "title": "8. Runtime Evidence", "preview": "FIG-09-09. Runtime Evidence text GUID + ServiceId + Thread + SqlId + ErrorCode + elapsed + deploymentId", "column": 2, "html": "<h2>8. Runtime Evidence<\/h2>\n<h3>FIG-09-09. Runtime Evidence<\/h3>\n<pre class=\"text-architecture\">GUID\n+ ServiceId\n+ Thread\n+ SqlId\n+ ErrorCode\n+ elapsed\n+ deploymentId\n+ host/jvm\n ↓\nEvidence<\/pre>\n<p>Runtime을 설계했다면 마지막에는 증적이 남아야 합니다.<\/p>\n<p>현재 GUID/ServiceId/MDC/ImageLog는 강한 기반입니다. 여기에 DeploymentId, Host/JVM, SqlId를 연결하면 Source부터 Runtime까지 추적할 수 있습니다.<\/p>\n<p>이 연결이 자동화되어야 HG90 Gate가 실제로 동작합니다.<\/p>\n<hr>", "search": "8. runtime evidence fig-09-09. runtime evidence text guid + serviceid + thread + sqlid + errorcode + elapsed + deploymentid + host/jvm ↓ evidence runtime을 설계했다면 마지막에는 증적이 남아야 합니다. 현재 guid/serviceid/mdc/imagelog는 강한 기반입니다. 여기에 deploymentid, host/jvm, sqlid를 연결하면 source부터 runtime까지 추적할 수 있습니다. 이 연결이 자동화되어야 hg90 gate가 실제로 동작합니다. ---"}, {"id": "topic-9-10", "chapter": 9, "page": 10, "title": "정상패턴과 금지패턴", "preview": "FIG-09-10. Normal Pattern text Request→Worker→TX→DB→Response/Evidence 정상패턴은 Request와 Worker의 수명을 구분하고, Resource Chain 전체에 Backpressure와 계층형 Timeout을 적용하는 것입니다. FIG-09-11. Forbidden Pattern", "column": 3, "html": "<h2>정상패턴과 금지패턴<\/h2>\n<h3>FIG-09-10. Normal Pattern<\/h3>\n<pre class=\"text-architecture\">Request→Worker→TX→DB→Response/Evidence<\/pre>\n<p>정상패턴은 Request와 Worker의 수명을 구분하고, Resource Chain 전체에 Backpressure와 계층형 Timeout을 적용하는 것입니다.<\/p>\n<h3>FIG-09-11. Forbidden Pattern<\/h3>\n<pre class=\"text-architecture\">504=Worker 종료 / Worker=DB Session<\/pre>\n<p>HTTP 504를 Worker 종료나 DB Rollback 완료로 해석하거나 Queue를 무한 확장해 부하를 숨기는 방식을 금지합니다.<\/p>\n<hr>", "search": "정상패턴과 금지패턴 fig-09-10. normal pattern text request→worker→tx→db→response/evidence 정상패턴은 request와 worker의 수명을 구분하고, resource chain 전체에 backpressure와 계층형 timeout을 적용하는 것입니다. fig-09-11. forbidden pattern text 504=worker 종료 / worker=db session http 504를 worker 종료나 db rollback 완료로 해석하거나 queue를 무한 확장해 부하를 숨기는 방식을 금지합니다. ---"}, {"id": "topic-9-11", "chapter": 9, "page": 11, "title": "Architecture Decision", "preview": "FIG-09-12. 주안과 대안 text [주안] Request/Worker 분리 + 계층형 Timeout VS [대안] Request Thread 단일 실행", "column": 2, "html": "<h2>Architecture Decision<\/h2>\n<h3>FIG-09-12. 주안과 대안<\/h3>\n<pre class=\"text-architecture\">[주안]\nRequest/Worker 분리 + 계층형 Timeout\n\n        VS\n\n[대안]\nRequest Thread 단일 실행<\/pre>\n<p>Request/Worker 분리 구조를 유지하면서 DB Query Timeout부터 Client Timeout까지 계층형 Budget을 정의하는 것을 주안으로 합니다.<\/p>\n<p>단일 Request Thread에서 모든 작업을 실행하면 구조는 단순하지만 Slow DB가 HTTP Thread를 직접 점유해 Saturation 전파가 빨라질 수 있습니다.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>평가축<\/th><th>주안<\/th><th>대안<\/th><\/tr><\/thead><tbody><tr><td>책임/경계<\/td><td>명확<\/td><td>추가 보완 필요<\/td><\/tr><tr><td>Current PDMG 정합<\/td><td>높음<\/td><td>변경범위 가능<\/td><\/tr><tr><td>운영/장애분석<\/td><td>Trace 용이<\/td><td>복잡도 증가 가능<\/td><\/tr><tr><td>승인조건<\/td><td>기본 Rule/Test<\/td><td>별도 ADR + Evidence<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>", "search": "architecture decision fig-09-12. 주안과 대안 text [주안] request/worker 분리 + 계층형 timeout vs [대안] request thread 단일 실행 request/worker 분리 구조를 유지하면서 db query timeout부터 client timeout까지 계층형 budget을 정의하는 것을 주안으로 합니다. 단일 request thread에서 모든 작업을 실행하면 구조는 단순하지만 slow db가 http thread를 직접 점유해 saturation 전파가 빨라질 수 있습니다. | 평가축 | 주안 | 대안 | |---|---|---| | 책임/경계 | 명확 | 추가 보완 필요 | | current pdmg 정합 | 높음 | 변경범위 가능 | | 운영/장애분석 | trace 용이 | 복잡도 증가 가능 | | 승인조건 | 기본 rule/test | 별도 adr + evidence | ---"}, {"id": "topic-9-12", "chapter": 9, "page": 12, "title": "Evidence / Conformance — 이 장의 Architecture를 무엇으로 증명하는가", "preview": "Evidence Architecture text 런타임 서비스 Architecture Rule ↓ Source Evidence ↓ Config Evidence ↓ Runtime / Deployment Evidence", "column": 2, "html": "<h2>Evidence / Conformance — 이 장의 Architecture를 무엇으로 증명하는가<\/h2>\n<h3>Evidence Architecture<\/h3>\n<pre class=\"text-architecture\">런타임 서비스 Architecture Rule\n        ↓\nSource Evidence\n        ↓\nConfig Evidence\n        ↓\nRuntime / Deployment Evidence\n        ↓\nConformance Test\n        ↓\nPASS / GAP / ADR<\/pre>\n<h4>Source Evidence<\/h4>\n<ul><li><code>[SOURCE]<\/code> OnlineTimeoutExecutor / TransactionTemplate / TransactionDispatcher / Handler Source 분석<\/li><li><code>[SOURCE]<\/code> GlobalExceptionHandler 및 Runtime 흐름 분석<\/li><\/ul>\n<h4>Config Evidence<\/h4>\n<ul><li><code>[CONFIG]<\/code> timeout 5000ms / worker 20 / queue 100<\/li><li><code>[CONFIG]<\/code> Query Timeout/Hikari exact target 값 미확정<\/li><\/ul>\n<h4>Runtime / Deployment Evidence<\/h4>\n<ul><li><code>[RUNTIME]<\/code> Request Thread와 Worker Thread 분리<\/li><li><code>[RUNTIME]<\/code> HTTP 504 ≠ Worker 종료 ≠ JDBC Cancel ≠ Rollback 완료<\/li><li><code>[RUNTIME]<\/code> 503 Overload Backpressure<\/li><\/ul>\n<h4>Architecture Decision<\/h4>\n<ul><li><code>[DECISION]<\/code> DB Query Timeout &lt; Worker/Transaction Deadline &lt; Downstream/Server &lt; Client Timeout<\/li><\/ul>\n<h4>Related ADR<\/h4>\n<ul><li><code>ADR-017 Timeout Budget<\/code><\/li><li><code>ADR-018 Retry/Idempotency<\/code><\/li><li><code>ADR-029 Capacity Budget<\/code><\/li><li><code>ADR-040 Runtime Evidence<\/code><\/li><\/ul>\n<h4>Current GAP / OPEN<\/h4>\n<ul><li><code>[GAP/OPEN]<\/code> JDBC Query Timeout<\/li><li><code>[GAP/OPEN]<\/code> JDBC Cancel Evidence<\/li><li><code>[GAP/OPEN]<\/code> Late Worker<\/li><li><code>[GAP/OPEN]<\/code> Deployment/Host Correlation<\/li><li><code>[GAP/OPEN]<\/code> Identity Binding<\/li><\/ul>\n<h3>이 장의 판정<\/h3>\n<pre class=\"text-architecture\">Architecture Definition\n        ↓\nPASS\n\nCurrent PDMG Conformance\n        ↓\nPARTIAL / CONDITIONAL\n\nRuntime Evidence Coverage\n        ↓\nHIGH-MEDIUM\n\nArchitecture Definition PASS\n        ≠\nCurrent Implementation PASS<\/pre>\n<h4>PASS 전환조건<\/h4>\n<ul><li><code>DB Query Timeout<\/code><\/li><li><code>JDBC Cancel/Late Worker Test<\/code><\/li><li><code>Overload/Capacity Test<\/code><\/li><li><code>Deployment Correlation<\/code><\/li><\/ul>\n<p>위 조건은 문서 완성도가 아니라 <strong>Current Implementation Conformance를 PASS로 전환하기 위한 Exit Criteria<\/strong>다. 해당 Evidence가 확보되기 전에는 <code>[GAP]<\/code>, <code>[OPEN]<\/code>, <code>[UNKNOWN]<\/code> 상태를 유지한다.<\/p>\n<hr>", "search": "evidence / conformance — 이 장의 architecture를 무엇으로 증명하는가 evidence architecture text 런타임 서비스 architecture rule ↓ source evidence ↓ config evidence ↓ runtime / deployment evidence ↓ conformance test ↓ pass / gap / adr source evidence - [source] onlinetimeoutexecutor / transactiontemplate / transactiondispatcher / handler source 분석 - [source] globalexceptionhandler 및 runtime 흐름 분석 config evidence - [config] timeout 5000ms / worker 20 / queue 100 - [config] query timeout/hikari exact target 값 미확정 runtime / deployment evidence - [runtime] request thread와 worker thread 분리 - [runtime] http 504 ≠ worker 종료 ≠ jdbc cancel ≠ rollback 완료 - [runtime] 503 overload backpressure architecture decision - [decision] db query timeout < worker/transaction deadline < downstream/server < client timeout related adr - adr-017 timeout budget - adr-018 retry/idempotency - adr-029 capacity budget - adr-040 runtime evidence current gap / open - [gap/open] jdbc query timeout - [gap/open] jdbc cancel evidence - [gap/open] late worker - [gap/open] deployment/host correlation - [gap/open] identity binding 이 장의 판정 text architecture definition ↓ pass current pdmg conformance ↓ partial / conditional runtime evidence coverage ↓ high-medium architecture definition pass ≠ current implementation pass pass 전환조건 - db query timeout - jdbc cancel/late worker test - overload/capacity test - deployment correlation 위 조건은 문서 완성도가 아니라 current implementation conformance를 pass로 전환하기 위한 exit criteria다. 해당 evidence가 확보되기 전에는 [gap], [open], [unknown] 상태를 유지한다. ---"}, {"id": "topic-9-13", "chapter": 9, "page": 13, "title": "Chapter Closing Script", "preview": "FIG-09-16. 다음 장 Handoff text 런타임 서비스 ↓ 정적인 Architecture를 거래 한 건의 시간축으로 펼쳐본다 ↓ 남은 질문 \"RDW는 실시간을 지키고 ADW는 분석을 극대화한다\" ↓", "column": 2, "html": "<h2>Chapter Closing Script<\/h2>\n<h3>FIG-09-16. 다음 장 Handoff<\/h3>\n<pre class=\"text-architecture\">런타임 서비스\n ↓\n정적인 Architecture를 거래 한 건의 시간축으로 펼쳐본다\n ↓\n남은 질문\n&quot;RDW는 실시간을 지키고 ADW는 분석을 극대화한다&quot;\n ↓\n데이터플랫폼<\/pre>\n<p>Runtime을 시간축으로 보면 성능과 장애가 어디서 전파되는지 설명할 수 있습니다. 다음 장에서는 그 Runtime의 최종 대상인 Data를 Operational과 Analytical Workload로 분리합니다.<\/p>", "search": "chapter closing script fig-09-16. 다음 장 handoff text 런타임 서비스 ↓ 정적인 architecture를 거래 한 건의 시간축으로 펼쳐본다 ↓ 남은 질문 \"rdw는 실시간을 지키고 adw는 분석을 극대화한다\" ↓ 데이터플랫폼 runtime을 시간축으로 보면 성능과 장애가 어디서 전파되는지 설명할 수 있습니다. 다음 장에서는 그 runtime의 최종 대상인 data를 operational과 analytical workload로 분리합니다."}, {"id": "topic-10-1", "chapter": 10, "page": 1, "title": "0. Opening Script", "preview": "Runtime의 끝에는 항상 Data가 있습니다. 하지만 Data Architecture를 DB 목록으로 끝내면 안 됩니다. 이 장에서는 어떤 Data가 누구의 소유인지, Online Workload와 Analytical Workload를 어디에서 분리할지, ServiceId에서 Table까지 어떻게 Trace할지를 봅니다. FIG-10-…", "column": 0, "html": "<h2>0. Opening Script<\/h2>\n<p>Runtime의 끝에는 항상 Data가 있습니다. 하지만 Data Architecture를 DB 목록으로 끝내면 안 됩니다.<\/p>\n<p>이 장에서는 <strong>어떤 Data가 누구의 소유인지, Online Workload와 Analytical Workload를 어디에서 분리할지, ServiceId에서 Table까지 어떻게 Trace할지<\/strong>를 봅니다.<\/p>\n<h3>FIG-10-01. 장 전체 Architecture<\/h3>\n<pre class=\"text-architecture\">PDMG Online\n ↓\nService\n ↓\nDAO / Mapper / SqlId\n ↓\nRDW\n ↓\nOperational\n\nNSIGHT Analytics\nSource / RDW\n ↓\nETL / Data Movement\n ↓\nADW\n ↓\nBI / Heavy Analysis<\/pre>\n<p>Data Platform은 DB 목록이 아니라 Workload와 Ownership을 설계하는 장입니다. PDMG Current의 RDW 경로와 NSIGHT Target의 ADW/CDC/ETL을 구분하고, ServiceId에서 SqlId와 Table까지 추적 가능한 Data Lineage를 목표로 합니다.<\/p>\n<hr>", "search": "0. opening script runtime의 끝에는 항상 data가 있습니다. 하지만 data architecture를 db 목록으로 끝내면 안 됩니다. 이 장에서는 어떤 data가 누구의 소유인지, online workload와 analytical workload를 어디에서 분리할지, serviceid에서 table까지 어떻게 trace할지를 봅니다. fig-10-01. 장 전체 architecture text pdmg online ↓ service ↓ dao / mapper / sqlid ↓ rdw ↓ operational nsight analytics source / rdw ↓ etl / data movement ↓ adw ↓ bi / heavy analysis data platform은 db 목록이 아니라 workload와 ownership을 설계하는 장입니다. pdmg current의 rdw 경로와 nsight target의 adw/cdc/etl을 구분하고, serviceid에서 sqlid와 table까지 추적 가능한 data lineage를 목표로 합니다. ---"}, {"id": "topic-10-2", "chapter": 10, "page": 2, "title": "1. Data Architecture vs DB", "preview": "FIG-10-02. Data Architecture vs DB text Data Architecture Ownership / Flow / Quality / Security / Lifecycle ↓ DB Architecture Schema / Instance / HA / Storage", "column": 2, "html": "<h2>1. Data Architecture vs DB<\/h2>\n<h3>FIG-10-02. Data Architecture vs DB<\/h3>\n<pre class=\"text-architecture\">Data Architecture\nOwnership / Flow / Quality / Security / Lifecycle\n        ↓\nDB Architecture\nSchema / Instance / HA / Storage<\/pre>\n<p>Data Architecture는 Database Architecture보다 상위개념입니다.<\/p>\n<p>어디에 저장하는지보다 누가 소유하고 어떤 업무가 사용하며 어떤 품질/보안정책을 적용할지가 먼저입니다.<\/p>\n<p>DB 제품과 Instance는 그 정책을 구현하는 수단입니다.<\/p>\n<hr>", "search": "1. data architecture vs db fig-10-02. data architecture vs db text data architecture ownership / flow / quality / security / lifecycle ↓ db architecture schema / instance / ha / storage data architecture는 database architecture보다 상위개념입니다. 어디에 저장하는지보다 누가 소유하고 어떤 업무가 사용하며 어떤 품질/보안정책을 적용할지가 먼저입니다. db 제품과 instance는 그 정책을 구현하는 수단입니다. ---"}, {"id": "topic-10-3", "chapter": 10, "page": 3, "title": "2. PDMG Current Data Access", "preview": "FIG-10-03. PDMG Current Data Access text Handler ↓ Facade ↓ Service ↓ DAO", "column": 0, "html": "<h2>2. PDMG Current Data Access<\/h2>\n<h3>FIG-10-03. PDMG Current Data Access<\/h3>\n<pre class=\"text-architecture\">Handler\n ↓\nFacade\n ↓\nService\n ↓\nDAO\n ↓\nMapper\n ↓\nJDBC\n ↓\nRDW / DB<\/pre>\n<p>PDMG Current에서 가장 강하게 확인되는 Data Access는 MyBatis/JDBC를 통한 RDW/DB 경로입니다.<\/p>\n<p>이 구조를 AS-IS Backbone으로 두고 ADW나 External Data는 별도 Inventory로 확인합니다.<\/p>\n<p>확인되지 않은 ADW 직접접근을 Current로 그리지 않습니다.<\/p>\n<hr>", "search": "2. pdmg current data access fig-10-03. pdmg current data access text handler ↓ facade ↓ service ↓ dao ↓ mapper ↓ jdbc ↓ rdw / db pdmg current에서 가장 강하게 확인되는 data access는 mybatis/jdbc를 통한 rdw/db 경로입니다. 이 구조를 as-is backbone으로 두고 adw나 external data는 별도 inventory로 확인합니다. 확인되지 않은 adw 직접접근을 current로 그리지 않습니다. ---"}, {"id": "topic-10-4", "chapter": 10, "page": 4, "title": "3. RDW 역할", "preview": "FIG-10-04. RDW 역할 text Online Service ↓ RDW Operational / Near-real-time ↓ bounded latency", "column": 2, "html": "<h2>3. RDW 역할<\/h2>\n<h3>FIG-10-04. RDW 역할<\/h3>\n<pre class=\"text-architecture\">Online Service\n ↓\nRDW\nOperational / Near-real-time\n ↓\nbounded latency<\/pre>\n<p>RDW는 Online/Operational Workload를 지키는 영역으로 봅니다.<\/p>\n<p>여기에는 즉시 조회·거래에 필요한 데이터가 집중되고, Heavy Analysis가 자원을 독점하지 않도록 해야 합니다.<\/p>\n<p>실제 Table/Schema Ownership은 추가 Registry가 필요합니다.<\/p>\n<hr>", "search": "3. rdw 역할 fig-10-04. rdw 역
