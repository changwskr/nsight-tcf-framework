<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INF-910 Checklist · pdmg-infra</title>
  <link rel="stylesheet" href="/_shared/infra.css?v=nav1">
</head>
<body>
  <div class="infra-shell">
    <aside class="infra-sidebar">
      <div class="infra-sidebar__brand"><h1>인프라 아키텍처 관리</h1><p>INF-910 Checklist</p></div>
      <nav id="infraNav" class="infra-sidebar__nav" aria-label="화면 메뉴"></nav>
      <div class="infra-sidebar__foot">ifina9100S0/U0</div>
    </aside>
    <div class="infra-main">
      <header class="infra-topbar">
        <div><h1>INF-910 Checklist</h1><p>대상별 실사 체크 진행률을 관리합니다.</p></div>
        <span class="badge" id="progressBadge">0%</span>
      </header>
      <section class="toolbar">
        <div class="field"><label for="targetType">대상유형</label>
          <select id="targetType"><option value="ASSET" selected>ASSET</option><option value="GROUP">GROUP</option><option value="APP">APP</option></select>
        </div>
        <div class="field field-wide"><label for="targetId">대상 ID</label><select id="targetId" data-combo-type-src="targetTypeCd" data-empty="선택"></select></div>
        <div class="actions">
          <button class="btn-secondary" type="button" id="searchBtn">조회</button>
          <button class="btn-primary" type="button" id="saveBtn">저장</button>
        </div>
      </section>
      <section class="response-meta" id="resultMeta">조회를 실행하세요.</section>
      <section class="panel">
        <div class="panel-head"><h2>체크 항목</h2><span class="group-tag" id="resultCount">0건</span></div>
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>체크</th><th>ID</th><th>항목</th><th>Severity</th><th>비고</th></tr></thead>
            <tbody id="resultBody"><tr><td colspan="5" class="empty">데이터 없음</td></tr></tbody>
          </table>
        </div>
      </section>
    </div>
  </div>
  <script src="/_shared/error-codes.js"></script>
  <script src="/_shared/error-popup.js"></script>
  <script src="/_shared/infra-api.js"></script>
  <script src="/_shared/infra-nav.js?v=nav1"></script>
  <script src="/_shared/infra-combo.js"></script>
  <script src="/infra/checklist/checklist.js"></script>
</body>
</html>
