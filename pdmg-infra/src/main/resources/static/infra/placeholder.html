<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>화면 준비중 · pdmg-infra</title>
  <link rel="stylesheet" href="/_shared/infra.css">
</head>
<body>
  <div class="infra-shell">
    <aside class="infra-sidebar">
      <div class="infra-sidebar__brand">
        <h1>인프라 아키텍처 관리</h1>
        <p>후속 화면 플레이스홀더</p>
      </div>
      <nav id="infraNav" class="infra-sidebar__nav" aria-label="화면 메뉴"></nav>
      <div class="infra-sidebar__foot">placeholder</div>
    </aside>
    <div class="infra-main">
      <header class="infra-topbar">
        <div>
          <h1 id="screenTitle">화면 준비중</h1>
          <p>화면·서비스·DB 설계서에 정의된 메뉴입니다. Phase 순서에 따라 구현합니다.</p>
        </div>
      </header>
      <div class="notice" id="notice">
        이 화면은 아직 연결되지 않았습니다.
      </div>
    </div>
  </div>
  <script src="/_shared/infra-nav.js?v=nav1"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const id = params.get('id') || 'INF-???';
    const map = {
      'INF-010': '통합 대시보드',
      'INF-020': '리스크·Gate 워크리스트'
    };
    document.getElementById('screenTitle').textContent = id + (map[id] ? ' · ' + map[id] : '');
    document.getElementById('notice').textContent =
      id + ' 화면은 설계서에 정의되어 있으며, 현재 빌드에서는 플레이스홀더입니다.';
    if (document.body) document.body.setAttribute('data-nav-active', id);
    if (window.InfraNav) InfraNav.boot();
  </script>
</body>
</html>
