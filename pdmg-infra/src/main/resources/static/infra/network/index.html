<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INF-510 Network · pdmg-infra</title>
  <link rel="stylesheet" href="/_shared/infra.css?v=nav1">
</head>
<body>
  <div class="infra-shell">
    <aside class="infra-sidebar">
      <div class="infra-sidebar__brand"><h1>인프라 아키텍처 관리</h1><p>INF-510 Network Endpoint</p></div>
      <nav id="infraNav" class="infra-sidebar__nav" aria-label="화면 메뉴"></nav>
      <div class="infra-sidebar__foot">ifina5100* · TB_IF_NETWORK_EP_PILOT · RL-NT-001</div>
    </aside>
    <div class="infra-main">
      <header class="infra-topbar">
        <div><h1>INF-510 Network Endpoint</h1><p>자산 Endpoint. Primary 단일화 · address+port 중복 차단.</p></div>
        <span class="badge">scid=INF-510</span>
      </header>
      <section class="toolbar">
        <div class="field field-wide"><label for="keyword">검색</label><input id="keyword" placeholder="EP ID/자산/주소"></div>
        <div class="field"><label for="assetId">자산</label><select id="assetId" data-combo="assets" data-empty="전체"></select></div>
        <div class="field"><label for="pageSize">페이지</label><select id="pageSize"><option value="10" selected>10</option><option value="20">20</option></select></div>
        <div class="actions">
          <button class="btn-secondary" type="button" id="searchBtn">조회</button>
          <button class="btn-primary" type="button" id="addBtn">신규</button>
        </div>
      </section>
      <section class="response-meta" id="resultMeta">조회를 실행하세요.</section>
      <section class="panel">
        <div class="panel-head"><h2>Network Endpoint</h2><span class="group-tag" id="resultCount">0건</span></div>
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>EP ID</th><th>자산</th><th>유형</th><th>주소</th><th>포트</th><th>Primary</th><th></th></tr></thead>
            <tbody id="resultBody"><tr><td colspan="7" class="empty">데이터 없음</td></tr></tbody>
          </table>
        </div>
        <div class="pager">
          <button class="btn-secondary" type="button" id="prevPageBtn" disabled>이전</button>
          <span id="pageInfo">1 / 1</span>
          <button class="btn-secondary" type="button" id="nextPageBtn" disabled>다음</button>
        </div>
      </section>
    </div>
  </div>
  <div class="modal" id="editModal" hidden>
    <div class="modal-backdrop" data-close="true"></div>
    <div class="modal-card">
      <div class="panel-head"><h2 id="editTitle">Endpoint 등록</h2><button class="btn-secondary" type="button" data-close="true">닫기</button></div>
      <div class="modal-body">
        <div class="field"><label for="formEndpointId">EP ID *</label><input id="formEndpointId"></div>
        <div class="field"><label for="formAssetId">자산 *</label><select id="formAssetId" data-combo="assets" data-selected=""></select></div>
        <div class="field"><label for="formEndpointTypeCd">유형</label><select id="formEndpointTypeCd"><option>IP</option><option>VIP</option><option>MGMT</option><option>DNS</option></select></div>
        <div class="field"><label for="formAddress">주소 *</label><input id="formAddress"></div>
        <div class="field"><label for="formPortNo">포트</label><input id="formPortNo"></div>
        <div class="field"><label for="formProtocolCd">프로토콜</label><select id="formProtocolCd"><option>TCP</option><option>UDP</option><option>HTTPS</option><option>HTTP</option></select></div>
        <div class="field"><label for="formPrimaryYn">Primary</label><select id="formPrimaryYn"><option>N</option><option>Y</option></select></div>
        <div class="field field-span"><label for="formRemark">비고</label><input id="formRemark"></div>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" type="button" data-close="true">취소</button>
        <button class="btn-primary" type="button" id="saveBtn">저장</button>
      </div>
    </div>
  </div>
  <script src="/_shared/error-codes.js"></script>
  <script src="/_shared/error-popup.js"></script>
  <script src="/_shared/infra-api.js"></script>
  <script src="/_shared/infra-nav.js?v=nav1"></script>
  <script src="/_shared/infra-combo.js"></script>
  <script src="/infra/network/network.js"></script>
</body>
</html>
