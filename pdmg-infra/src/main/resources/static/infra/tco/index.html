<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INF-730 TCO · pdmg-infra</title>
  <link rel="stylesheet" href="/_shared/infra.css?v=nav1">
</head>
<body>
  <div class="infra-shell">
    <aside class="infra-sidebar">
      <div class="infra-sidebar__brand"><h1>인프라 아키텍처 관리</h1><p>INF-730 TCO</p></div>
      <nav id="infraNav" class="infra-sidebar__nav" aria-label="화면 메뉴"></nav>
      <div class="infra-sidebar__foot">ifina7300* · 5Y TCO</div>
    </aside>
    <div class="infra-main">
      <header class="infra-topbar">
        <div><h1>INF-730 비용·TCO</h1><p>AS-IS / TO-BE 연간 + MIG 일회성 → N년 TCO.</p></div>
        <div class="actions">
          <button class="btn-secondary" type="button" id="searchBtn">조회</button>
          <button class="btn-primary" type="button" id="addBtn">비용 등록</button>
        </div>
      </header>
      <section class="toolbar">
        <div class="field"><label for="targetId">Target</label><select id="targetId" data-combo="systems" data-selected="SYS-MKTG"></select></div>
        <div class="field"><label for="periodYm">Period</label><input id="periodYm" value="202608"></div>
        <div class="field"><label for="years">Years</label><input id="years" type="number" value="5" min="1" max="10"></div>
      </section>
      <section class="response-meta" id="resultMeta">조회를 실행하세요.</section>
      <section class="panel">
        <div class="panel-head"><h2>TCO Summary</h2><span class="group-tag" id="sumTag"></span></div>
        <div class="table-wrap"><table class="data-table"><thead>
          <tr><th>AS-IS 연간</th><th>TO-BE 연간</th><th>MIG 일회</th><th>AS-IS TCO</th><th>TO-BE TCO</th><th>Delta(절감)</th></tr>
        </thead><tbody id="sumBody"><tr><td colspan="6" class="empty">-</td></tr></tbody></table></div>
      </section>
      <section class="panel">
        <div class="panel-head"><h2>Cost Snapshots</h2></div>
        <div class="table-wrap"><table class="data-table"><thead>
          <tr><th>ID</th><th>Scenario</th><th>Type</th><th>Amount</th><th>Remark</th></tr>
        </thead><tbody id="rowBody"><tr><td colspan="5" class="empty">-</td></tr></tbody></table></div>
      </section>
    </div>
  </div>
  <div class="modal" id="editModal" hidden>
    <div class="modal-backdrop" data-close="true"></div>
    <div class="modal-card">
      <div class="panel-head"><h2>비용 Snapshot 등록</h2><button class="btn-secondary" type="button" data-close="true">닫기</button></div>
      <div class="modal-body">
        <div class="field"><label for="formId">Cost ID *</label><input id="formId"></div>
        <div class="field"><label for="formScenario">Scenario</label>
          <select id="formScenario"><option>ASIS</option><option>TOBE</option><option>MIG</option></select></div>
        <div class="field"><label for="formType">Cost Type</label>
          <select id="formType"><option>HW</option><option>CLOUD</option><option>MW</option><option>DB</option><option>OPS</option><option>OTHER</option><option>MIGRATION</option></select></div>
        <div class="field"><label for="formAmount">Amount *</label><input id="formAmount" type="number" step="0.01"></div>
        <div class="field field-span"><label for="formRemark">비고</label><input id="formRemark"></div>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" type="button" data-close="true">취소</button>
        <button class="btn-primary" type="button" id="saveBtn">저장</button>
      </div>
    </div>
  </div>
  <script src="/_shared/error-codes.js"></script>
  <script src="/_shared/error-popup.js"></script>
  <script src="/_shared/infra-api.js"></script>
  <script src="/_shared/infra-nav.js?v=nav1"></script>
  <script src="/_shared/infra-combo.js"></script>
  <script src="/infra/tco/tco.js"></script>
</body>
</html>
